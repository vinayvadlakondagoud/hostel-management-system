
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>All Students</title>
  <link rel="stylesheet" href="admin-home.css?v=4" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <h2><i class="ri-team-line"></i> All Students</h2>
    <ul>
      <button class="btn ghost" id="btnBack">Back</button>
    </ul>
  </nav>

  <!-- Content -->
  <main class="content">
    <h1>All Registered Students</h1>
    <p class="subtitle">Complete profile details of all students 📋</p>

    <div class="table-container">
      <table id="studentsTable">
        <thead>
          <tr>
            <th>Username</th>
            <th>Gender</th>
            <th>Email</th>
            <th>Contact</th>
            <th>Course</th>
            <th>Year</th>
            <th>Semester</th>
            <th>Previous College</th>
            <th>Result</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

<script>
  async function loadStudents() {
    try {
      const [usersRes, detailsRes] = await Promise.all([
        fetch("https://hostel-management-system-2-2x8y.onrender.com/users"),
        fetch("https://hostel-management-system-2-2x8y.onrender.com/student-details")
      ]);

      const users = await usersRes.json();
      const details = await detailsRes.json();

      const tbody = document.querySelector("#studentsTable tbody");
      tbody.innerHTML = "";

      users.forEach(user => {
        const extra = details.find(d => d.username === user.username) || {};
        const row = `
          <tr>
            <td>${user.username}</td>
            <td>${user.gender}</td>
            <td>${user.email}</td>
            <td>${user.contact}</td>
            <td>${extra.course || "-"}</td>
            <td>${extra.year || "-"}</td>
            <td>${extra.semester || "-"}</td>
            <td>${extra.prev_college || "-"}</td>
            <td>${extra.prev_result || "-"}</td>
            <td>${extra.room_no || "-"}</td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    } catch (err) {
      console.error("Error loading students:", err);
    }
  }

 // --------------------------------------
// STEP 1: STORE PREVIOUS PAGE
// --------------------------------------
(function(){
    const ref = document.referrer;

    if (ref.includes("warden-kitchen.html")) {
        localStorage.setItem("notices_back", "warden-kitchen.html");
    }
    else if (ref.includes("warden-maintenance.html")) {
        localStorage.setItem("notices_back", "warden-maintenance.html");
    }
    else if (ref.includes("warden-education.html")) {
        localStorage.setItem("notices_back", "warden-education.html");
    }
})();

// --------------------------------------
// STEP 2: BACK BUTTON HANDLER
// --------------------------------------
document.getElementById("btnBack").addEventListener("click", () => {
    const target = localStorage.getItem("notices_back");
    if (target) location.href = target;
    else location.href = "warden-kitchen.html"; // fallback
});
  
  loadStudents();
</script>
</body>
</html>
