<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Warden Register - Hostel Management</title>
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --bg:#f6f8fb; --card:#ffffff; --muted:#64748b; --primary:#0ea5a4;
    --accent:#2563eb; --danger:#ef4444; --shadow: 0 6px 18px rgba(20,24,40,0.08); --radius:12px; --max-width:1100px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  body { background: linear-gradient(180deg,#eef2ff 0%, var(--bg) 100%); color:#0f172a; padding:28px; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; }
  .container { width:100%; max-width:var(--max-width); margin: 10px auto; }
  .navbar { display:flex; align-items:center; justify-content:space-between; background:transparent; margin-bottom:18px; }
  .brand { display:flex; gap:12px; align-items:center; font-weight:700; font-size:18px; color:var(--accent); }
  .brand .logo-mark { width:44px; height:44px; border-radius:10px; background:linear-gradient(135deg,var(--primary),var(--accent)); display:grid; place-items:center; color:white; font-weight:800; box-shadow:var(--shadow); }
  .card { background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
  .card h1{ font-size:20px; color:#0f172a; margin-bottom:12px; }
  .small{ font-size:13px; color:var(--muted); }
  .register-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #e6eef6; background:transparent; outline:none; font-size:14px; margin-top:6px; }
  .input:focus { box-shadow:0 6px 18px rgba(37,99,235,0.06); border-color:rgba(37,99,235,0.18); }
  .input-group { position:relative; }
  .toggle-eye { position:absolute; right:12px; top:12px; cursor:pointer; color:var(--muted); }
  .button { padding:12px 14px; border-radius:10px; border:none; background:linear-gradient(90deg,var(--accent),var(--primary)); color:white; font-weight:700; cursor:pointer; }
  .button.ghost { background:transparent; color:var(--accent); border:1px solid rgba(37,99,235,0.08); }
  .msg { font-size:13px; margin-top:8px;}
  @media (max-width:900px){ .register-grid{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <header class="navbar">
      <div class="brand">
        <div class="logo-mark">WR</div>
        <div>
          <div style="font-size:14px;">HOSTEL MANAGEMENT</div>
          <div style="font-size:12px; color:var(--muted); margin-top:4px;">Warden Registration</div>
        </div>
      </div>
      <div class="small"><a href="warden-login.html" style="color:var(--accent); text-decoration:none;">Back to login</a></div>
    </header>

    <main style="max-width:840px; margin:auto;">
      <div class="card">
        <h1>Create Warden Account</h1>
        <p class="small" style="margin-bottom:12px;">Fill details carefully — username & password will be matched exactly at login (case-sensitive).</p>

        <form id="wardenRegisterForm">
          <div class="register-grid">
            <div>
              <label class="small">Full Name</label>
              <input class="input" id="fullname" type="text" required oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')" placeholder="e.g. Ramesh Kumar" />
            </div>

            <div>
              <label class="small">Username</label>
              <input class="input" id="username" type="text" required placeholder="Case-sensitive username" />
            </div>

            <div>
              <label class="small">Email</label>
              <input class="input" id="email" type="email" required placeholder="warden@hostel.edu" />
            </div>

            <div>
              <label class="small">Contact Number</label>
              <input class="input" id="contact" maxlength="10" required placeholder="10-digit mobile" oninput="this.value=this.value.replace(/[^0-9]/g,'')" />
            </div>

            <div>
              <label class="small">Password</label>
              <div class="input-group">
                <input class="input" id="password" type="password" required placeholder="8+ chars, upper, lower, number & special" />
                <i class="fas fa-eye toggle-eye" id="toggleRegPass"></i>
              </div>
            </div>

            <div>
              <label class="small">Confirm Password</label>
              <div class="input-group">
                <input class="input" id="confirm_password" type="password" required placeholder="Confirm password" />
                <i class="fas fa-eye toggle-eye" id="toggleRegConfirm"></i>
              </div>
            </div>
          </div>

          <div style="margin-top:12px; display:flex; gap:8px;">
  <button class="button" id="createBtn" type="submit">Create Account</button>
  <button class="button ghost" type="button" onclick="location.href='index.html'">Cancel</button>
</div>

          <p id="regMsg" class="small msg" style="margin-top:10px;"></p>
        </form>
      </div>
    </main>
  </div>

<!-- And replace the existing <script>...</script> with this script (or merge the changes) -->
<script>
  ['toggleRegPass','toggleRegConfirm'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('click', ()=>{
      const target = id === 'toggleRegPass' ? document.getElementById('password') : document.getElementById('confirm_password');
      if(!target) return;
      target.type = target.type === 'password' ? 'text' : 'password';
      el.classList.toggle('fa-eye-slash');
    });
  });

  const form = document.getElementById('wardenRegisterForm');
  const msg = document.getElementById('regMsg');
  const createBtn = document.getElementById('createBtn');

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    msg.style.color = '#111';
    msg.innerText = 'Validating...';

    const fullname = document.getElementById('fullname').value.trim();
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const contact = document.getElementById('contact').value.trim();
    const pass = document.getElementById('password').value;
    const confirm = document.getElementById('confirm_password').value;

    if (fullname.length < 3) { msg.style.color='red'; msg.innerText='Name must be at least 3 characters.'; return; }
    const emailPattern = /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[A-Za-z]{2,}$/;
    if (!emailPattern.test(email)) { msg.style.color='red'; msg.innerText='Enter a valid email.'; return; }
    if (contact.length !== 10) { msg.style.color='red'; msg.innerText='Contact number must be 10 digits.'; return; }
    const passPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#]).{8,}$/;
    if (!passPattern.test(pass)) { msg.style.color='red'; msg.innerText='Password must have 8+ chars, uppercase, lowercase, number & special char.'; return; }
    if (pass !== confirm) { msg.style.color='red'; msg.innerText='Passwords do not match.'; return; }

    // disable UI while request pending
    createBtn.disabled = true;
    createBtn.style.opacity = '0.7';
    msg.style.color = '#111';
    msg.innerText = 'Creating account...';

try {
            const res = await fetch("https://hostel-management-system-2-2x8y.onrender.com/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
            });

            const data = await res.json();
            document.getElementById("msg").innerText = data.message;

            if (res.ok) {
                // Registration successful, store data and redirect
                localStorage.setItem("userData", JSON.stringify({
                    username: formData.username,
                    email: formData.email,
                    contact: formData.contact
                }));
                setTimeout(() => window.location.href = "jobdetails.html", 1500);
            } else {
                verifyOtpButton.disabled = true;
            }

        } catch (err) {
            document.getElementById("msg").innerText = "❌ Server error during registration!";
            verifyOtpButton.disabled = true;
        }
    });
</script>
</body>
</html>
