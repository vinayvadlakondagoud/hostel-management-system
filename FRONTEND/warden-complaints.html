<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Warden — Complaints</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    :root{
      --bg: #f6f7fb;
      --card: #ffffff;
      --muted:#6b7280;
      --accent1:#4f46e5;
      --accent2:#8f94fb;
      --success:#16a34a;
      --danger:#dc2626;
    }
    html,body{ height:100%; margin:0; font-family:Inter,system-ui,Arial; background:var(--bg); color:#0f172a; }
    .navbar{
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 22px; background:linear-gradient(90deg,#0f172a, #1e293b);
      color:#fff; box-shadow:0 6px 24px rgba(2,6,23,0.2); position:sticky; top:0; z-index:1000;
    }
    .navbar h1{ font-size:1.05rem; margin:0; display:flex; gap:10px; align-items:center; font-weight:700; }
    .container{ max-width:1200px; margin:20px auto; padding:0 18px; }
    .card{ background:var(--card); border-radius:12px; padding:18px; box-shadow:0 8px 26px rgba(15,23,42,0.06); }
    .controls{ display:flex; gap:12px; margin-bottom:14px; align-items:center; flex-wrap:wrap; }
    .search, .select { padding:10px 12px; border-radius:10px; border:1px solid #eef2ff; outline:none; font-size:0.95rem; }
    .badge { background:linear-gradient(90deg,var(--accent1),var(--accent2)); color:#fff; padding:8px 12px; border-radius:10px; font-weight:700; display:inline-flex; gap:8px; align-items:center; }
    .list { margin-top:12px; border-radius:10px; overflow:hidden; }
    .list .header, .list .item{ display:grid; grid-template-columns: 0.6fr 2fr 1fr 1fr 1fr 1fr; gap:12px; padding:12px 16px; align-items:center; }
    .list .header{ background:#f3f4ff; color:#111827; font-weight:700; border-bottom:1px solid #eef2ff; }
    .list .item{ background:var(--card); border-bottom:1px solid #f3f4f6; }
    .subject { font-weight:600; color:#0f172a; }
    .small { font-size:0.86rem; color:var(--muted); }
    .actions { display:flex; gap:8px; justify-self:end; }
    .btn { padding:8px 12px; border-radius:10px; border:none; cursor:pointer; font-weight:700; }
    .btn-primary{ background:var(--accent1); color:#fff; }
    .btn-ghost{ background:transparent; border:1px solid #e6eefc; color:#0f172a; }
    .btn-danger{ background:var(--danger); color:#fff; }
    .status-new{ background:#fffbeb; color:#92400e; padding:6px 10px; border-radius:999px; font-weight:700; display:inline-block; }
    .status-progress{ background:#eff6ff; color:#1e3a8a; padding:6px 10px; border-radius:999px; font-weight:700; display:inline-block; }
    .status-resolved{ background:#ecfdf5; color:#065f46; padding:6px 10px; border-radius:999px; font-weight:700; display:inline-block; }
    .empty { text-align:center; padding:30px; color:var(--muted); }
    #loading { padding:18px; text-align:center; color:var(--muted); }

    /* modal */
    .modal-backdrop{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(2,6,23,0.45); z-index:2000; }
    .modal{ width:100%; max-width:760px; background:var(--card); border-radius:12px; padding:18px; box-shadow:0 30px 80px rgba(2,6,23,0.4); }
    .modal h3{ margin:0 0 8px 0; }
    .form-row{ display:flex; gap:10px; margin-top:12px; }
    .form-row > div{ flex:1; }
    .modal input, .modal textarea, .modal select{ width:100%; padding:10px; border-radius:8px; border:1px solid #eef2ff; }
    .modal .modal-footer{ display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }

    /* responsive */
    @media (max-width:900px){
      .list .header, .list .item{ grid-template-columns: 1fr 1.6fr 1fr 1fr; }
      .list .header > :nth-child(5), .list .item > :nth-child(5){ display:none; }
      .list .header > :nth-child(6), .list .item > :nth-child(6){ display:none; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <h1><i class="ri-shield-user-line" style="font-size:1.2rem"></i> Warden Panel — Complaints</h1>
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="btn btn-ghost" onclick="window.location.href='admin-home.html'">Dashboard</button>
      <button class="btn btn-ghost" onclick="window.location.href='home.html'">Public Site</button>
    </div>
  </nav>

  <main class="container">
    <!-- firebase fatal banner will be inserted here by showFatal() if needed -->
    <div id="mainCard" class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div style="display:flex;flex-direction:column;">
          <div style="display:flex;gap:12px;align-items:center;">
            <div class="badge"><i class="ri-alert-line"></i> Complaints</div>
            <div id="summary" class="small">Loading…</div>
          </div>
          <div style="margin-top:6px;" class="small">All complaints recorded in the system. Warden can view, update status and delete (delete shown only for resolved complaints).</div>
        </div>

        <div style="display:flex;gap:10px;align-items:center;">
          <input id="searchInput" class="search" placeholder="Search subject, location or username" />
          <select id="statusFilter" class="select">
            <option value="All">All</option>
            <option value="New">New</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
          <button class="btn btn-primary" id="refreshBtn"><i class="ri-refresh-line"></i> Refresh</button>
        </div>
      </div>

      <div class="list" id="complaintList" style="margin-top:14px;">
        <div class="header">
          <div>ID</div>
          <div>Subject & Date</div>
          <div>Category</div>
          <div>Location</div>
          <div>User</div>
          <div>Actions</div>
        </div>
        <div id="loading">Loading complaints...</div>
      </div>
    </div>
  </main>

  <!-- Modal for details & status update -->
  <div id="detailModal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>Complaint Details <small id="modalID" class="small"></small></h3>
      <div style="margin-top:8px;">
        <p id="modalSubject" style="font-weight:700; margin:0"></p>
        <p id="modalDescription" style="white-space:pre-wrap; color:#374151; margin-top:8px;"></p>

        <div class="form-row">
          <div>
            <label class="small">Category</label>
            <input id="modalCategory" readonly />
          </div>
          <div>
            <label class="small">Location</label>
            <input id="modalLocation" readonly />
          </div>
        </div>

        <div style="margin-top:10px;">
          <label class="small">Submitted by</label>
          <input id="modalUser" readonly />
        </div>

        <div style="margin-top:10px;">
          <label class="small">Status</label>
          <select id="modalStatus">
            <option>New</option>
            <option>In Progress</option>
            <option>Resolved</option>
          </select>
        </div>

        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="closeModal()">Close</button>
          <button class="btn btn-primary" id="saveStatusBtn">Save Status</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* Improved showFatal: replaces old Firebase-banner code and points to warden flow */
    function showFatal(msg, options = {}) {
      const existing = document.getElementById('firebase-fatal-banner');
      if (existing) existing.remove();

      const banner = document.createElement('div');
      banner.id = 'firebase-fatal-banner';
      banner.style.background = '#fff7ed';
      banner.style.color = '#7c2d12';
      banner.style.padding = '14px';
      banner.style.borderRadius = '8px';
      banner.style.margin = '12px auto';
      banner.style.display = 'flex';
      banner.style.alignItems = 'center';
      banner.style.justifyContent = 'space-between';
      banner.style.gap = '12px';
      banner.style.boxShadow = '0 6px 20px rgba(15, 23, 42, 0.06)';
      banner.style.maxWidth = '1200px';

      const left = document.createElement('div');
      left.style.display = 'flex';
      left.style.flexDirection = 'column';
      left.style.gap = '6px';

      const title = document.createElement('div');
      title.style.fontWeight = '700';
      title.innerText = msg || 'Firebase configuration missing — warden complaints cannot load via Firebase. Falling back to local backend.';

      const sub = document.createElement('div');
      sub.style.fontSize = '0.92rem';
      sub.style.color = '#7a5230';
      sub.innerText = options.detail || 'Showing complaints from the local backend. Use the button to open/refresh the Warden view.';

      left.appendChild(title);
      left.appendChild(sub);

      const actions = document.createElement('div');
      actions.style.display = 'flex';
      actions.style.gap = '8px';
      actions.style.alignItems = 'center';

      const wardenBtn = document.createElement('button');
      wardenBtn.innerText = 'Open Warden Complaints';
      wardenBtn.className = 'btn-primary';
      wardenBtn.style.padding = '8px 12px';
      wardenBtn.style.borderRadius = '8px';
      wardenBtn.onclick = () => { window.location.href = 'warden-complaints.html'; };

      const closeBtn = document.createElement('button');
      closeBtn.innerText = 'Dismiss';
      closeBtn.className = 'btn-ghost';
      closeBtn.style.padding = '8px 12px';
      closeBtn.onclick = () => { const ex = document.getElementById('firebase-fatal-banner'); if (ex) ex.remove(); };

      actions.appendChild(wardenBtn);
      actions.appendChild(closeBtn);

      banner.appendChild(left);
      banner.appendChild(actions);

      document.body.insertBefore(banner, document.body.firstChild);
    }

    // Expose closeModal globally for inline buttons
    window.closeModal = function() {
      const m = document.getElementById('detailModal');
      if (m) m.style.display = 'none';
    };

    // Basic app state
    window.allComplaints = [];
    const API_BASE = 'https://hostel-management-system-2-2x8y.onrender.com';

    // Fetch and render
    async function fetchComplaints() {
      const list = document.getElementById('complaintList');
      const loadingEl = document.getElementById('loading');
      try {
        loadingEl.innerText = 'Loading complaints from backend...';
        loadingEl.style.display = 'block';
        const r = await fetch(API_BASE + '/complaints', { cache: 'no-store' });
        if (!r.ok) throw new Error('Failed to fetch complaints');
        const arr = await r.json();
        window.allComplaints = (arr || []).map(c => ({
          id: c.id,
          subject: c.subject,
          description: c.description,
          category: c.category,
          location: c.location,
          username: c.username || c.user || 'Guest',
          status: c.status || 'New',
          created_at: c.created_at
        }));
        loadingEl.style.display = 'none';
        renderComplaints();
      } catch (err) {
        console.error('Fetch complaints error', err);
        loadingEl.innerText = 'Error loading complaints.';
        showFatal('Firebase configuration (appId / firebaseConfig) is missing — warden complaints loaded from backend.', { detail: 'Using local backend: ' + API_BASE });
      }
    }

    function renderComplaints() {
      const list = document.getElementById('complaintList');
      const loadingEl = document.getElementById('loading');
      // remove existing items
      const existing = list.querySelectorAll('.item'); existing.forEach(n=>n.remove());
      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const filterStatus = (document.getElementById('statusFilter').value || 'All').toLowerCase();

      const filtered = (window.allComplaints || []).filter(c => {
        const cstatus = (c.status || '').toLowerCase();
        const matchesStatus = filterStatus === 'all' || cstatus === filterStatus;
        const searchable = `${c.subject||''} ${c.location||''} ${c.username||''}`.toLowerCase();
        const matchesQuery = !q || searchable.indexOf(q) !== -1;
        return matchesStatus && matchesQuery;
      });

      // update summary
      const unresolved = (window.allComplaints || []).filter(c => (c.status || '').toLowerCase() !== 'resolved').length;
      document.getElementById('summary').innerText = `${filtered.length} shown • ${unresolved} unresolved`;

      if (!filtered.length) {
        if (loadingEl) { loadingEl.innerText = 'No complaints found.'; loadingEl.style.display = 'block'; }
        return;
      } else {
        if (loadingEl) loadingEl.style.display = 'none';
      }

      filtered.forEach(c => {
        const item = document.createElement('div');
        item.className = 'item';

        const idCol = document.createElement('div'); idCol.innerText = c.id;
        const subjCol = document.createElement('div');
        subjCol.innerHTML = `<div class="subject">${(c.subject||'—')}</div><div class="small">${new Date(c.created_at).toLocaleString()}</div>`;
        const catCol = document.createElement('div'); catCol.innerText = c.category || '—';
        const locCol = document.createElement('div'); locCol.innerText = c.location || '—';
        const userCol = document.createElement('div'); userCol.innerText = c.username || 'Guest';

        const actCol = document.createElement('div'); actCol.className = 'actions';

        // Details button
        const detailsBtn = document.createElement('button');
        detailsBtn.className = 'btn btn-ghost';
        detailsBtn.innerText = 'Details';
        detailsBtn.onclick = () => showDetailsFor(c.id);
        actCol.appendChild(detailsBtn);

        // Quick status button
        const quickBtn = document.createElement('button');
        quickBtn.className = 'btn btn-primary';
        quickBtn.innerText = (c.status === 'Resolved') ? 'Resolved' : (c.status === 'In Progress' ? 'In Progress' : 'Mark In Progress');
        quickBtn.title = 'Quick status toggle';
        quickBtn.onclick = async () => {
          // Toggle between New -> In Progress -> Resolved
          let newStatus = 'In Progress';
          if (c.status === 'In Progress') newStatus = 'Resolved';
          if (c.status === 'Resolved') newStatus = 'New'; // allow cycle
          try {
            quickBtn.disabled = true; quickBtn.innerText = 'Saving...';
            const resp = await fetch(API_BASE + '/complaints/' + c.id, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ status: newStatus }) });
            const ct = (resp.headers.get('content-type') || '').toLowerCase();
            let body;
            if (ct.includes('application/json')) body = await resp.json(); else body = await resp.text();
            if (!resp.ok) throw new Error((body && body.error) ? body.error : (typeof body === 'string' ? body : JSON.stringify(body)));
            // update local
            const idx = window.allComplaints.findIndex(x=>x.id == c.id);
            if (idx !== -1) { window.allComplaints[idx].status = newStatus; }
            renderComplaints();
          } catch (err) {
            alert('Could not update status: ' + (err && err.message ? err.message : err));
            console.error('Quick status error', err);
          } finally { quickBtn.disabled = false; }
        };
        actCol.appendChild(quickBtn);

        // Delete button: **only append when complaint status is Resolved**
        if ((c.status || '').toLowerCase() === 'resolved') {
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'btn btn-danger';
          deleteBtn.innerText = 'Delete';
          deleteBtn.title = 'Delete complaint (allowed only for resolved complaints)';
          deleteBtn.onclick = async () => {
            if (!confirm('Are you sure you want to DELETE this complaint? This action cannot be undone.')) return;
            try {
              deleteBtn.disabled = true; deleteBtn.innerText = 'Deleting...';
              const resp = await fetch(API_BASE + '/complaints/' + c.id, { method: 'DELETE' });
              let body;
              const ct = (resp.headers.get('content-type') || '').toLowerCase();
              if (ct.includes('application/json')) body = await resp.json(); else body = await resp.text();
              if (!resp.ok) {
                const msg = (body && body.error) ? body.error : (typeof body === 'string' ? body : JSON.stringify(body));
                throw new Error(msg || 'Delete failed');
              }
              // Remove from local array and re-render
              window.allComplaints = window.allComplaints.filter(x => x.id != c.id);
              renderComplaints();
              alert('Complaint deleted successfully.');
            } catch (err) {
              alert('Could not delete complaint: ' + (err && err.message ? err.message : err));
              console.error('Delete error', err);
            } finally {
              deleteBtn.disabled = false; deleteBtn.innerText = 'Delete';
            }
          };
          actCol.appendChild(deleteBtn);
        }

        item.appendChild(idCol);
        item.appendChild(subjCol);
        item.appendChild(catCol);
        item.appendChild(locCol);
        item.appendChild(userCol);
        item.appendChild(actCol);

        list.appendChild(item);
      });
    }

    function showDetailsFor(id) {
      const c = window.allComplaints.find(x=>x.id == id);
      if (!c) return alert('Complaint not found');
      document.getElementById('modalID').innerText = '#' + c.id;
      document.getElementById('modalSubject').innerText = c.subject || '';
      document.getElementById('modalDescription').innerText = c.description || '';
      document.getElementById('modalCategory').value = c.category || '';
      document.getElementById('modalLocation').value = c.location || '';
      document.getElementById('modalUser').value = c.username || '';
      document.getElementById('modalStatus').value = c.status || 'New';
      document.getElementById('detailModal').style.display = 'flex';

      const saveBtn = document.getElementById('saveStatusBtn');
      saveBtn.disabled = false; saveBtn.innerText = 'Save Status';
      saveBtn.onclick = async () => {
        const newStatus = document.getElementById('modalStatus').value;
        try {
          saveBtn.disabled = true; saveBtn.innerText = 'Saving...';
          const resp = await fetch(API_BASE + '/complaints/' + c.id, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ status: newStatus }) });
          const ct = (resp.headers.get('content-type') || '').toLowerCase();
          let body;
          if (ct.includes('application/json')) body = await resp.json(); else body = await resp.text();
          if (!resp.ok) throw new Error((body && body.error) ? body.error : (typeof body === 'string' ? body : JSON.stringify(body)));
          // update local array and re-render
          const idx = window.allComplaints.findIndex(x=>x.id == c.id);
          if (idx !== -1) { window.allComplaints[idx].status = newStatus; }
          closeModal();
          renderComplaints();
        } catch (err) {
          alert('Could not update status: ' + (err && err.message ? err.message : err));
          console.error('Status update failed', err);
        } finally {
          saveBtn.disabled = false; saveBtn.innerText = 'Save Status';
        }
      };
    }

    // wire up search/filter/refresh
    document.getElementById('searchInput').addEventListener('input', () => renderComplaints());
    document.getElementById('statusFilter').addEventListener('change', () => renderComplaints());
    document.getElementById('refreshBtn').addEventListener('click', () => { fetchComplaints(); });

    // initial load
    fetchComplaints();
  </script>
</body>
</html>
