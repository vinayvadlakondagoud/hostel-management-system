<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Warden Education - Messages</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="max-w-6xl mx-auto py-6 px-4">
    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">Warden Messages - Education</h1>
        <p class="text-xs text-slate-500">Chat with Students and Admin</p>
      </div>
      <a href="warden-education.html" class="text-sm text-blue-600 hover:underline">← Back to Warden Dashboard</a>
    </header>

    <!-- New Message -->
    <section class="bg-white shadow rounded-xl p-4 mb-6">
      <h2 class="text-lg font-semibold mb-3 text-slate-800">Send Message</h2>

      <div class="grid gap-3 md:grid-cols-3 mb-3">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Send To</label>
          <select id="wardenRecipientType"
                  class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring focus:ring-blue-200">
            <option value="">Select recipient</option>
            <option value="user">User (Student)</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div id="wardenUserSelectWrapper" class="hidden md:col-span-2">
          <label class="block text-sm font-medium text-slate-600 mb-1">Select User</label>
          <select id="wardenUserSelect"
                  class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring focus:ring-blue-200">
            <option value="">Loading...</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Message</label>
        <textarea id="wardenMessageInput"
                  rows="3"
                  class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring focus:ring-blue-200"
                  placeholder="Type your message here..."></textarea>
      </div>

      <div class="mt-3 flex justify-end">
        <button id="wardenSendBtn"
                class="px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white hover:bg-blue-700">
          Send
        </button>
      </div>
      <p id="wardenMsgStatus" class="text-xs mt-2 text-slate-500"></p>
    </section>

    <!-- Inbox -->
    <section class="bg-white shadow rounded-xl p-4">
      <div class="flex items-center justify-between mb-3">
  <h2 class="text-lg font-semibold text-slate-800">Conversation History</h2>
  <div class="flex items-center gap-2">
    <div class="space-x-1">
      <button id="tabWardenInbox" class="px-3 py-1 rounded-lg border border-slate-300 bg-white text-sm">Inbox</button>
      <button id="tabWardenSent"  class="px-3 py-1 rounded-lg border border-slate-300 text-sm">Sent</button>
    </div>
    <button id="refreshBtn" class="text-xs px-3 py-1 rounded-lg border border-slate-300 hover:bg-slate-50">
      Refresh
    </button>
  </div>
</div>
      <div id="wardenMessagesList" class="space-y-3 max-h-[500px] overflow-y-auto text-sm"></div>
    </section>
  </div>

<script>
const API = "https://hostel-management-system-2-2x8y.onrender.com";

// CHANGE THIS ONLY per page:
//  education -> for warden-edu-message.html
//  kitchen   -> for warden-kitchen-message.html
//  maintenance -> for warden-main-message.html
const WARDEN_ROLE = "education";

const wardenUsername = localStorage.getItem("username"); // same as other warden pages

if (!wardenUsername) {
  alert("Please login as Warden first.");
  window.location.href = "warden-login.html";
}

const wardenRecipientType = document.getElementById("wardenRecipientType");
const wardenUserSelectWrapper = document.getElementById("wardenUserSelectWrapper");
const wardenUserSelect = document.getElementById("wardenUserSelect");
const wardenMessageInput = document.getElementById("wardenMessageInput");
const wardenSendBtn = document.getElementById("wardenSendBtn");
const wardenMsgStatus = document.getElementById("wardenMsgStatus");
const wardenMessagesList = document.getElementById("wardenMessagesList");
const wardenRefreshBtn = document.getElementById("wardenRefreshBtn");

wardenRecipientType.addEventListener("change", () => {
  const v = wardenRecipientType.value;
  if (v === "user") {
    wardenUserSelectWrapper.classList.remove("hidden");
    loadUsersForWarden();
  } else {
    wardenUserSelectWrapper.classList.add("hidden");
  }
});

async function loadUsersForWarden() {
  try {
    const res = await fetch(API + "/users");
    const data = await res.json().catch(() => []);
    wardenUserSelect.innerHTML = '<option value="">Select user</option>';
    data.forEach(u => {
      const opt = document.createElement("option");
      opt.value = u.username;
      opt.textContent = u.username + (u.email ? ` (${u.email})` : "");
      wardenUserSelect.appendChild(opt);
    });
  } catch (err) {
    console.error("loadUsersForWarden error", err);
    wardenUserSelect.innerHTML = '<option value="">Failed to load users</option>';
  }
}

function getWardenRecipientInfo() {
  const v = wardenRecipientType.value;
  if (v === "admin") {
    return { recipient_role: "admin", recipient_username: null, recipient_warden_role: null };
  }
  if (v === "user") {
    const u = wardenUserSelect.value;
    if (!u) return null;
    return { recipient_role: "user", recipient_username: u, recipient_warden_role: null };
  }
  return null;
}

async function wardenSendMessage() {
  wardenMsgStatus.textContent = "";
  const rec = getWardenRecipientInfo();
  const content = wardenMessageInput.value.trim();

  if (!rec) {
    wardenMsgStatus.style.color = "red";
    wardenMsgStatus.textContent = "Please select a valid recipient.";
    return;
  }
  if (!content) {
    wardenMsgStatus.style.color = "red";
    wardenMsgStatus.textContent = "Message cannot be empty.";
    return;
  }

  wardenSendBtn.disabled = true;
  wardenSendBtn.textContent = "Sending...";

  try {
    const res = await fetch(API + "/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sender_role: "warden",
        sender_username: wardenUsername,
        sender_warden_role: WARDEN_ROLE,
        recipient_role: rec.recipient_role,
        recipient_username: rec.recipient_username,
        recipient_warden_role: rec.recipient_warden_role,
        content
      })
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || "Failed to send");

    wardenMsgStatus.style.color = "green";
    wardenMsgStatus.textContent = "Message sent.";
    wardenMessageInput.value = "";
    await loadWardenMessages();
  } catch (err) {
    console.error("wardenSendMessage error", err);
    wardenMsgStatus.style.color = "red";
    wardenMsgStatus.textContent = err.message || "Error sending message.";
  } finally {
    wardenSendBtn.disabled = false;
    wardenSendBtn.textContent = "Send";
  }
}

function labelFromRole(role, wardenRole, username) {
  role = (role || "").toLowerCase();
  const w = (wardenRole || "").toLowerCase();
  if (role === "admin") return "Admin";
  if (role === "user") return username || "User";
  if (role === "warden") {
    if (w === "education") return "Warden - Education";
    if (w === "kitchen") return "Warden - Kitchen";
    if (w === "maintenance") return "Warden - Maintenance";
    return "Warden";
  }
  return username || "Unknown";
}

function renderWardenMessages(list) {
  const inboxList = [];
  const sentList = [];
  if (!list || list.length === 0) {
    wardenMessagesList.innerHTML = '<p class="text-slate-400 text-sm">No messages yet.</p>';
    return;
  }

  list.forEach(m => {
    const recIsMe = (m.recipient_role === 'warden' && m.recipient_warden_role === WARDEN_ROLE && m.recipient_username === wardenUsername) ||
                    (m.recipient_role === 'warden' && m.recipient_warden_role === WARDEN_ROLE && !m.recipient_username);
    const sentIsMe = (m.sender_role === 'warden' && m.sender_warden_role === WARDEN_ROLE && m.sender_username === wardenUsername);
    if (sentIsMe) sentList.push(m);
    else if (recIsMe) inboxList.push(m);
    else inboxList.push(m);
  });

  function makeHtml(arr) {
    if (!arr || arr.length === 0) return '<p class="text-slate-400 text-sm">No messages here.</p>';
    return arr.map(m => {
      const from = labelFromRole(m.sender_role, m.sender_warden_role, m.sender_username);
      const to = labelFromRole(m.recipient_role, m.recipient_warden_role, m.recipient_username);
      const ts = new Date(m.created_at).toLocaleString();
      const body = (m.content || "").replace(/\n/g, "<br>");
      return `<div class="border rounded-lg px-3 py-2">
                <div class="font-semibold text-slate-800">${from} <span class="text-xs text-slate-400">→ ${to}</span></div>
                <div class="mt-1 text-slate-700">${body}</div>
                <div class="text-xs text-slate-500 mt-1">${ts}</div>
              </div>`;
    }).join("");
  }

  wardenMessagesList.innerHTML = `
    <div id="wardenInboxContainer" class="space-y-3">${makeHtml(inboxList)}</div>
    <div id="wardenSentContainer" class="space-y-3 hidden">${makeHtml(sentList)}</div>
  `;

  document.getElementById("tabWardenInbox").onclick = () => {
    document.getElementById("wardenInboxContainer").classList.remove("hidden");
    document.getElementById("wardenSentContainer").classList.add("hidden");
  };
  document.getElementById("tabWardenSent").onclick = () => {
    document.getElementById("wardenSentContainer").classList.remove("hidden");
    document.getElementById("wardenInboxContainer").classList.add("hidden");
  };
}


async function loadWardenMessages() {
  try {
    const url = `${API}/messages?viewer_role=warden&warden_role=${encodeURIComponent(WARDEN_ROLE)}&viewer_username=${encodeURIComponent(wardenUsername)}`;
    const res = await fetch(url);
    const data = await res.json().catch(() => []);
    renderWardenMessages(data);
  } catch (err) {
    console.error("loadWardenMessages error", err);
    wardenMessagesList.innerHTML = '<p class="text-red-500 text-sm">Failed to load messages.</p>';
  }
}

wardenSendBtn.addEventListener("click", wardenSendMessage);
wardenRefreshBtn.addEventListener("click", loadWardenMessages);

// initial
loadWardenMessages();
</script>
</body>
</html>
