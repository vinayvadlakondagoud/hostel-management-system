<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admission Requests - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen p-6">
  <div class="max-w-6xl mx-auto">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold">Admission Requests</h1>
      <a class="px-4 py-2 rounded bg-indigo-600 text-white" href="admin-home.html"><i class="fa-solid fa-arrow-left mr-2"></i>Back</a>
    </div>

    <div class="mb-4">
      <button id="refreshBtn" class="px-3 py-2 bg-indigo-500 text-white rounded">Refresh</button>
    </div>

    <div id="requestsContainer" class="space-y-4">
      <!-- Filled by JS -->
    </div>

    <div id="emptyMsg" class="text-gray-500 mt-6 hidden">
      No pending admission cancellation requests.
    </div>
  </div>

<script>
const API_BASE = 'https://hostel-management-system-2-2x8y.onrender.com';

async function fetchRequests() {
const res = await fetch(API_BASE + '/admission-requests?status=Pending');
  if (!res.ok) {
    document.getElementById('requestsContainer').innerHTML = `<div class="text-red-500">Failed to load requests</div>`;
    return;
  }
  const arr = await res.json();
  renderRequests(arr);
}

function renderRequests(list) {
  const cont = document.getElementById('requestsContainer');
  cont.innerHTML = '';
  if (!list || list.length === 0) {
    document.getElementById('emptyMsg').classList.remove('hidden');
    return;
  }
  document.getElementById('emptyMsg').classList.add('hidden');

  list.forEach(r => {
    const card = document.createElement('div');
    card.className = 'p-4 bg-white rounded shadow flex items-start justify-between gap-4';
    const left = document.createElement('div');

    left.innerHTML = `
      <div class="text-lg font-semibold">${r.username} <span class="text-sm text-gray-400">(${r.created_at})</span></div>
      <div class="text-sm text-gray-700 mt-1">Details: ${r.details || '-'}</div>
      <div class="text-sm text-gray-500 mt-1">Status: <strong>${r.status}</strong></div>
    `;

    const right = document.createElement('div');
    right.className = 'flex flex-col gap-2 items-end';

    // Remove Student (Accept) button
    const acceptBtn = document.createElement('button');
    acceptBtn.className = 'px-3 py-2 bg-red-600 text-white rounded font-semibold';
    acceptBtn.innerText = 'Remove Student';
    acceptBtn.onclick = async () => {
      acceptBtn.disabled = true;
      acceptBtn.innerText = 'Accepting...';
      try {
        const res = await fetch(API_BASE + '/admission-requests/' + r.id + '/accept', { method: 'PATCH' });
        if (!res.ok) {
          const j = await res.json().catch(()=>({}));
          alert('Failed to accept: ' + (j.message || res.status));
          acceptBtn.disabled = false;
          acceptBtn.innerText = 'Remove Student';
          return;
        }
        acceptBtn.innerText = 'Accepted';
        acceptBtn.classList.remove('bg-red-600'); acceptBtn.classList.add('bg-gray-400');
        // optionally refresh list
        await fetchRequests();
      } catch (e) {
        alert('Network error');
        acceptBtn.disabled = false;
        acceptBtn.innerText = 'Remove Student';
      }
    };

    // Optional: view full request / delete request
    const delBtn = document.createElement('button');
    delBtn.className = 'px-3 py-2 border rounded text-sm';
    delBtn.innerText = 'Delete Request';
    delBtn.onclick = async () => {
      if (!confirm('Delete this admission request?')) return;
      const res = await fetch(API_BASE + '/admission-requests/' + r.id, { method: 'DELETE' });
      if (!res.ok) { alert('Failed to delete'); return; }
      await fetchRequests();
    };

    right.appendChild(acceptBtn);
    right.appendChild(delBtn);

    card.appendChild(left);
    card.appendChild(right);
    cont.appendChild(card);
  });
}

document.getElementById('refreshBtn').addEventListener('click', fetchRequests);
fetchRequests();
</script>
</body>
</html>
