<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Notices - Warden Management</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

    <style>
      /* --- Professional & Attractive Overrides --- */
      :root{
        --shadow-1: 0 10px 40px rgba(2,6,23,0.08), 0 0 10px rgba(2,6,23,0.04);
        --accentA:#7c3aed;
        --accentB:#06b6d4; 
        --success:#10b981;
        --danger:#ef4444;
      }
      body {
          font-family: 'Inter', sans-serif;
          font-size: 15px; 
          line-height: 1.6;
          background-color: #f8fafc;
          color: #1e293b;
      }
      a { text-decoration: none; color: var(--accentA); }
      .small-muted{ font-size: 0.85rem; color: #6b7280; }
      .wrap{
          max-width: 1400px;
          margin: 0 auto;
          padding: 0 20px 40px; 
      }
      
      /* --- TOP BAR (Header) --- */
      .topbar-bg {
          background: #ffffff; 
          border-bottom: 1px solid rgba(15, 23, 42, 0.04);
          padding-top: 10px;
          padding-bottom: 10px;
          margin-bottom: 18px; 
      }
      .topbar {
          display:flex; 
          justify-content:space-between; 
          align-items:center; 
          max-width:1400px; 
          margin:0 auto; 
          padding:0 20px;
      }
      .btn {
          padding: 10px 18px; 
          border: none;
          border-radius: 6px;
          cursor: pointer;
          font-weight: 600;
          transition: transform .2s ease, box-shadow .2s ease;
      }
      .btn-primary { 
          background-color: var(--accentA);
          color: white;
      }
      .btn-primary:hover{ 
        transform: translateY(-2px); 
        box-shadow: 0 10px 30px rgba(124,58,237,0.25);
      }
      .btn-ghost {
          background: none;
          color: #4b5563;
          padding: 10px 14px; 
      }
      .btn-ghost:hover {
          background: #f1f5f9;
      }
      .btn-danger {
          background: #fee2e2;
          color: var(--danger);
      }
      .btn-danger:hover {
          background: #fecaca;
      }
      .btn-success {
          background: #d1fae5;
          color: var(--success);
      }
      .btn-success:hover {
          background: #a7f3d0;
      }

      /* --- GRID LAYOUT & CARDS --- */
      .grid{
          display: grid;
          grid-template-columns: 280px 1fr; 
          gap: 20px;
      }
      .list-card, .panel {
          background: white;
          border-radius: 12px;
          padding: 24px; 
          box-shadow: var(--shadow-1);
          animation: fadeIn 0.8s ease-out; /* Added effect */
      }
      .list-card { height: 100%; }

      @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
      }

      /* LEFT ASIDE NAV */
      .avatar{
          width: 50px; height: 50px; border-radius: 50%; background: var(--accentA);
          color: white; display: grid; place-items: center; font-weight: 800; font-size: 1.6rem;
      }
      .profile{
          display: flex; gap: 12px; align-items: center; margin-bottom: 20px;
      }
      .nav-links .nav-link {
          display: flex; justify-content: space-between; align-items: center;
          padding: 10px 12px; margin: 6px 0; border-radius: 6px; color: #4b5563;
          transition: background-color .2s ease;
      }
      .nav-links .nav-link.active {
          background: #eef2ff; color: var(--accentA); font-weight: 700;
      }
      
      /* FORM & INPUTS */
      .form-group { margin-bottom: 15px; }
      label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem; }
      input[type="text"], textarea {
          width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 6px;
          font-family: inherit; font-size: 1rem; color: #1e293b;
          transition: border-color 0.2s;
      }
      input[type="text"]:focus, textarea:focus {
          border-color: var(--accentA); outline: none; box-shadow: 0 0 0 3px #eef2ff;
      }
      textarea { min-height: 150px; resize: vertical; }

      /* NOTICE LIST STYLING */
      .notice-item {
          padding: 18px; border-radius: 10px; background: #f8fafc; border: 1px solid #f1f5f9;
          display: flex; justify-content: space-between; align-items: flex-start;
          transition: background-color 0.2s;
      }
      .notice-item:hover { background: #f0f4f8; }
      
      .notice-title { font-weight: 700; font-size: 1.1rem; }
      .notice-body { margin-top: 4px; color: #4b5563; }
      .notice-date { margin-top: 8px; font-size: 0.8rem; color: #9ca3af; }
      
      .notice-actions {
          display: flex; gap: 8px; flex-shrink: 0; margin-left: 20px;
      }
      .notice-actions button {
          padding: 6px 10px; font-size: 0.8rem; font-weight: 700;
      }
      .editor-toggle {
        font-size: 1rem;
        background: var(--success);
        color: white;
        padding: 8px 16px;
      }
      
    </style>
</head>
<body>
  <div class="wrap" role="main">
    <div class="topbar-bg">
        <div class="topbar">
            <div class="brand" style="display:flex; align-items:center; gap:10px;">
                <div class="logo" aria-hidden="true" style="font-weight:800; font-size:1.5rem; color:var(--accentA);">HM</div>
                <div>
                    <div class="title" style="font-weight:800;">Hostel Management — Warden Dashboard</div>
                    <div class="subtitle small-muted">Professional view · Manage notices and announcements</div>
                </div>
            </div>

            <div class="controls" style="display:flex; gap:10px;">
                <button class="btn btn-ghost" id="btn-preview">Preview Site</button>
                <button class="btn btn-primary" id="btn-export"><i class="ri-file-download-line"></i> Export Reports</button>
            </div>
        </div>
    </div>

    <div class="grid">
        <aside class="left-col">
            <div class="panel">
                <div class="profile">
                    <div class="avatar" id="avatar">W</div>
                    <div>
                        <div id="wardenName" style="font-weight:800; font-size:1.1rem">Warden</div>
                        <div class="small-muted" id="wardenEmail">warden@hostel.edu</div>
                    </div>
                </div>

                <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px; border-bottom: 1px solid #f1f5f9; padding-bottom:10px;">
                    <div style="flex:1">
                        <div class="small-muted">Role</div>
                        <div style="font-weight:800">Warden</div>
                    </div>
                </div>

                <nav class="nav-links" aria-label="Warden navigation">
                    <a href="warden-home.html" class="nav-link"><span>Overview</span><i class="ri-home-4-line"></i></a>
                    <a href="warden-complaints.html" class="nav-link"><span>Complaints</span><i class="ri-alert-line"></i></a>
                    <a href="warden-students.html" class="nav-link"><span>Students</span><i class="ri-user-3-line"></i></a>
                    <a href="notices.html" class="nav-link active"><span>Notices</span><i class="ri-notification-line"></i></a>
                    <a href="warden-maintenance.html" class="nav-link"><span>Maintenance</span><i class="ri-tools-line"></i></a>
                    <a href="index.html" id="logout" class="nav-link" style="color:var(--danger)"><span>Logout</span><i class="ri-logout-box-r-line"></i></a>
                </nav>
            </div>
        </aside>

        <section class="right-col">
            
            <div class="header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h1 style="font-size:1.6rem; font-weight:800;">Notices & Announcements</h1>
                <button class="btn editor-toggle" onclick="document.getElementById('noticeForm').style.display = (document.getElementById('noticeForm').style.display === 'none' || document.getElementById('noticeForm').style.display === '') ? 'block' : 'none'; this.textContent = (this.textContent === 'New Notice') ? 'Hide Editor' : 'New Notice';"><i class="ri-add-line"></i> New Notice</button>
            </div>

            <div id="noticeForm" class="panel" style="display:none; margin-bottom: 20px;">
                <h2 style="font-size:1.3rem; font-weight:700; margin-bottom:15px;">Create New Notice</h2>
                <form id="createNoticeForm">
                    <div class="form-group">
                        <label for="noticeTitle">Notice Title (Subject)</label>
                        <input type="text" id="noticeTitle" required placeholder="e.g., Mandatory Fire Drill Schedule" />
                    </div>
                    <div class="form-group">
                        <label for="noticeBody">Notice Body (Details)</label>
                        <textarea id="noticeBody" required placeholder="Provide full details of the announcement..."></textarea>
                    </div>
                    <div style="text-align:right; margin-top:20px;">
                        <button type="submit" class="btn btn-primary" style="margin-right:10px;"><i class="ri-send-plane-line"></i> Publish Notice</button>
                        <button type="reset" class="btn btn-ghost" onclick="document.getElementById('noticeForm').style.display='none'; document.querySelector('.editor-toggle').textContent='New Notice';">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="list-card">
                <h2 style="font-size:1.3rem; font-weight:700;">Published Notices</h2>
                <div id="noticeList" style="display:flex; flex-direction:column; gap:12px; margin-top:15px;">
                    <div style="text-align:center; padding: 20px;" class="small-muted">Loading published notices...</div>
                    </div>
            </div>

        </section>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js" defer></script>
<script>
    (function() {
        // Use the same API link as warden-kitchen.html
        const API = "https://hostel-management-system-2-2x8y.onrender.com"; //
        const noticesContainer = document.getElementById('noticesContainer');
        const newNoticeModal = document.getElementById('newNoticeModal');
        const newNoticeForm = document.getElementById('newNoticeForm');

        // Function exposed globally for creating a new notice
        window.createNotice = async (event) => { // MODIFIED: Added async and API call
            event.preventDefault();

            const title = document.getElementById('newTitle').value.trim();
            const body = document.getElementById('newBody').value.trim();

            if (!title || !body) {
                alert('Title and body cannot be empty.');
                return;
            }

            try {
                const response = await fetch(`${API}/notices`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, body })
                });

                if (!response.ok) {
                    throw new Error('Failed to create notice on server.');
                }
                
                alert('Notice created successfully!');
                newNoticeModal.style.display = 'none';
                newNoticeForm.reset();
                window.loadNotices(); // Reload data from DB
            } catch (error) {
                console.error('Error creating notice:', error);
                alert('Error creating notice. Please check server logs.');
            }
        }

        // Function exposed globally for loading notices
        window.loadNotices = async () => { // MODIFIED: Changed to fetch from API
            noticesContainer.innerHTML = '<div style="text-align: center; padding: 50px; color: #6b7280;">Loading notices...</div>';
            
            try {
                const response = await fetch(`${API}/notices/all`);
                if (!response.ok) throw new Error('Failed to fetch notices.');

                const allNotices = await response.json();

                // Notices are already sorted by created_at DESC from the API
                const activeNotices = allNotices.filter(n => !n.archived);
                const archivedNotices = allNotices.filter(n => n.archived);

                noticesContainer.innerHTML = ""; // Clear existing content

                if (activeNotices.length === 0 && archivedNotices.length === 0) {
                    noticesContainer.innerHTML = `<div style="text-align: center; padding: 50px; color: #6b7280; font-style: italic;">No notices found. Create a new one above.</div>`;
                    return;
                }

                // Render Active Notices
                if (activeNotices.length > 0) {
                    noticesContainer.innerHTML += '<h2>Active Notices</h2>';
                    activeNotices.forEach(n => renderNoticeCard(n));
                }

                // Render Archived Notices
                if (archivedNotices.length > 0) {
                    noticesContainer.innerHTML += '<h2 style="margin-top: 30px; color:#94a3b8;">Archived Notices</h2>';
                    archivedNotices.forEach(n => renderNoticeCard(n));
                }

            } catch (error) {
                console.error('Error loading notices:', error);
                noticesContainer.innerHTML = `<div style="text-align: center; padding: 50px; color: var(--danger);">Failed to load notices: ${error.message}</div>`;
            }
        }

        // Function to render a single notice card (using the fetched data structure)
        const renderNoticeCard = (n) => { // NEW Helper Function
            const noticeDiv = document.createElement("div");
            noticeDiv.className = `notice-card ${n.archived ? 'archived' : ''}`;
            noticeDiv.innerHTML = `
                <div class="notice-title">${n.title}</div>
                <div class="notice-body">${n.body}</div>
                <div class="notice-footer">
                    <span>Posted by ${n.created_by}</span>
                    <span>${new Date(n.created_at).toLocaleString()}</span>
                    ${!n.archived ? `<button class="btn btn-muted small" data-id="${n.id}" onclick="archiveNotice(this)">Archive</button>` : ''}
                </div>
            `;
            noticesContainer.appendChild(noticeDiv);
        };


        // Function exposed globally for archiving
        window.archiveNotice = async (btn) => { // MODIFIED: Added async and API call
            if (!confirm('Archive this notice (it will no longer display for students)?')) return;
            const id = btn.getAttribute('data-id');

            try {
                const response = await fetch(`${API}/notices/${id}/archive`, {
                    method: 'PATCH'
                });

                if (!response.ok) {
                    throw new Error('Failed to archive notice on server.');
                }
                
                window.loadNotices(); // Reload data from DB
            } catch (error) {
                console.error('Error archiving notice:', error);
                alert('Error archiving notice. Please check server logs.');
            }
        }

        // --- Initial setup and Demo Data ---
        // REMOVED LOCALSTORAGE LOGIC
        // Initial load
        window.loadNotices();
    })();
</script>
</body>
</html>
