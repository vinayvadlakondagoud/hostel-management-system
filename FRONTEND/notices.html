<!-- FULL notices.html with dynamic back button integrated -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notices - Hostel Management</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f6f8fb;--card:#fff;--accent:#2563eb;--muted:#60707f;--shadow:0 10px 30px rgba(14,40,80,0.06);--radius:12px;font-family:Inter,system-ui,Arial}
    body{background:linear-gradient(180deg,#eef2ff 0%,var(--bg)100%);padding:28px;min-height:100vh;color:#0f172a}
    .wrap{max-width:1100px;margin:0 auto}
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .header h1{font-size:20px}
    .btn{padding:8px 12px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--accent),#0ea5a4);color:#fff;cursor:pointer}
    .btn.ghost{background:transparent;color:var(--accent);border:1px solid rgba(37,99,235,0.08)}
    .small{font-size:13px;color:var(--muted)}
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root{
      --shadow-1: 0 10px 40px rgba(2,6,23,0.08), 0 0 10px rgba(2,6,23,0.04);
      --accentA:#7c3aed;
      --accentB:#06b6d4; 
      --success:#10b981;
      --danger:#ef4444;
    }
    body {
        font-family: 'Inter', sans-serif;
        font-size: 15px; 
        line-height: 1.6;
        background-color: #f8fafc;
        color: #1e293b;
    }
    .topbar-bg { background:#ffffff; border-bottom:1px solid rgba(15,23,42,0.04); padding:10px 0; margin-bottom:18px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; max-width:1400px; margin:0 auto; padding:0 20px; }
    .btn-primary { background:var(--accentA); color:white; }
    .btn-primary:hover{ transform: translateY(-2px); box-shadow:0 10px 30px rgba(124,58,237,0.25);}   
    .btn-ghost { background:none; color:#4b5563; padding:10px 14px; }
    .btn-ghost:hover{ background:#f1f5f9; }
    .grid { display:grid; grid-template-columns:280px 1fr; gap:20px; }
    .panel, .list-card { background:white; border-radius:12px; padding:24px; box-shadow:var(--shadow-1);} 
    .notice-item{ padding:18px; border-radius:10px; background:#f8fafc; border:1px solid #f1f5f9; display:flex; justify-content:space-between; }
  </style>
</head>

<body>

  <!-- TOP HEADER -->
  <div class="wrap">
    <div class="header">
      <h1>Notices & Announcements</h1>
      <div>
        <button class="btn" id="btnNew">New Notice</button>
        <!-- DYNAMIC BACK BUTTON -->
        <button class="btn ghost" id="btnBack">Back</button>
      </div>
    </div>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="wrap">
    <div class="topbar-bg">
      <div class="topbar">
        <div class="brand" style="display:flex; gap:10px; align-items:center;">
          <div style="font-size:1.5rem; font-weight:800; color:var(--accentA);">HM</div>
          <div>
            <div style="font-weight:800;">Hostel Management — Warden Dashboard</div>
            <div style="font-size:0.85rem; color:#6b7280;">Manage Notices</div>
          </div>
        </div>
      </div>
    </div>

    <div class="grid">

      <!-- LEFT COLUMN -->
      <aside>
        <div class="panel">
          <div class="profile" style="display:flex; gap:12px; align-items:center;">
            <div id="avatar" style="width:50px; height:50px; border-radius:50%; background:var(--accentA); color:white; display:grid; place-items:center; font-size:1.4rem; font-weight:800;">W</div>
            <div>
              <div id="wardenName" style="font-weight:800;">Warden</div>
              <div id="wardenEmail" style="font-size:0.85rem; color:#6b7280;">warden@hostel.com</div>
            </div>
          </div>

          <nav class="nav-links" style="margin-top:20px;">
            <a href="warden-home.html" class="nav-link">Overview</a><br>
            <a href="warden-complaints.html" class="nav-link">Complaints</a><br>
            <a href="warden-students.html" class="nav-link">Students</a><br>
            <a href="notices.html" class="nav-link" style="font-weight:700; color:var(--accentA);">Notices</a><br>
            <a href="warden-maintenance.html" class="nav-link">Maintenance</a><br>
            <a href="index.html" class="nav-link" style="color:var(--danger);">Logout</a>
          </nav>
        </div>
      </aside>

      <!-- RIGHT COLUMN -->
      <section>
        <div class="header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <h1 style="font-size:1.6rem; font-weight:800;">Notices</h1>
          <button class="btn btn-primary editor-toggle" onclick="document.getElementById('noticeForm').style.display = (document.getElementById('noticeForm').style.display==='none'?'block':'none')">New Notice</button>
        </div>

        <!-- CREATE NOTICE FORM -->
        <div id="noticeForm" class="panel" style="margin-bottom:20px; display:none;">
          <h2 style="font-size:1.2rem; font-weight:700;">Create Notice</h2>
          <form id="createNoticeForm">
            <div class="form-group">
              <label>Notice Title</label>
              <input type="text" id="noticeTitle" required />
            </div>
            <div class="form-group">
              <label>Notice Content</label>
              <textarea id="noticeBody" required></textarea>
            </div>
            <div style="text-align:right;">
              <button class="btn btn-primary" type="submit">Publish</button>
            </div>
          </form>
        </div>

        <!-- NOTICE LIST -->
        <div class="list-card">
          <h2 style="font-size:1.3rem; font-weight:700;">Published Notices</h2>
          <div id="noticeList" style="margin-top:15px; display:flex; flex-direction:column; gap:12px;">
            <div class="small" style="text-align:center; padding:20px;">Loading...</div>
          </div>
        </div>

      </section>
    </div>
  </div>


<!-- ================ JAVASCRIPT SECTION ================ -->
<script>
// --------------------------------------
// STEP 1: STORE PREVIOUS PAGE
// --------------------------------------
(function(){
    const ref = document.referrer;

    if (ref.includes("warden-kitchen.html")) {
        localStorage.setItem("notices_back", "warden-kitchen.html");
    }
    else if (ref.includes("warden-maintenance.html")) {
        localStorage.setItem("notices_back", "warden-maintenance.html");
    }
    else if (ref.includes("warden-education.html")) {
        localStorage.setItem("notices_back", "warden-education.html");
    }
})();

// --------------------------------------
// STEP 2: BACK BUTTON HANDLER
// --------------------------------------
document.getElementById("btnBack").addEventListener("click", () => {
    const target = localStorage.getItem("notices_back");
    if (target) location.href = target;
    else location.href = "warden-kitchen.html"; // fallback
});

// --------------------------------------
// LOAD WARDEN HEADER
// --------------------------------------
function loadHeader(){
    const name = localStorage.getItem("username") || "Warden";
    const email = localStorage.getItem("userEmail") || "warden@hostel.edu";

    document.getElementById("avatar").textContent = name[0].toUpperCase();
    document.getElementById("wardenName").textContent = name;
    document.getElementById("wardenEmail").textContent = email;
}

// --------------------------------------
// LOAD NOTICES
// --------------------------------------
function loadNotices(){
    let raw = localStorage.getItem("notices");
    let list = raw ? JSON.parse(raw).filter(n => !n.archived) : [];

    const box = document.getElementById("noticeList");
    box.innerHTML = "";

    if (list.length === 0){
        box.innerHTML = '<div class="small" style="text-align:center; padding:20px;">No notices yet.</div>';
        return;
    }

    list.sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));

    list.forEach(n => {
        const div = document.createElement("div");
        div.className = "notice-item";
        div.innerHTML = `
            <div style="flex:1;">
              <div style="font-weight:700;">${n.title}</div>
              <div style="margin-top:4px; color:#4b5563;">${n.body}</div>
              <div style="margin-top:8px; font-size:0.75rem; color:#9ca3af;">${new Date(n.created_at).toLocaleString()}</div>
            </div>
            <button class="btn btn-danger" data-id="${n.id}" onclick="deleteNotice(this)">Delete</button>
        `;
        box.appendChild(div);
    });
}

// --------------------------------------
// CREATE NOTICE
// --------------------------------------
document.getElementById("createNoticeForm").addEventListener("submit", e => {
    e.preventDefault();

    const title = document.getElementById("noticeTitle").value;
    const body = document.getElementById("noticeBody").value;

    let raw = localStorage.getItem("notices");
    let arr = raw ? JSON.parse(raw) : [];

    arr.push({
        id: 'N-'+Date.now(),
        title,
        body,
        created_at: new Date().toISOString(),
        archived: false
    });

    localStorage.setItem("notices", JSON.stringify(arr));

    document.getElementById("noticeForm").style.display="none";
    loadNotices();
});

// --------------------------------------
// DELETE NOTICE
// --------------------------------------
function deleteNotice(btn){
    if (!confirm("Delete this notice?")) return;

    const id = btn.getAttribute("data-id");
    let raw = localStorage.getItem("notices");
    let arr = raw ? JSON.parse(raw) : [];

    arr = arr.filter(n => n.id !== id);
    localStorage.setItem("notices", JSON.stringify(arr));
    loadNotices();
}

// --------------------------------------
// INIT
// --------------------------------------
if (!localStorage.getItem("notices")){
    localStorage.setItem("notices", JSON.stringify([
        {id:"1", title:"Fee Reminder", body:"Submit fees by Friday", created_at:new Date().toISOString(), archived:false}
    ]));
}

loadHeader();
loadNotices();
</script>

</body>
</html>
