<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Visitor History - Admin</title>
    <link rel="stylesheet" href="visitor.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="admin-home.html" style="text-decoration:none; color:inherit;">
            <i class="ri-arrow-left-line" style="font-size:20px"></i>
            <h2>Visitor History</h2>
        </a>
        <div>
            <button onclick="window.location.href='admin-home.html'">
                <i class="ri-logout-box-r-line"></i> Back
            </button>
        </div>
    </nav>

    <main class="content">
        <div class="header-controls" aria-label="Filters">
            <div style="flex:1">
                <div class="helper">Search by username or pick a date to filter logs</div>
                <input type="text" id="usernameFilter" placeholder="Filter by Username." oninput="filterLogs()">
            </div>

            <div style="min-width:220px;">
                <div class="helper" style="opacity:0.9">Date</div>
                <input type="date" id="dateFilter" onchange="filterLogs()" />
            </div>

            <div style="display:flex; gap:10px; align-items:center;">
                <button class="btn" id="refreshButton" onclick="fetchVisitorLogs()">
                    <i class="ri-refresh-line"></i> Refresh
                </button>
                <button class="btn secondary" onclick="downloadCSV()">
                    <i class="ri-download-line"></i> Export CSV
                </button>
            </div>
        </div>

        <div class="log-container" role="region" aria-label="Visitor logs">
            <table class="log-table" aria-describedby="noLogsMsg">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">Username <i class="ri-sort-asc"></i></th>
                        <th onclick="sortTable(1)">User Type <i class="ri-sort-asc"></i></th>
                        <th onclick="sortTable(2)">Registered Date <i class="ri-sort-asc"></i></th>
                        <th onclick="sortTable(3)">Login Time <i class="ri-sort-asc"></i></th>
                        <th onclick="sortTable(4)">Status <i class="ri-sort-asc"></i></th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                </tbody>
            </table>

            <p id="noLogsMsg" style="display:none;">No logs found for the selected filter criteria.</p>
        </div>
    </main>

    <script>
        // --- State ---
        const logTableBody = document.getElementById('logTableBody');
        const noLogsMsg = document.getElementById('noLogsMsg');
        const usernameFilterInput = document.getElementById('usernameFilter');
        const dateFilterInput = document.getElementById('dateFilter');

        let allLogs = [];        // raw logs from /visitor-logs
        let userDetails = {};    // { username: registered_at_iso } (from /user-details)
        let combinedLogs = [];   // merged array (includes registration events)
        let currentSort = { col: null, asc: true };

        // --- Formatting helpers ---
        function formatDateTime(timestamp) {
            if (!timestamp) return 'N/A';
            const d = new Date(timestamp);
            if (isNaN(d)) return 'Invalid Date';
            const opts = { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true };
            return d.toLocaleString('en-US', opts);
        }
        function formatDateOnly(timestamp) {
            if (!timestamp) return 'N/A';
            const d = new Date(timestamp);
            if (isNaN(d)) return 'Invalid Date';
            const opts = { year:'numeric', month:'short', day:'numeric' };
            return d.toLocaleDateString('en-US', opts);
        }

        // --- Fetching data from server and combining registration + login events ---
        async function fetchVisitorLogs() {
    logTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">Loading logs…</td></tr>';
    noLogsMsg.style.display = 'none';

    async function tryFetchUrls(urls) {
        for (const url of urls) {
            try {
                const res = await fetch(url, { credentials: 'include' });
                if (!res.ok) {
                    console.warn(`Request to ${url} returned status ${res.status}`);
                    continue;
                }
                const json = await res.json();
                return { url, json };
            } catch (err) {
                console.warn(`Fetch to ${url} failed:`, err);
            }
        }
        return null;
    }

    try {
        const apiHosts = ['', 'https://hostel-management-system-1-3c10.onrender.com', 'https://hostel-management-system-2-2x8y.onrender.com'];

        // fetch user-details (students)
        const userDetailUrls = apiHosts.map(h => (h ? `${h}/user-details` : '/user-details'));
        const udResult = await tryFetchUrls(userDetailUrls);
        if (!udResult) throw new Error('Could not fetch user details from any known API host.');
        userDetails = udResult.json.users || {};

        // fetch wardens (new)
        const wardensUrls = apiHosts.map(h => (h ? `${h}/wardens` : '/wardens'));
        const wResult = await tryFetchUrls(wardensUrls);
        if (!wResult) {
            console.warn('Wardens endpoint not available; falling back to inference.');
            // create empty wardens list so code still works
            wardensList = [];
        } else {
            // wResult.json.wardens expected as array of { username, created_at }
            wardensList = (wResult.json.wardens || []).map(w => w.username);
        }

        // visitor logs
        const logUrls = apiHosts.map(h => (h ? `${h}/visitor-logs` : '/visitor-logs'));
        const logsResult = await tryFetchUrls(logUrls);
        if (!logsResult) throw new Error('Could not fetch visitor logs from any known API host.');

        allLogs = logsResult.json.logs || [];

        // Build combined logs with explicit userType detection:
        const wardensSet = new Set(wardensList || []);
        combinedLogs = allLogs.map(l => {
            const loginISO = l.login_time ? new Date(l.login_time).toISOString() : new Date().toISOString();
            let userType = 'unknown';
            if (wardensSet.has(l.username)) userType = 'warden';
            else if (userDetails[l.username]) userType = 'student';
            else userType = 'student'; // optional: fallback to student for older systems
            return {
                username: l.username,
                userType,
                registered_at: userDetails[l.username] || null,
                login_time: loginISO,
                status: l.status || 'Success',
                type: 'login'
            };
        });

        // also include standalone registration events (students who never logged)
        Object.keys(userDetails).forEach(username => {
            const regISO = userDetails[username];
            if (!regISO) return;
            const exists = combinedLogs.some(c => c.username === username && c.registered_at && new Date(c.registered_at).toISOString() === new Date(regISO).toISOString());
            if (!exists) {
                combinedLogs.push({
                    username,
                    userType: 'student',
                    registered_at: regISO,
                    login_time: regISO,
                    status: 'Registered',
                    type: 'registration'
                });
            }
        });

        // ensure wardens-only registry with no log also appear if desired:
        if (wardensList && wardensList.length) {
            wardensList.forEach(w => {
                const already = combinedLogs.some(c => c.username === w);
                if (!already) {
                    combinedLogs.push({
                        username: w,
                        userType: 'warden',
                        registered_at: null,
                        login_time: null,
                        status: 'Warden (no login)',
                        type: 'warden'
                    });
                }
            });
        }

        combinedLogs.sort((a,b) => {
            const ta = a.login_time ? new Date(a.login_time).getTime() : 0;
            const tb = b.login_time ? new Date(b.login_time).getTime() : 0;
            return tb - ta;
        });

        renderTable();
    } catch (err) {
        console.error('Fetch visitor logs error:', err);
        logTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:red;">Unable to load logs.</td></tr>';
    }
}


        // --- Render table rows based on combinedLogs & current filters ---
        function renderTable() {
            const filterText = usernameFilterInput.value.trim().toLowerCase();
            const dateFilter = dateFilterInput.value; // yyyy-mm-dd
            const rows = combinedLogs.filter(row => {
                if (filterText) {
                    if (!row.username || row.username.toLowerCase().indexOf(filterText) === -1) return false;
                }
                if (dateFilter) {
                    const rowDate = new Date(row.login_time).toISOString().slice(0,10);
                    if (rowDate !== dateFilter) return false;
                }
                return true;
            });

            if (rows.length === 0) {
                logTableBody.innerHTML = '';
                noLogsMsg.style.display = '';
                return;
            }
            noLogsMsg.style.display = 'none';

            // optional: apply current sort if set
            if (currentSort.col !== null) {
                const col = currentSort.col;
                rows.sort((a,b) => {
                    let va, vb;
                    switch (col) {
                        case 0: va = a.username || ''; vb = b.username || ''; break;
                        case 1: va = a.userType || ''; vb = b.userType || ''; break;
                        case 2: va = a.registered_at || ''; vb = b.registered_at || ''; break;
                        case 3: va = a.login_time || ''; vb = b.login_time || ''; break;
                        case 4: va = a.status || ''; vb = b.status || ''; break;
                        default: va = ''; vb = '';
                    }
                    if (va < vb) return currentSort.asc ? -1 : 1;
                    if (va > vb) return currentSort.asc ? 1 : -1;
                    return 0;
                });
            }

            const html = rows.map(r => {
                return `<tr>
                    <td>${escapeHtml(r.username || '')}</td>
                    <td style="text-transform:capitalize;"><span class="pill">${escapeHtml(r.userType || 'student')}</span></td>
                    <td>${r.registered_at ? formatDateOnly(r.registered_at) : 'N/A'}</td>
                    <td>${formatDateTime(r.login_time)}</td>
                    <td>${escapeHtml(r.status)}</td>
                </tr>`;
            }).join('');

            logTableBody.innerHTML = html;
        }

        // --- Helpers ---
        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
        }

        // --- Filtering / Sorting / CSV export ---
        function filterLogs() { renderTable(); }

        function sortTable(colIndex) {
            if (currentSort.col === colIndex) {
                currentSort.asc = !currentSort.asc;
            } else {
                currentSort.col = colIndex;
                currentSort.asc = true;
            }
            renderTable();
        }

        function downloadCSV() {
            const header = ['Username','User Type','Registered Date','Login Time','Status'];
            const filterText = usernameFilterInput.value.trim().toLowerCase();
            const dateFilter = dateFilterInput.value;
            const rows = combinedLogs.filter(row => {
                if (filterText) {
                    if (!row.username || row.username.toLowerCase().indexOf(filterText) === -1) return false;
                }
                if (dateFilter) {
                    const rowDate = new Date(row.login_time).toISOString().slice(0,10);
                    if (rowDate !== dateFilter) return false;
                }
                return true;
            });

            const csvLines = [header.join(',')];
            rows.forEach(r => {
                const line = [
                    csvSafe(r.username),
                    csvSafe(r.userType),
                    csvSafe(r.registered_at ? formatDateOnly(r.registered_at) : ''),
                    csvSafe(r.login_time ? new Date(r.login_time).toISOString() : ''),
                    csvSafe(r.status)
                ];
                csvLines.push(line.join(','));
            });

            const blob = new Blob([csvLines.join('\n')], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `visitor-logs-${(new Date()).toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }
        function csvSafe(val){ if (val === null || val === undefined) return ''; return `"${String(val).replace(/"/g,'""')}"`; }

        // --- Init ---
        fetchVisitorLogs();

        // expose functions to window for header onclick handlers (if needed)
        window.filterLogs = filterLogs;
        window.sortTable = sortTable;
        window.fetchVisitorLogs = fetchVisitorLogs;
        window.downloadCSV = downloadCSV;
    </script>
</body>
</html>
