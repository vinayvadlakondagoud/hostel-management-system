<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Visitor History - Admin</title>
    <link rel="stylesheet" href="visitor.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <!-- NAVBAR: back button moved to the left, title next to it -->
    <nav class="navbar">
        <div style="display:flex; align-items:center; gap:12px;">
            <button id="backBtn" onclick="window.location.href='admin-home.html'" style="background:transparent; border:0; color:inherit; display:flex; align-items:center; gap:8px; cursor:pointer;">
                <i class="ri-arrow-left-line" style="font-size:20px; color:#fff;"></i>
                <span style="font-weight:700; font-size:16px; color:#fff;">Back</span>
            </button>
            <h2 style="margin:0 0 0 6px; font-size:18px; color:#fff;">Visitor History</h2>
        </div>

        <div>
            <!-- optionally other controls can go here (right side) -->
        </div>
    </nav>

    <main class="content">
        <div class="header-controls" aria-label="Filters">
            <div style="flex:1;">
                <div class="helper">Search by username or pick a date to filter logs</div>
                <input type="text" id="usernameFilter" placeholder="Filter by Username..." oninput="filterLogs()" />
            </div>

            <div style="min-width:220px;">
                <div class="helper" style="opacity:0.9">Date</div>
                <input type="date" id="dateFilter" onchange="filterLogs()" />
            </div>

            <div style="display:flex; gap:10px; align-items:center;">
                <button class="btn" id="refreshButton" onclick="fetchVisitorLogs()">
                    <i class="ri-refresh-line"></i> Refresh
                </button>

                <button class="btn secondary" onclick="downloadCSV()">
                    <i class="ri-download-line"></i> Export CSV
                </button>

                <!-- Clear All button - danger style -->
                <button class="btn" id="clearAllBtn" onclick="clearAllLogs()" style="background:#ef4444;">
                    <i class="ri-delete-bin-line"></i> Clear All
                </button>
            </div>
        </div>

        <div class="log-container" role="region" aria-label="Visitor logs">
            <table class="log-table" aria-describedby="noLogsMsg">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">Username <i class="ri-sort-asc"></i></th>
                        <th onclick="sortTable(1)">Registered Date <i class="ri-sort-asc"></i></th>
                        <th onclick="sortTable(2)">Login Time <i class="ri-sort-asc"></i></th>
                        <th onclick="sortTable(3)">Status <i class="ri-sort-asc"></i></th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                </tbody>
            </table>

            <p id="noLogsMsg" style="display:none; padding:18px; text-align:center;">No logs found for the selected filter criteria.</p>
        </div>
    </main>

    <script>
        // --- State ---
        const logTableBody = document.getElementById('logTableBody');
        const noLogsMsg = document.getElementById('noLogsMsg');
        const usernameFilterInput = document.getElementById('usernameFilter');
        const dateFilterInput = document.getElementById('dateFilter');

        let allLogs = [];        // raw logs from /visitor-logs
        let userDetails = {};    // { username: registered_at_iso }
        let combinedLogs = [];   // merged array (includes registration events)
        let sortDirection = {};  // { registered_at: 'asc' }

        // --- Formatting helpers ---
        function formatDateTime(timestamp) {
            if (!timestamp) return 'N/A';
            const d = new Date(timestamp);
            if (isNaN(d)) return 'Invalid Date';
            const opts = { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true };
            return d.toLocaleString('en-US', opts);
        }
        function formatDateOnly(timestamp) {
            if (!timestamp) return 'N/A';
            const d = new Date(timestamp);
            if (isNaN(d)) return 'Invalid Date';
            const opts = { year:'numeric', month:'short', day:'numeric' };
            return d.toLocaleDateString('en-US', opts);
        }

        // --- Fetching data from server and combining registration + login events ---
        async function fetchVisitorLogs() {
            logTableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px;">Loading logs…</td></tr>';
            noLogsMsg.style.display = 'none';

            // helper to try urls in sequence (same pattern used previously in your code)
            async function tryFetchUrls(urls) {
                for (const url of urls) {
                    try {
                        const res = await fetch(url, { credentials: 'include' });
                        if (!res.ok) {
                            console.warn(`Request to ${url} returned status ${res.status}`);
                            continue;
                        }
                        const json = await res.json();
                        return { url, json };
                    } catch (err) {
                        console.warn(`Fetch to ${url} failed:`, err);
                    }
                }
                return null;
            }

            try {
                const apiHosts = [
                    '', // try same-origin first (relative path)
                    'https://hostel-management-system-1-3c10.onrender.com',
                    'https://hostel-management-system-2-2x8y.onrender.com'
                ];

                const userDetailUrls = apiHosts.map(h => (h ? `${h}/user-details` : '/user-details'));
                const udResult = await tryFetchUrls(userDetailUrls);
                if (!udResult) throw new Error('Could not fetch user details from any known API host.');

                const logUrls = [
                    udResult.url.replace('/user-details','/visitor-logs'),
                    ...apiHosts.map(h => (h ? `${h}/visitor-logs` : '/visitor-logs'))
                ];
                const logsResult = await tryFetchUrls(logUrls);
                if (!logsResult) throw new Error('Could not fetch visitor logs from any known API host.');

                userDetails = udResult.json.users || {};
                allLogs = logsResult.json.logs || [];

                // merge and build combined logs (keeps registration events if no login exists)
                const presentKeys = new Set();
                combinedLogs = [];

                allLogs.forEach(l => {
                    const loginISO = l.login_time ? new Date(l.login_time).toISOString() : new Date().toISOString();
                    const key = `${l.username}::${loginISO}`;
                    presentKeys.add(key);
                    combinedLogs.push({
                        username: l.username,
                        registered_at: userDetails[l.username] || null,
                        login_time: loginISO,
                        status: l.status || 'Success',
                        type: 'login'
                    });
                });

                Object.keys(userDetails).forEach(username => {
                    const regISO = userDetails[username];
                    if (!regISO) return;
                    const key = `${username}::${new Date(regISO).toISOString()}`;
                    if (!presentKeys.has(key)) {
                        combinedLogs.push({
                            username,
                            registered_at: regISO,
                            login_time: regISO,
                            status: 'Registered',
                            type: 'registered'
                        });
                        presentKeys.add(key);
                    }
                });

                combinedLogs.sort((a,b) => new Date(b.login_time) - new Date(a.login_time));
                renderLogs(combinedLogs);

            } catch (err) {
                console.error('Fetch error:', err);
                logTableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px; color:#ef4444;">Network or server error fetching logs. Check backend URL and CORS.</td></tr>';
            }
        }

        // --- Render function ---
        function renderLogs(logs) {
            logTableBody.innerHTML = '';
            if (!logs || logs.length === 0) {
                noLogsMsg.style.display = 'block';
                return;
            }
            noLogsMsg.style.display = 'none';

            logs.forEach(log => {
                const row = logTableBody.insertRow();

                // Username cell (pill)
                const cellUser = row.insertCell();
                const pill = document.createElement('span');
                pill.className = 'pill';
                pill.textContent = log.username || 'Unknown';
                cellUser.appendChild(pill);

                // Registered Date
                const cellReg = row.insertCell();
                cellReg.textContent = formatDateOnly(log.registered_at);

                // Login time
                const cellTime = row.insertCell();
                cellTime.textContent = formatDateTime(log.login_time);

                // Status
                const cellStatus = row.insertCell();
                const s = document.createElement('span');
                s.className = (String(log.status).toLowerCase().includes('success') || String(log.status).toLowerCase().includes('registered')) ? 'status success' : 'status fail';
                s.textContent = log.status || 'Unknown';
                cellStatus.appendChild(s);
            });
        }

        // --- Filtering ---
        function filterLogs() {
            const name = (usernameFilterInput.value || '').trim().toLowerCase();
            const dateVal = dateFilterInput.value; // YYYY-MM-DD
            let filtered = combinedLogs.slice();

            if (name) {
                filtered = filtered.filter(r => (r.username || '').toLowerCase().includes(name));
            }
            if (dateVal) {
                filtered = filtered.filter(r => {
                    if (!r.login_time) return false;
                    const d = new Date(r.login_time);
                    const y = d.getFullYear();
                    const m = String(d.getMonth()+1).padStart(2,'0');
                    const dd = String(d.getDate()).padStart(2,'0');
                    return `${y}-${m}-${dd}` === dateVal;
                });
            }
            renderLogs(filtered);
        }

        // --- Sorting ---
        function sortTable(columnIndex) {
            // columnIndex: 0 username, 1 registered_at, 2 login_time, 3 status
            const keyMap = ['username', 'registered_at', 'login_time', 'status'];
            const key = keyMap[columnIndex];
            const dir = sortDirection[key] === 'asc' ? 'desc' : 'asc';
            sortDirection = {}; sortDirection[key] = dir;

            const sorted = combinedLogs.slice().sort((a,b) => {
                let A = a[key] || '';
                let B = b[key] || '';

                if (key === 'registered_at' || key === 'login_time') {
                    A = new Date(A || 0);
                    B = new Date(B || 0);
                    return dir === 'asc' ? A - B : B - A;
                }
                A = String(A).toUpperCase();
                B = String(B).toUpperCase();
                if (A < B) return dir === 'asc' ? -1 : 1;
                if (A > B) return dir === 'asc' ? 1 : -1;
                return 0;
            });

            renderLogs(sorted);
            // update icons (simple)
            document.querySelectorAll('th i').forEach(icon => icon.className = 'ri-sort-asc');
            const headerIcon = document.querySelector(`th:nth-child(${columnIndex+1}) i`);
            if (headerIcon) headerIcon.className = dir === 'asc' ? 'ri-sort-asc' : 'ri-sort-desc';
        }

        // --- Export CSV helper ---
        function downloadCSV() {
            if (!combinedLogs || combinedLogs.length === 0) return alert('No logs to export');
            const header = ['Username','Registered Date','Event Time','Status'];
            const rows = combinedLogs.map(r => [
                (r.username||''),
                formatDateOnly(r.registered_at),
                formatDateTime(r.login_time),
                r.status || ''
            ]);
            const csv = [header].concat(rows).map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
            const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `visitor-logs-${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        // --- Clear All Logs - asks for confirmation then deletes logs via API ---
        async function clearAllLogs() {
            if (!confirm('Are you sure you want to permanently delete ALL visitor logs? This action cannot be undone.')) return;

            // try same-origin first, then the known API hosts
            const apiHosts = ['', 'https://hostel-management-system-1-3c10.onrender.com', 'https://hostel-management-system-2-2x8y.onrender.com'];
            let success = false;
            let lastError = null;

            for (const host of apiHosts) {
                const url = host ? `${host}/visitor-logs` : '/visitor-logs';
                try {
                    const res = await fetch(url, { method: 'DELETE', credentials: 'include' });
                    if (!res.ok) {
                        const txt = await res.text().catch(()=>null);
                        lastError = `Status ${res.status} ${txt || ''}`;
                        continue;
                    }
                    const json = await res.json().catch(()=>null);
                    success = true;
                    alert(json && json.ok ? `Deleted ${json.deleted || 0} logs.` : 'Visitor logs cleared.');
                    // refresh list
                    await fetchVisitorLogs();
                    break;
                } catch (err) {
                    lastError = err.message || String(err);
                    console.warn('Delete attempt failed for', url, err);
                }
            }

            if (!success) {
                alert('Could not delete logs. Check server/CORS. Error: ' + lastError);
                console.error('clearAllLogs error:', lastError);
            }
        }

        // initial load
        window.addEventListener('load', fetchVisitorLogs);
    </script>
</body>
</html>
