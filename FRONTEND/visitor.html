<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Visitor History</title>
  <link rel="stylesheet" href="visitor.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    /* Minimal inline tweaks so the file looks OK if visitor.css is missing */
    body { font-family: Arial, Helvetica, sans-serif; margin: 18px; background:#f7f8fb; color:#111 }
    .container { max-width:1100px; margin: 0 auto; }
    h1 { margin-bottom:12px }
    table { width:100%; border-collapse: collapse; background: #fff; box-shadow: 0 6px 18px rgba(23,23,23,0.06); }
    th, td { padding: 12px 14px; text-align:left; border-bottom: 1px solid #eee }
    thead th { background: #fafafa; cursor: pointer; user-select:none }
    .pill { display:inline-block; padding:6px 10px; border-radius:999px; font-size:13px; background:#eef2ff }
    #noLogsMsg { padding: 36px; text-align:center; color:#666 }
  </style>
</head>
<body>
  <div class="container">
    <h1>Visitor History</h1>

    <div style="margin-bottom:12px; display:flex; gap:8px; align-items:center;">
      <input id="searchBox" placeholder="Search username or status" style="padding:8px; width:260px;" />
      <button id="reloadBtn">Reload</button>
    </div>

    <div style="overflow:auto; border-radius:8px;">
      <table id="logTable">
        <thead>
          <tr>
            <th onclick="sortTable(0)">Username <i class="ri-sort-asc"></i></th>
            <th onclick="sortTable(1)">Registered Date <i class="ri-sort-asc"></i></th>
            <th onclick="sortTable(2)">Login Time <i class="ri-sort-asc"></i></th>
            <th onclick="sortTable(3)">Status <i class="ri-sort-asc"></i></th>
            <th onclick="sortTable(4)">User Type <i class="ri-sort-asc"></i></th>
          </tr>
        </thead>
        <tbody id="logTableBody"></tbody>
      </table>
    </div>

    <div id="noLogsMsg" style="display:none">No logs found.</div>
  </div>

<script>
// ---------------------------
// Configuration / state
// ---------------------------
// near top of visitor.html
const apiHosts = [
  'https://hostel-management-system-2-2x8y.onrender.com',
  'https://hostel-management-system-1-3c10.onrender.com',
  '' // keep empty as a last fallback (same-origin)
];


const logTableBody = document.getElementById('logTableBody');
const noLogsMsg = document.getElementById('noLogsMsg');
const searchBox = document.getElementById('searchBox');
const reloadBtn = document.getElementById('reloadBtn');

let allLogs = [];
const wardenCache = {}; // username => 'warden' | 'student'

// ---------------------------
// Utilities
// ---------------------------
function formatDateOnly(iso) {
  if (!iso) return '-';
  try { const d = new Date(iso); return d.toLocaleDateString(); } catch(e){ return iso }
}
function formatDateTime(iso) {
  if (!iso) return '-';
  try { const d = new Date(iso); return d.toLocaleString(); } catch(e){ return iso }
}

function safeFetch(url, opts) {
  return fetch(url, Object.assign({ credentials:'include' }, opts || {}));
}

// Try a list of candidate urls; resolve the first successful response object, or reject if none
async function tryFetchUrls(urls, opts) {
  const errors = [];
  for (const u of urls) {
    try {
      const res = await safeFetch(u, opts);
      // treat any HTTP response as a response (caller inspects res.ok / status)
      return { res, url: u };
    } catch (err) {
      errors.push({ url: u, err });
      continue;
    }
  }
  throw new Error('All fetch attempts failed');
}

// Build candidate absolute URLs for a path, using same-origin first
function buildCandidateUrls(path) {
  const list = apiHosts.map(h => (h ? `${h}${path.startsWith('/')?'':'/'}${path}` : path));
  return list;
}

// ---------------------------
// Warden detection
// ---------------------------
// Returns true if username corresponds to a warden (server's /warden/:username returns 200)
async function isWardenUsername(username) {
  if (!username) return false;
  if (wardenCache[username]) return wardenCache[username] === 'warden';

  const path = `/warden/${encodeURIComponent(username)}`;
  const urls = buildCandidateUrls(path);
  for (const url of urls) {
    try {
      const res = await safeFetch(url);
      if (res && res.ok) {
        wardenCache[username] = 'warden';
        return true;
      } else if (res && res.status === 404) {
        // not found on this host, try next
        continue;
      }
    } catch (e) {
      // network error - try next
      continue;
    }
  }
  wardenCache[username] = 'student';
  return false;
}

// Pre-warm the warden cache for a list of usernames
async function warmWardenCache(usernames) {
  const uniq = [...new Set(usernames.filter(Boolean))];
  await Promise.all(uniq.map(u => isWardenUsername(u).catch(()=>false)));
}

// ---------------------------
// Rendering
// ---------------------------
async function renderLogs(logs) {
  logTableBody.innerHTML = '';
  if (!logs || logs.length === 0) {
    noLogsMsg.style.display = 'block';
    return;
  }
  noLogsMsg.style.display = 'none';

  // pre-warm cache
  const usernames = logs.map(l => l.username);
  await warmWardenCache(usernames);

  logs.forEach(log => {
    const row = document.createElement('tr');

    // Username cell
    const tdUser = document.createElement('td');
    const pill = document.createElement('span');
    pill.className = 'pill';
    pill.textContent = log.username || 'Unknown';
    tdUser.appendChild(pill);
    row.appendChild(tdUser);

    // Registered Date
    const tdReg = document.createElement('td');
    tdReg.textContent = formatDateOnly(log.registered_at || log.registeredAt || log.registered);
    row.appendChild(tdReg);

    // Login Time
    const tdLogin = document.createElement('td');
    tdLogin.textContent = formatDateTime(log.login_time || log.loginTime || log.time || log.createdAt);
    row.appendChild(tdLogin);

    // Status
    const tdStatus = document.createElement('td');
    tdStatus.textContent = (log.status || log.action || 'Unknown');
    row.appendChild(tdStatus);

    // User Type (from cache)
    const tdType = document.createElement('td');
    const username = log.username || '';
    const type = wardenCache[username] === 'warden' ? 'warden' : 'student';
    const typePill = document.createElement('span');
    typePill.className = 'pill';
    typePill.textContent = type;
    if (type === 'warden') typePill.style.background = '#ffe7e7';
    tdType.appendChild(typePill);
    row.appendChild(tdType);

    logTableBody.appendChild(row);
  });
}

// ---------------------------
// Sorting (simple client-side)
// ---------------------------
let currentSortCol = -1;
let sortAsc = true;
function sortTable(colIndex) {
  if (currentSortCol === colIndex) sortAsc = !sortAsc; else { currentSortCol = colIndex; sortAsc = true; }
  function keyForRow(r) {
    const cells = r.querySelectorAll('td');
    return (cells[colIndex] && cells[colIndex].textContent) || '';
  }
  const rows = Array.from(logTableBody.querySelectorAll('tr'));
  rows.sort((a,b) => {
    const A = keyForRow(a).toLowerCase();
    const B = keyForRow(b).toLowerCase();
    if (!isNaN(Date.parse(A)) && !isNaN(Date.parse(B))) return (new Date(A) - new Date(B)) * (sortAsc?1:-1);
    if (A < B) return sortAsc ? -1 : 1;
    if (A > B) return sortAsc ? 1 : -1;
    return 0;
  });
  // re-append
  rows.forEach(r => logTableBody.appendChild(r));
}

// Replace existing loadLogs() with this debug-friendly version
async function loadLogs() {
  const path = '/visitor-logs';
  const urls = apiHosts.map(h => {
    if (!h || h === '') {
      // use location.origin if page served from an http(s) origin
      try { return location.origin + path; } catch(e) { return path; }
    }
    return (h.endsWith('/') ? h.slice(0,-1) : h) + path;
  });

  console.log('[visitor] attempting visitor-logs URLs:', urls);

  let lastErr = null;
  for (const url of urls) {
    try {
      const res = await fetch(url, { credentials: 'include' });
      console.log('[visitor] fetched', url, 'status', res.status);
      if (!res.ok) {
        lastErr = new Error(`HTTP ${res.status} from ${url}`);
        // try next host
        continue;
      }
      const logs = await res.json();
      allLogs = Array.isArray(logs) ? logs : (logs.data || []);
      await renderLogs(allLogs);
      return; // success - stop trying
    } catch (err) {
      console.warn('[visitor] fetch error for', url, err);
      lastErr = err;
      continue;
    }
  }

  console.error('Failed to load visitor logs (all hosts tried). Last error:', lastErr);
  noLogsMsg.style.display = 'block';
  noLogsMsg.textContent = 'Unable to fetch visitor logs from server. See console for attempts.';
}


// ---------------------------
// Simple client-side filter
// ---------------------------
function applyFilter() {
  const q = (searchBox.value || '').toLowerCase().trim();
  if (!q) return renderLogs(allLogs);
  const filtered = allLogs.filter(l => {
    const username = (l.username || '').toLowerCase();
    const status = (l.status || l.action || '').toLowerCase();
    return username.includes(q) || status.includes(q);
  });
  renderLogs(filtered);
}

// ---------------------------
// Event bindings
// ---------------------------
searchBox.addEventListener('input', () => { applyFilter(); });
reloadBtn.addEventListener('click', () => { loadLogs(); });

// initial load
loadLogs();
</script>
</body>
</html>
