<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Visitor History - Admin</title>
    <link rel="stylesheet" href="visitor.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="admin-home.html" style="text-decoration:none; color:inherit;">
            <i class="ri-arrow-left-line" style="font-size:20px"></i>
            <h2>Visitor History</h2>
        </a>
        <div>
            <button onclick="window.location.href='admin-home.html'">
                <i class="ri-logout-box-r-line"></i> Back
            </button>
        </div>
    </nav>

    <main class="content">
        <div class="header-controls" aria-label="Filters">
            <div style="flex:1">
                <div class="helper">Search by username or pick a date to filter logs</div>
                <input type="text" id="usernameFilter" placeholder="Filter by Username..." oninput="filterLogs()">
            </div>

            <div style="min-width:220px;">
                <div class="helper" style="opacity:0.9">Date</div>
                <input type="date" id="dateFilter" onchange="filterLogs()" />
            </div>

            <div style="display:flex; gap:10px; align-items:center;">
                <button class="btn" id="refreshButton" onclick="fetchVisitorLogs()">
                    <i class="ri-refresh-line"></i> Refresh
                </button>
                <button class="btn secondary" onclick="downloadCSV()">
                    <i class="ri-download-line"></i> Export CSV
                </button>
            </div>
        </div>

        <div class="log-container" role="region" aria-label="Visitor logs">
            <table class="log-table" aria-describedby="noLogsMsg">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">Username <i class="ri-sort-asc"></i></th>
                        <th onclick="sortTable(1)">Registered Date <i class="ri-sort-asc"></i></th>
                        <th onclick="sortTable(2)">Login Time <i class="ri-sort-asc"></i></th>
                        <th onclick="sortTable(3)">Status <i class="ri-sort-asc"></i></th>
                        <th onclick="sortTable(4)">User Type <i class="ri-sort-asc"></i></th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                </tbody>
            </table>

            <p id="noLogsMsg" style="display:none;">No logs found for the selected filter criteria.</p>
        </div>
    </main>

    <script>
        // --- State ---
        const logTableBody = document.getElementById('logTableBody');
        const noLogsMsg = document.getElementById('noLogsMsg');
        const usernameFilterInput = document.getElementById('usernameFilter');
        const dateFilterInput = document.getElementById('dateFilter');

        let allLogs = [];        // raw logs from /visitor-logs
        let userDetails = {};    // { username: registered_at_iso }
        let combinedLogs = [];   // merged array (includes registration events)
        let wardenSet = new Set(); // usernames that are wardens

        // --- Formatting helpers ---
        function formatDateTime(timestamp) {
            if (!timestamp) return 'N/A';
            const d = new Date(timestamp);
            if (isNaN(d)) return 'Invalid Date';
            const opts = { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true };
            return d.toLocaleString('en-US', opts);
        }
        function formatDateOnly(timestamp) {
            if (!timestamp) return 'N/A';
            const d = new Date(timestamp);
            if (isNaN(d)) return 'Invalid Date';
            const opts = { year:'numeric', month:'short', day:'numeric' };
            return d.toLocaleDateString('en-US', opts);
        }

        // --- Fetching data from server and combining registration + login events ---
        async function fetchVisitorLogs() {
            logTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">Loading logs…</td></tr>';
            noLogsMsg.style.display = 'none';

            // helper to try urls in sequence
            async function tryFetchUrls(urls) {
                for (const url of urls) {
                    try {
                        const res = await fetch(url, { credentials: 'include' });
                        if (!res.ok) {
                            console.warn(`Request to ${url} returned status ${res.status}`);
                            continue;
                        }
                        const json = await res.json();
                        return { url, json };
                    } catch (err) {
                        console.warn(`Fetch to ${url} failed:`, err);
                    }
                }
                return null;
            }

            try {
                // candidate API hosts (same-origin first, then configured backends)
                const apiHosts = [
                    '', // relative (same origin)
                    'https://hostel-management-system-1-3c10.onrender.com',
                    'https://hostel-management-system-2-2x8y.onrender.com'
                ];

                // 1) fetch user-details (registered_at per username)
                const userDetailUrls = apiHosts.map(h => (h ? `${h}/user-details` : '/user-details'));
                const udResult = await tryFetchUrls(userDetailUrls);
                if (!udResult) throw new Error('Could not fetch user details from any known API host.');

                // 2) fetch visitor-logs (use same origin that worked for user-details if possible)
                const logUrls = [
                    udResult.url.replace('/user-details','/visitor-logs'),
                    ...apiHosts.map(h => (h ? `${h}/visitor-logs` : '/visitor-logs'))
                ];
                const logsResult = await tryFetchUrls(logUrls);
                if (!logsResult) throw new Error('Could not fetch visitor logs from any known API host.');

                // 3) fetch wardens list (to mark userType = 'warden')
                const wardensUrls = apiHosts.map(h => (h ? `${h}/admin/wardens/all` : '/admin/wardens/all'));
                const wdResult = await tryFetchUrls(wardensUrls);
                // wdResult may be null if endpoint is protected or unavailable; that's OK, we'll fallback to checking /warden/:username later if needed.

                userDetails = udResult.json.users || {};
                allLogs = logsResult.json.logs || [];

                // build warden set if we got the wardens list
                wardenSet = new Set();
                if (wdResult && Array.isArray(wdResult.json)) {
                    // response shape from server: array of wardens with .username
                    wdResult.json.forEach(w => {
                        if (w && w.username) wardenSet.add(String(w.username));
                    });
                }

                // merge and build combined logs (keeps registration events if no login exists)
                const presentKeys = new Set();
                combinedLogs = [];

                allLogs.forEach(l => {
                    const loginISO = l.login_time ? new Date(l.login_time).toISOString() : new Date().toISOString();
                    const key = `${l.username}::${loginISO}`;
                    presentKeys.add(key);
                    combinedLogs.push({
                        username: l.username,
                        registered_at: userDetails[l.username] || null,
                        login_time: loginISO,
                        status: l.status || 'Success',
                        type: 'login'
                    });
                });

                // include registration-only events if no login present
                Object.keys(userDetails).forEach(username => {
                    const regISO = userDetails[username];
                    if (!regISO) return;
                    const key = `${username}::${new Date(regISO).toISOString()}`;
                    if (!presentKeys.has(key)) {
                        combinedLogs.push({
                            username,
                            registered_at: regISO,
                            login_time: regISO,
                            status: 'Registered',
                            type: 'registered'
                        });
                        presentKeys.add(key);
                    }
                });

                // sort newest first
                combinedLogs.sort((a,b) => new Date(b.login_time) - new Date(a.login_time));

                // If we didn't get wardens list earlier, try to deduce warden users by pinging /warden/:username for unique usernames (lightweight fallback)
                if (wardenSet.size === 0) {
                    // collect up to 40 unique usernames to avoid flooding
                    const uniqueUsernames = Array.from(new Set(combinedLogs.map(c => c.username).filter(Boolean))).slice(0, 40);
                    await Promise.all(uniqueUsernames.map(async uname => {
                        try {
                            // try same hosts as before
                            for (const h of apiHosts) {
                                const url = h ? `${h}/warden/${encodeURIComponent(uname)}` : `/warden/${encodeURIComponent(uname)}`;
                                try {
                                    const r = await fetch(url, { credentials: 'include' });
                                    if (r.ok) {
                                        // if found, mark as warden and stop trying
                                        wardenSet.add(uname);
                                        break;
                                    }
                                } catch(e) { /* ignore per-host errors */ }
                            }
                        } catch(e) { /* ignore */ }
                    }));
                }

                // attach userType onto each combined log entry
                combinedLogs = combinedLogs.map(item => {
                    const uname = item.username || '';
                    let userType = 'Unknown';
                    if (!uname) {
                        userType = 'Unknown';
                    } else if (wardenSet.has(uname)) {
                        userType = 'warden';
                    } else if (userDetails[uname]) {
                        // exists in register -> assume student
                        userType = 'student';
                    } else {
                        // fallback: assume student unless proven warden
                        userType = 'student';
                    }
                    return { ...item, userType };
                });

                renderLogs(combinedLogs);

            } catch (err) {
                console.error('Fetch error:', err);
                logTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:#ef4444;">Network or server error fetching logs. Check backend URL and CORS.</td></tr>';
            }
        }


        // --- Render function ---
        function renderLogs(logs) {
            logTableBody.innerHTML = '';
            if (!logs || logs.length === 0) {
                noLogsMsg.style.display = 'block';
                return;
            }
            noLogsMsg.style.display = 'none';

            // apply filters
            const usernameFilter = (usernameFilterInput.value || '').trim().toLowerCase();
            const dateFilter = dateFilterInput.value ? new Date(dateFilterInput.value).toISOString().slice(0,10) : null;

            const filtered = logs.filter(log => {
                if (usernameFilter && !(String(log.username || '').toLowerCase().includes(usernameFilter))) return false;
                if (dateFilter) {
                    const logDate = (log.login_time ? new Date(log.login_time) : new Date()).toISOString().slice(0,10);
                    if (logDate !== dateFilter) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                noLogsMsg.style.display = 'block';
                return;
            }

            filtered.forEach(log => {
                const row = logTableBody.insertRow();

                // Username cell (pill)
                const cellUser = row.insertCell();
                const pill = document.createElement('span');
                pill.className = 'pill';
                pill.textContent = log.username || 'Unknown';
                cellUser.appendChild(pill);

                // Registered Date (always show from userDetails map)
                const cellReg = row.insertCell();
                cellReg.textContent = formatDateOnly(log.registered_at);

                // Event Time
                const cellTime = row.insertCell();
                cellTime.textContent = formatDateTime(log.login_time);

                // Status
                const cellStatus = row.insertCell();
                cellStatus.textContent = log.status || 'N/A';

                // User Type
                const cellType = row.insertCell();
                const typeSpan = document.createElement('span');
                typeSpan.className = 'pill';
                typeSpan.textContent = log.userType || 'Unknown';
                // style difference for warden/student
                if ((log.userType || '').toLowerCase() === 'warden') {
                    typeSpan.style.background = 'linear-gradient(90deg,#fde68a,#fca5a5)';
                    typeSpan.style.color = '#111';
                } else if ((log.userType || '').toLowerCase() === 'student') {
                    typeSpan.style.background = 'linear-gradient(90deg,#d1fae5,#bfdbfe)';
                    typeSpan.style.color = '#111';
                } else {
                    typeSpan.style.background = '#f3f4f6';
                    typeSpan.style.color = '#111';
                }
                cellType.appendChild(typeSpan);
            });
        }


        // --- Sorting helper ---
        let sortDirection = {}; // keep track by key
        function sortTable(columnIndex) {
            // mapping to combinedLogs keys
            const keyMap = ['username', 'registered_at', 'login_time', 'status', 'userType'];
            const key = keyMap[columnIndex];
            const dir = sortDirection[key] === 'asc' ? 'desc' : 'asc';
            sortDirection = {}; sortDirection[key] = dir;

            const sorted = combinedLogs.slice().sort((a,b) => {
                let A = a[key] || '';
                let B = b[key] || '';

                // dates handling
                if (key === 'registered_at' || key === 'login_time') {
                    A = new Date(A || 0);
                    B = new Date(B || 0);
                    return dir === 'asc' ? A - B : B - A;
                }
                // fallback string compare
                A = String(A).toUpperCase();
                B = String(B).toUpperCase();
                if (A < B) return dir === 'asc' ? -1 : 1;
                if (A > B) return dir === 'asc' ? 1 : -1;
                return 0;
            });

            renderLogs(sorted);
            // update icons
            document.querySelectorAll('th i').forEach(icon => icon.className = 'ri-sort-asc');
            const headerIcon = document.querySelector(`th:nth-child(${columnIndex+1}) i`);
            if (headerIcon) headerIcon.className = dir === 'asc' ? 'ri-sort-asc' : 'ri-sort-desc';
        }

        // --- Export CSV helper ---
        function downloadCSV() {
            if (!combinedLogs || combinedLogs.length === 0) return alert('No logs to export');
            const header = ['Username','Registered Date','Event Time','Status','User Type'];
            const rows = combinedLogs.map(r => [
                (r.username||''),
                formatDateOnly(r.registered_at),
                formatDateTime(r.login_time),
                r.status || '',
                r.userType || ''
            ]);
            const csv = [header, ...rows].map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
            const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `visitor-logs-${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        // Filter trigger (just re-render using existing combinedLogs)
        function filterLogs() {
            renderLogs(combinedLogs);
        }

        // initial load
        window.addEventListener('load', fetchVisitorLogs);
    </script>
</body>
</html>
