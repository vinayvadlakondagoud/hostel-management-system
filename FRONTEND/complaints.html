<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Raise a Complaint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: Inter, sans-serif; background: #f0f4f8; margin:0; padding:28px; }
    .card { background:white; border-radius:14px; max-width:880px; margin:0 auto; padding:28px; box-shadow:0 20px 50px rgba(0,0,0,0.08); border-top:6px solid #6366f1; }
    label { font-weight:600; color:#333; display:block; margin-bottom:6px; }
    .form-row { margin-bottom:18px; }
    input, select, textarea { width:100%; padding:12px; border-radius:10px; border:1px solid #d1d5db; font-size:0.95rem; background:#fff; }
    textarea{ min-height:120px; resize:vertical; }
    .btn { padding:12px 18px; border-radius:10px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
    .btn-primary { background:#6366f1; color:#fff; box-shadow:0 6px 18px rgba(99,102,241,0.12); width:100%; }
    .notice { margin-bottom:16px; padding:18px; border-radius:12px; background:#fff3f3; color:#8b1c1c; border:1px solid #ffdede; font-weight:600; }
    #loading { display:none; position:fixed; inset:0; align-items:center; justify-content:center; background:rgba(255,255,255,0.6); z-index:60; }
    #modal { display:none; position:fixed; inset:0; align-items:center; justify-content:center; background:rgba(31,41,55,0.5); z-index:70; }
    #modal .box { background:white; padding:18px; border-radius:10px; width:420px; max-width:92%; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h2 style="font-size:22px; font-weight:700;">New Issue Report</h2>
      <a href="home.html" style="background:#eef2ff;color:#4f46e5;padding:8px 12px;border-radius:8px;text-decoration:none;">← Back to Home</a>
    </div>

    <!-- Container where either the form or the blocked notice will be rendered -->
    <div id="mainContainer" aria-live="polite">
      <!-- Temporary placeholder shown while we verify -->
      <div id="verifying" style="padding:18px; background:#eef2ff; border-radius:10px; color:#374151; font-weight:600;">Verifying access…</div>
    </div>
  </div>

  <div id="loading"><div style="background:white;padding:14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.12);">Submitting…</div></div>

  <div id="modal" role="dialog" aria-modal="true">
    <div class="box">
      <h3 id="modalTitle" style="margin:0 0 8px 0; font-size:1.05rem;">Message</h3>
      <p id="modalBody" style="margin:0 0 12px 0; color:#374151;"></p>
      <div style="text-align:right">
        <button id="modalClose" style="background:#6366f1;color:#fff;padding:8px 12px;border-radius:8px;border:0;">Close</button>
      </div>
    </div>
  </div>

<script type="module">
/*
  Strict complaints.html:
  - If user has NO assigned room -> replace UI with static notice (no form, no inputs)
  - If user has assigned room -> render the interactive form
  - Server MUST enforce /complaints POST (return 403 if no room). See note below.
*/

const API_BASE = 'https://hostel-management-system-2-2x8y.onrender.com';

function showModal(title, msg, redirect=false){
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalBody').innerText = msg;
  const m = document.getElementById('modal');
  m.style.display = 'flex';
  document.getElementById('modalClose').onclick = () => {
    m.style.display = 'none';
    if (redirect) window.location.href = 'home.html';
  };
}

function setLoading(on){
  document.getElementById('loading').style.display = on ? 'flex' : 'none';
}

function renderBlockedNotice(message){
  const c = document.getElementById('mainContainer');
  c.innerHTML = ''; // remove anything
  const div = document.createElement('div');
  div.className = 'notice';
  div.innerText = message || 'You cannot write a complaint because no room is assigned.';
  c.appendChild(div);

  // Add an explanatory paragraph (non-interactive)
  const p = document.createElement('p');
  p.style.color = '#374151';
  p.style.marginTop = '10px';
  p.style.fontWeight = '500';
  p.innerText = 'If you believe this is wrong, contact the warden or admin. You will not be able to submit a complaint from this page until a room is assigned.';
  c.appendChild(p);
}

function renderForm(){
  const c = document.getElementById('mainContainer');
  c.innerHTML = ''; // clear placeholder
  c.innerHTML = `
    <form id="complaintForm" novalidate>
      <div class="form-row">
        <label for="category">Category <span style="color:#e11d48">*</span></label>
        <select id="category" name="category" required>
          <option value="">Select a category</option>
          <option value="Plumbing">💧 Plumbing Issue</option>
          <option value="Electrical">💡 Electrical Issue</option>
          <option value="Cleanliness">🧹 Cleanliness/Hygiene</option>
          <option value="Mess">🍽️ Mess/Food Quality</option>
          <option value="Security">🛡️ Security/Safety</option>
          <option value="Other">❓ Other</option>
        </select>
      </div>

      <div class="form-row">
        <label for="location">Location (Room/Area)</label>
        <input id="location" name="location" placeholder="e.g., Room 202, Ground Floor Bathroom" />
      </div>

      <div class="form-row">
        <label for="subject">Subject</label>
        <input id="subject" name="subject" maxlength="100" placeholder="e.g., Leaking faucet in the washroom" />
      </div>

      <div class="form-row">
        <label for="description">Detailed Description</label>
        <textarea id="description" name="description" placeholder="Describe issue in detail" required></textarea>
      </div>

      <div class="form-row">
        <button id="submitBtn" class="btn btn-primary" type="submit">Submit Complaint</button>
      </div>
    </form>
  `;

  // attach submit handler
  const form = document.getElementById('complaintForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    // basic validation
    const description = document.getElementById('description').value || '';
    if (description.trim().length < 5) {
      showModal('Validation', 'Please add more details (min 5 characters).');
      return;
    }

    const username = localStorage.getItem('username');
    if (!username) { showModal('Error','Please login first'); return; }

    const payload = {
      subject: document.getElementById('subject').value || '(No subject)',
      description,
      category: document.getElementById('category').value || 'Other',
      location: document.getElementById('location').value || '',
      username
    };

    setLoading(true);
    try {
      const res = await fetch(API_BASE + '/complaints', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });

      const ct = (res.headers.get('content-type') || '').toLowerCase();
      let body = null;
      if (ct.includes('application/json')) body = await res.json();
      else body = await res.text();

      if (res.ok) {
        showModal('Success','Complaint submitted. Redirecting to home...', true);
        form.reset();
      } else if (res.status === 403) {
        // server forbid — remove form and show blocked message
        const msg = body && (body.error || body.message) ? (body.error || body.message) : 'Access denied';
        renderBlockedNotice(String(msg));
        showModal('Submission Blocked', msg);
      } else {
        const msg = body && (body.error || body.message) ? (body.error || body.message) : 'Server error';
        showModal('Submit Failed', msg);
      }
    } catch (err) {
      console.error('Submit error', err);
      showModal('Submit Failed', 'Network error. Try later.');
    } finally {
      setLoading(false);
    }
  });
}

/* ---------- Access verification ---------- */
async function verifyAndRender(){
  const username = localStorage.getItem('username');

  // if no login -> block (replace UI)
  if (!username) {
    renderBlockedNotice('Please login first to submit a complaint.');
    return;
  }

  // Try to check assigned room
  try {
    const resp = await fetch(API_BASE + '/my-room/' + encodeURIComponent(username));
    // If server returns 200 with room object -> assigned, else if message -> not assigned
    const data = await resp.json();

    // If server returns an object with room_no or room field => user has room
    const hasRoom = !!(data && (data.room_no || (data.room && data.room.room_no)));

    if (hasRoom) {
      // show interactive form
      renderForm();
    } else {
      // no room — remove form entirely, show message
      renderBlockedNotice('You cannot write a complaint because no room is assigned.');
    }
  } catch (err) {
    console.error('Access verify failed', err);
    // safer: block UI if verification fails
    renderBlockedNotice('Could not verify room assignment. Please try again later or contact admin.');
  }
}

/* ---------- init ---------- */
document.addEventListener('DOMContentLoaded', () => {
  verifyAndRender();
});
</script>
</body>
</html>
