<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - Payment Requests</title>

  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="payment-admin.css">

  <style>
    /* Small overrides / additional styles so the back button integrates */
    .admin-root { max-width:1200px; margin:28px auto; padding:20px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:14px; }
    .logo { width:52px; height:52px; border-radius:12px; background:linear-gradient(135deg,#4f46e5,#8f94fb); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; }
    .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .back-link {
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:10px;
      background:#eef2ff; color:#4338ca; text-decoration:none; font-weight:700; border:1px solid rgba(67,56,202,0.06);
      box-shadow: inset 0 -1px 0 rgba(0,0,0,0.02);
    }
    .back-link:hover { transform:translateY(-1px); }
    /* Keep other styles in payment-admin.css */
    @media(max-width:900px){ header{align-items:flex-start;} .controls{width:100%; justify-content:flex-start;} }
  </style>
</head>
<body>
  <div class="admin-root">
    <header>
      <div class="brand">
        <div class="logo">P</div>
        <h1>Payment Requests</h1>
      </div>
      <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by username or ID" onkeyup="fetchRequests(this.value)" style="padding:10px 14px; border-radius:10px; border:1px solid #e5e7eb;">
        <button id="approveAll" class="back-link" style="background:#16a34a; color:#fff; border-color:rgba(22,163,74,0.1)">✅ Approve All</button>
        <button id="rejectAll" class="back-link" style="background:#ef4444; color:#fff; border-color:rgba(239,68,68,0.1)">❌ Reject All</button>
        <a href="admin-home.html" class="back-link"><i class="ri-arrow-left-line"></i> Back</a>
      </div>
    </header>

    <div class="summary-cards">
      <div class="card">
        <i class="ri-list-check-2-line"></i>
        <h3>Total Requests</h3>
        <p id="totalRequests">0</p>
      </div>
      <div class="card pending">
        <i class="ri-time-line"></i>
        <h3>Pending</h3>
        <p id="pendingRequests">0</p>
      </div>
      <div class="card approved">
        <i class="ri-check-line"></i>
        <h3>Approved</h3>
        <p id="approvedRequests">0</p>
      </div>
      <div class="card rejected">
        <i class="ri-close-line"></i>
        <h3>Rejected</h3>
        <p id="rejectedRequests">0</p>
      </div>
    </div>

    <div class="requests-container">
      <table class="requests-table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Amount</th>
            <th>Card Last 4</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="6" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

<script>
    const BASE = "https://hostel-management-system-2-2x8y.onrender.com";
    
    // Function to update the summary boxes
    function updateSummary(arr) {
        document.getElementById('totalRequests').textContent = arr.length;
        document.getElementById('pendingRequests').textContent = arr.filter(r => r.status === 'Pending').length;
        document.getElementById('approvedRequests').textContent = arr.filter(r => r.status === 'Approved').length;
        document.getElementById('rejectedRequests').textContent = arr.filter(r => r.status === 'Rejected').length;
    }

    // Function to fetch and render requests
    async function fetchRequests(search = '') {
        const tbody = document.querySelector(".requests-table tbody");
        tbody.innerHTML = '<tr><td colspan="6" class="empty">Loading...</td></tr>';
        
        try {
            const res = await fetch(`${BASE}/payment-requests?search=${search}`);
            const arr = await res.json();
            
            if (!Array.isArray(arr) || arr.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">No payment requests found.</td></tr>';
                updateSummary(arr);
                return;
            }
            
            tbody.innerHTML = arr.map(r => `
                <tr data-status="${r.status}">
                    <td>${r.username}</td>
                    <td>₹${r.amount ? r.amount.toLocaleString() : 'N/A'}</td>
                    <td>${r.card_last4 || '-'}</td>
                    <td>${r.created_at ? r.created_at.split('T')[0] : 'N/A'}</td>
                    <td class="status-cell">${r.status}</td>
                    <td>
                        <div class="actions">
                            <button class="action-btn approve" data-id="${r.id}" data-action="approve">✅ Approve</button>
                            <button class="action-btn reject" data-id="${r.id}" data-action="reject">❌ Reject</button>
                        </div>
                    </td>
                </tr>
            `).join('');

            updateSummary(arr);

        } catch (err) {
            console.error("Error loading payment requests:", err);
            tbody.innerHTML = '<tr><td colspan="6" class="empty">Error loading data.</td></tr>';
            updateSummary([]);
        }
    }
    
    // Event listener for individual action buttons
    document.querySelector('.requests-table').addEventListener('click', async (e) => {
        const btn = e.target.closest('.action-btn');
        if (!btn) return;

        const id = btn.dataset.id;
        const action = btn.dataset.action;

        if (action === 'approve') {
            if (!confirm('Approve this payment request?')) return;
            try { 
                const res = await fetch(`${BASE}/payment-requests/${id}/approve`, { method: 'PATCH' }); 
                const data = await res.json(); 
                alert(data.message || 'Approved'); 
            } catch (e) { alert('Server error') }
        } else if (action === 'reject') {
            if (!confirm('Reject this payment request?')) return;
            try { 
                const res = await fetch(`${BASE}/payment-requests/${id}/reject`, { method: 'PATCH' }); 
                const data = await res.json(); 
                alert(data.message || 'Rejected'); 
            } catch (e) { alert('Server error') }
        }
        fetchRequests(document.getElementById('searchInput').value);
    });

    // Event listeners for bulk actions
    document.getElementById('approveAll').addEventListener('click', async () => {
        if(!confirm('Approve all pending requests shown? This will be done in the backend.')) return;
        try{
            const res = await fetch(`${BASE}/payment-requests/bulk-approve`, { method:'PATCH' });
            const data = await res.json();
            alert(data.message || 'Bulk approval complete.');
        }catch(e){alert('Error performing bulk operation')}
        fetchRequests(document.getElementById('searchInput').value);
    });

    document.getElementById('rejectAll').addEventListener('click', async () => {
        if(!confirm('Reject all pending requests shown? This will be done in the backend.')) return;
        try{
            const res = await fetch(`${BASE}/payment-requests/bulk-reject`, { method:'PATCH' });
            const data = await res.json();
            alert(data.message || 'Bulk rejection complete.');
        }catch(e){alert('Error performing bulk operation')}
        fetchRequests(document.getElementById('searchInput').value);
    });

    // initial load ONLY. Polling is removed.
    fetchRequests(); 
</script>
</body>
</html>
