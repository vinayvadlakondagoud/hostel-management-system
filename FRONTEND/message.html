<!-- message.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>User Messages</title>
</head>
<body>
  <h2>Send Message</h2>

  <label>Send to:
    <select id="recipientSelect">
      <option value="admin:">Admin</option>
      <option value="warden:education">Warden — Education</option>
      <option value="warden:kitchen">Warden — Kitchen</option>
      <option value="warden:maintenance">Warden — Maintenance</option>
      <!-- optionally populate specific wardens or users below -->
    </select>
  </label>

  <input id="subject" placeholder="Subject (optional)"/>
  <textarea id="message" placeholder="Your message"></textarea>
  <button id="sendBtn">Send</button>

  <h3>Inbox</h3>
  <div id="inbox"></div>

<script>
const API = 'https://hostel-management-system-2-2x8y.onrender.com'; // change to your server
const me = { role: 'user', username: localStorage.getItem('username') };

document.getElementById('sendBtn').addEventListener('click', async () => {
  const sel = document.getElementById('recipientSelect').value.split(':');
  const recipient_role = sel[0];
  const recipient_subrole = sel[1] || null;
  const body = {
    sender_role: me.role,
    sender_username: me.username,
    recipient_role,
    recipient_subrole,
    subject: document.getElementById('subject').value,
    message: document.getElementById('message').value
  };
  const r = await fetch(API + '/messages', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  alert((await r.json()).message || 'Sent');
  loadInbox();
});

async function loadInbox() {
  const url = `${API}/messages?recipient_role=user&recipient_username=${encodeURIComponent(me.username)}`;
  const r = await fetch(url);
  const rows = await r.json();
  const container = document.getElementById('inbox');
  container.innerHTML = rows.map(m => `<div><b>${m.subject||'(no subject)'}</b><small> from ${m.sender_role}/${m.sender_username||'unknown'}</small><p>${m.message}</p></div>`).join('<hr/>');
}

loadInbox();
</script>
</body>
</html>
