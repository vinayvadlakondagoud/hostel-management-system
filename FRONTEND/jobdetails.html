
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join Our Team – HMS Careers</title>
  <style>
    :root {
      --primary: #4f46e5;
      --accent: #06b6d4;
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --radius: 12px;
      --shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: linear-gradient(to right, var(--primary), var(--accent));
      color: white;
      padding: 60px 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 2.2rem; }
    .container {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 20px;
    }
    .card {
      background: var(--card);
      padding: 30px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text);
    }
    select, input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    select:focus, input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    .salary-box {
      background-color: #f0f4ff;
      border: 1px solid var(--primary);
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-top: 20px;
    }
    .salary-box p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .salary-box h3 {
      margin: 5px 0 0 0;
      font-size: 2rem;
      color: var(--primary);
    }
    .btn-submit {
      display: inline-block;
      width: 100%;
      background-color: var(--accent);
      color: white;
      padding: 15px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 15px;
    }
    .btn-submit:hover {
      background-color: #0e96af;
    }
    #formMsg {
      padding: 10px;
      margin-top: 15px;
      border-radius: 8px;
      font-weight: 600;
      text-align: center;
      display: none; /* Hidden by default */
    }
    #formMsg.success {
      background-color: #d1fae5;
      color: #065f46;
      display: block;
    }
    #formMsg.error {
      background-color: #fee2e2;
      color: #991b1b;
      display: block;
    }
    .user-details-box {
        margin-bottom: 30px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #f7f9fc;
    }
    .user-details-box h2 {
        color: var(--primary);
        margin-top: 0;
    }
    .user-details-box ul {
        list-style: none;
        padding: 0;
        margin-top: 15px;
    }
    .user-details-box li {
        margin-bottom: 8px;
        padding: 5px 0;
        border-bottom: 1px dotted #eee;
    }
    .user-details-box li:last-child {
        border-bottom: none;
    }
    .btn-cancel {
  display: inline-block;
  width: 100%;
  background-color: #ef4444;
  color: white;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  cursor: pointer;
  margin-top: 15px;
  transition: 0.2s;
}

.btn-cancel:hover {
  background-color: #dc2626;
}
  </style>
</head>
<body>
  <header>
    <h1>HMS Warden Careers</h1>
    <p>Complete your job application details.</p>
  </header>

  <main class="container">
    <div class="card">
        
        <div id="userDetailsDisplay" class="section user-details-box">
            <h2 id="welcomeHeader">Welcome!</h2>
            <p id="detailsMessage">Fetching your registered details...</p>
            <ul id="detailsList">
                </ul>
        </div>
        <h2>Warden Job Details</h2>

      <form id="jobDetailsForm">

        <div class="form-group">
          <label for="jobRole">Select Job Role</label>
          <select id="jobRole" name="jobRole" required>
            <option value="">-- Choose a role --</option>
            <option value="Education">Education Department</option>
            <option value="Maintenance">Maintenance Department</option>
            <option value="Kitchen">Kitchen Department</option>
          </select>
        </div>

        <div class="form-group">
          <label for="shift">Select Shift</label>
          <select id="shift" name="shift" required>
            <option value="">-- Choose a shift --</option>
            <option value="day">Day Shift</option>
            <option value="night">Night Shift</option>
          </select>
        </div>

        <div class="salary-box">
          <p>Estimated Monthly Salary:</p>
          <h3 id="salaryDisplay">₹0</h3>
        </div>

        
        <button type="button" id="cancelBtn" class="btn-cancel">Cancel</button>
        <button type="submit" class="btn-submit">Submit Application</button>
        <div id="formMsg"></div>
      </form>
    </div>
  </main>

 <script>
    // --- Configuration (Kept as is) ---
    const roleEl = document.getElementById('jobRole');
    const shiftEl = document.getElementById('shift');
    const salaryDisplay = document.getElementById('salaryDisplay');
    const BASE_URL = 'https://hostel-management-system-2-2x8y.onrender.com'; 

    const salaryData = {
        'Education': { 'day': 20000, 'night': 25000 },
        'Maintenance': { 'day': 25000, 'night': 28000 },
        'Kitchen': { 'day': 30000 }
    };

    function updateSalary() {
        const selectedRole = roleEl.value;
        const selectedShift = shiftEl.value;
        let salary = 0;
        if (selectedRole && selectedShift && salaryData[selectedRole] && salaryData[selectedRole][selectedShift]) {
            salary = salaryData[selectedRole][selectedShift].toLocaleString('en-IN', { style: 'currency', currency: 'INR' }).replace('INR', '₹');
        } else {
            salary = '₹0';
        }
        salaryDisplay.textContent = salary;
    }

    // Global variable to store fetched data
    let occupiedSlots = {}; 
    
    // Fetch occupied slots from the backend
    async function fetchOccupiedSlots() {
        try {
            const res = await fetch(`${BASE_URL}/api/occupied-job-slots`);
            if (res.ok) {
                occupiedSlots = await res.json();
            } else {
                console.error('Failed to fetch occupied job slots:', res.status);
            }
        } catch (e) {
            console.error('Error fetching occupied job slots:', e);
        }
    }

    // 1. NEW HELPER: Calculate total count for a role across all shifts
    function getRoleCount(roleKey) {
        // Ensure roleKey is lowercased to match backend structure
        const roleOccupancy = occupiedSlots[roleKey.toLowerCase()]; 
        if (!roleOccupancy) return 0;
        // Sum counts for all shifts (e.g., day + night)
        return Object.values(roleOccupancy).reduce((sum, count) => sum + Number(count || 0), 0);
    }

    // 2. UPDATED FILTER FUNCTION
    function filterShifts() {
        const roleOptions = Array.from(roleEl.options);
        const shiftOptions = Array.from(shiftEl.options);

        // --- JOB ROLE DISABLING LOGIC ---
        // Limits: Education (2), Maintenance (2), Kitchen (1)
        const jobRoleLimits = {
            'Education': 2,
            'Maintenance': 2,
            'Kitchen': 1
        };

        roleOptions.forEach(option => {
            if (option.value === '') return; // Skip the placeholder option

            const roleName = option.value;
            const limit = jobRoleLimits[roleName];
            
            if (limit !== undefined) {
                const currentCount = getRoleCount(roleName);
                const isDisabled = currentCount >= limit;
                option.disabled = isDisabled;

                // If the option is now disabled and it was the currently selected value, clear the selection.
                if (isDisabled && roleEl.value === roleName) {
                    roleEl.value = ''; 
                }
            }
        });
        // --- END JOB ROLE DISABLING LOGIC ---

        // Re-get selected role as it may have been cleared above
        const newSelectedRole = roleEl.value;

        // --- SHIFT DISABLING LOGIC (Preserved and cleaned up) ---
        shiftOptions.forEach(option => {
            if (option.value === '') return; // skip placeholder
            const shiftValue = option.value;
            const selectedRoleKey = newSelectedRole.toLowerCase();

            // 1. Check if the shift is allowed by the role (based on salaryData)
            const isAllowedByRole = salaryData[newSelectedRole] && salaryData[newSelectedRole][shiftValue];

            if (isAllowedByRole) {
                // 2. If allowed, check if the specific role+shift slot is occupied
                const occupiedCount = occupiedSlots[selectedRoleKey] 
                    ? occupiedSlots[selectedRoleKey][shiftValue] 
                    : 0;
                
                // Assuming one warden per shift slot is the standard occupancy check (count > 0)
                const isOccupied = Number(occupiedCount || 0) > 0; 

                option.disabled = isOccupied;
                option.style.display = 'block';

                // if disabled (occupied) and selected, clear it
                if (isOccupied && shiftEl.value === shiftValue) shiftEl.value = '';
            } else {
                // Not allowed by role (e.g. kitchen-night, or no role selected)
                option.disabled = true;
                option.style.display = 'none';
                if (shiftEl.value === shiftValue) shiftEl.value = '';
            }
        });

        // Always update salary after changing selection/options
        updateSalary(); 
    }
    
    // --- Execution and Event Listeners (Kept as is) ---
    // Initial fetch and filter
    (async () => { 
        await fetchOccupiedSlots(); 
        filterShifts(); // ensure UI shows disabled options on load
    })(); 

    // Attach events
    roleEl.addEventListener('change', filterShifts); 
    roleEl.addEventListener('change', updateSalary); 
    shiftEl.addEventListener('change', updateSalary);
    
    // ... rest of the original script (form submit, etc.) ..

    
    // --- START: NEW LOGIC TO FETCH AND DISPLAY WARDEN DETAILS ---

    async function fetchWardenDetails() {
        const username = getQueryParam('username');
        const welcomeHeaderEl = document.getElementById('welcomeHeader');
        const detailsMessageEl = document.getElementById('detailsMessage');
        const detailsListEl = document.getElementById('detailsList');

        if (!username) {
            welcomeHeaderEl.textContent = 'Welcome!';
            detailsMessageEl.textContent = 'Complete the form below to apply for a job.';
            // Optionally hide the list if no username
            document.getElementById('userDetailsDisplay').style.display = 'none'; 
            return;
        }

        const fetchUrl = `${BASE_URL}/warden/${encodeURIComponent(username)}`;

        try {
            detailsMessageEl.textContent = `Hello, ${username}. Fetching your details...`;
            const res = await fetch(fetchUrl);
            const data = await res.json();

            if (!res.ok) {
                detailsMessageEl.textContent = `Could not fetch your registered details.`;
                console.error('Server error:', data.message);
                return;
            }

            // Success! Display the details.
            welcomeHeaderEl.textContent = `Welcome, ${data.name || data.fullname}!`;
            detailsMessageEl.textContent = `Successfully retrieved your registered account details.`;

            const details = [
                { label: 'Username', value: data.username },
                { label: 'Full Name', value: data.name || data.fullname },
                { label: 'Email', value: data.email },
                { label: 'Contact No.', value: data.contact }
            ];

            detailsListEl.innerHTML = details.map(item =>
                `<li><strong>${item.label}:</strong> ${item.value}</li>`
            ).join('');

        } catch (error) {
            console.error('Error fetching warden details:', error);
            detailsMessageEl.textContent = 'A network error occurred while fetching your details. Please check the console for errors.';
        }
    }

    // Call initial setup functions
    fetchWardenDetails();
    
    // initial fetch of occupied slots and then run filter to reflect current state
    (async () => {
      await fetchOccupiedSlots();
      filterShifts(); // ensure UI shows disabled options on load
    })();

    // Form submit
    document.getElementById('jobDetailsForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const fm = document.getElementById('formMsg');
      fm.className = '';

      const role = roleEl.value;
      const shift = shiftEl.value;
      const username = getQueryParam('username');

      if (!role || !shift) {
        fm.className = 'error';
        fm.textContent = 'Please select role and shift.';
        return;
      }

      if (!username) {
        fm.className = 'error';
        fm.textContent = 'Username missing. Please login again.';
        return;
      }
      
      // re-fetch occupancy just before submitting to avoid race conditions
      await fetchOccupiedSlots();

      // validate chosen slot not occupied
      const chosenRoleKey = (role || '').toString().trim().toLowerCase();
      const chosenShiftKey = (shift || '').toString().trim().toLowerCase();
      if (chosenRoleKey === 'kitchen') {
        // kitchen role: if any kitchen slot present, reject
        if (occupiedSlots['kitchen'] && Object.values(occupiedSlots['kitchen']).some(v => Number(v || 0) > 0)) {
          fm.className = 'error';
          fm.textContent = 'Kitchen role already taken. Please choose another role.';
          return;
        }
      } else {
        if (occupiedSlots[chosenRoleKey] && Number(occupiedSlots[chosenRoleKey][chosenShiftKey] || 0) > 0) {
          fm.className = 'error';
          fm.textContent = 'Selected role/shift already filled. Please pick another available slot.';
          return;
        }
      }


      try {
        const res = await fetch(`${BASE_URL}/apply-job`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username,
            job_role: role,
            shift
          })
        });

        const data = await res.json();

        if (!res.ok) {
          fm.className = 'error';
          fm.textContent = data.message || "Error submitting application";
          return;
        }
        
// mark applied to prevent auto-delete
if (window.__markWardenApplied) window.__markWardenApplied();

        // SUCCESS BLOCK MODIFICATION: Redirect to warden-login.html
        fm.className = 'success';
        fm.textContent = "Application submitted successfully! Redirecting...";
        
        setTimeout(() => {
            window.location.href = 'warden-login.html';
        }, 1500); // Redirect after 1.5 seconds to show the success message first

      } catch (err) {
        fm.className = 'error';
        fm.textContent = "Network error!";
      }
    });
    
    document.getElementById("cancelBtn").addEventListener("click", async function() {
    const username = getQueryParam("username");
    if (!username) {
        alert("Username missing. Cannot cancel.");
        return;
    }

    const confirmDelete = confirm("Are you sure you want to cancel? Your registration data will be deleted.");
    if (!confirmDelete) return;

    try {
        const res = await fetch(`${BASE_URL}/warden/delete/${username}`, {
            method: "DELETE"
        });

        const data = await res.json();

        if (res.ok) {
            alert("Registration cancelled successfully.");
            window.location.href = "warden-register.html";
        } else {
            alert("Error: " + data.message);
        }
    } catch (err) {
        console.error(err);
        alert("Network error while deleting account.");
    }
});

  </script>
  <script>
/* --- AUTO-CANCEL PENDING REGISTRATION ON NAV AWAY (if user didn't apply) --- */
(function() {
  // require the page's BASE_URL and getQueryParam to already exist (they do in your file)
  const username = getQueryParam('username') || (localStorage.getItem && localStorage.getItem('registered_username'));
  if (!username) return; // nothing to do if no username present

  // flag set to true when user completes the job application
  let applied = false;

  // expose a small function the submit handler can call to mark as applied (defensive)
  window.__markWardenApplied = function() { applied = true; };

  // call to cancel registration on server
  async function sendCancel() {
    try {
      const url = `${BASE_URL}/register/cancel`;
      const payload = JSON.stringify({ username });

      // Prefer navigator.sendBeacon for reliability during unload
      if (navigator && typeof navigator.sendBeacon === 'function') {
        const blob = new Blob([payload], { type: 'application/json' });
        const ok = navigator.sendBeacon(url, blob);
        if (ok) return true;
      }

      // fallback: use fetch with keepalive
      await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload,
        keepalive: true
      });
      return true;
    } catch (e) {
      console.warn('register cancel failed', e);
      return false;
    }
  }

  // on pagehide/beforeunload (cover multiple events for reliability)
  function handleUnload(e) {
    if (applied) return;
    // best-effort — do not block unload
    sendCancel();
    // also remove fallback stored localStorage
    try { localStorage.removeItem('registered_username'); } catch (e) {}
  }

  // pagehide is recommended for unload in modern browsers
  window.addEventListener('pagehide', handleUnload, { passive: true });
  window.addEventListener('beforeunload', handleUnload, { passive: true });
  // also try visibilitychange (tab close/minimize)
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') handleUnload();
  }, { passive: true });

  // If you used localStorage to pass username from register page, keep it tidy:
  try { localStorage.setItem('registered_username', username); } catch (e) {}

  // Hook into your form submit success to prevent deletion:
  // Your existing submit handler sets success and redirects — call __markWardenApplied() there.
  // If you cannot modify the handler (but you can), you can attempt to detect after a successful fetch to apply-job,
  // however the simplest is to call window.__markWardenApplied() in the success block of jobDetailsForm submit.
})();
</script>
</body>
</html>
