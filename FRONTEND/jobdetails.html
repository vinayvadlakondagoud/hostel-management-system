<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join Our Team – HMS Careers</title>
  <style>
    :root {
      --primary: #4f46e5;
      --accent: #06b6d4;
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --radius: 12px;
      --shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: linear-gradient(to right, var(--primary), var(--accent));
      color: white;
      padding: 60px 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 2.2rem; }
    .container {
      max-width: 980px;
      margin: 30px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .details-card, .application-form {
      background: var(--card);
      padding: 25px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid #e5e7eb;
    }
    h2 {
      color: var(--primary);
      margin-top: 0;
      border-bottom: 2px solid #f3f4f6;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    /* Style for fetched details */
    #wardenInfoDisplay {
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background-color: #f9fafb;
    }
    #wardenInfoDisplay ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #wardenInfoDisplay li {
      margin-bottom: 8px;
      color: var(--text);
      font-size: 1rem;
    }
    #wardenInfoDisplay strong {
      color: var(--primary);
      font-weight: 600;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: var(--muted);
    }
    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      font-size: 1rem;
    }
    button {
      background: var(--accent);
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    button:hover {
      background: #0e7490; /* Darker accent */
    }
    .message {
      padding: 10px;
      margin-top: 15px;
      border-radius: 6px;
      font-weight: 500;
      text-align: center;
    }
    .success {
      background-color: #d1fae5;
      color: #065f46;
    }
    .error {
      background-color: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>

  <header>
    <h1>HMS Warden Career Portal</h1>
    <p>Complete your application details below.</p>
  </header>

  <div class="container">
    
    <section class="details-card">
      <h2>Your Registration Details</h2>
      <div id="wardenInfoDisplay">Loading user details...</div>
    </section>

    <section class="application-form">
      <h2>Job Application Details</h2>
      <form id="jobDetailsForm">

        <label for="jobRole">Job Role</label>
        <select id="jobRole" name="jobRole" required>
          <option value="">Select Role</option>
          <option value="junior">Junior Warden</option>
          <option value="senior">Senior Warden</option>
        </select>

        <label for="shift">Shift</label>
        <select id="shift" name="shift" required>
          <option value="">Select Shift</option>
          <option value="day">Day Shift (8:00 AM - 4:00 PM)</option>
          <option value="evening">Evening Shift (4:00 PM - 12:00 AM)</option>
          <option value="night">Night Shift (12:00 AM - 8:00 AM)</option>
        </select>
        
        <label>Expected Monthly Salary:</label>
        <p id="salaryDisplay">₹0</p>
        
        <button type="submit">Submit Job Application</button>
        <div id="formMsg" class="message" style="display: none;"></div>
      </form>
    </section>

  </div>

  <script>
    // Salary data mapping (kept from your original file)
    const salaryData = {
      junior: { day: 10000, evening: 12000, night: 14000 },
      senior: { day: 13000, evening: 15000, night: 17000 }
    };

    const roleEl = document.getElementById('jobRole');
    const shiftEl = document.getElementById('shift');
    const salaryDisplay = document.getElementById('salaryDisplay');
    const formMsg = document.getElementById('formMsg');
    
    // ----------------------------------------------------------------------
    // 1. HELPER FUNCTIONS
    // ----------------------------------------------------------------------

    // Helper: get query param
    function getQueryParam(name){
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    // Function to calculate and update salary display
    function updateSalary(){
      const r = roleEl.value;
      const s = shiftEl.value;
      if (r && s && salaryData[r] && salaryData[r][s]) {
        salaryDisplay.textContent = '₹' + salaryData[r][s].toLocaleString('en-IN');
      } else {
        salaryDisplay.textContent = '₹0';
      }
    }

    // ----------------------------------------------------------------------
    // 2. DATA FETCHING LOGIC (The Fix)
    // ----------------------------------------------------------------------

    async function fetchAndDisplayWardenDetails() {
      const username = getQueryParam('username');
      const displayDiv = document.getElementById('wardenInfoDisplay');

      if (!username) {
        displayDiv.innerHTML = '<p class="error">❌ Error: No username provided in URL.</p>';
        return;
      }
      
      displayDiv.innerHTML = '<p>Loading details for username: <strong>' + username + '</strong>...</p>';

      try {
        // Call the new API endpoint defined in server.js
        const apiUrl = /warden/details/${encodeURIComponent(username)};
        // Note: Use your full render URL if this page is not served from the same domain as the server.
        // const apiUrl = 'https://your-render-app.onrender.com' + /warden/details/${encodeURIComponent(username)};
        
        const res = await fetch(apiUrl);
        
        if (!res.ok) {
          const errorData = await res.json().catch(() => ({}));
          throw new Error(errorData.message || 'Failed to fetch details from server (Status ' + res.status + ').');
        }
        
        const warden = await res.json();
        
        // 3. Display the fetched data on the page
        displayDiv.innerHTML = `
          <p>Registration Data:</p>
          <ul>
            <li>Full Name: <strong>${warden.fullname || 'N/A'}</strong></li>
            <li>Username: <strong>${warden.username}</strong></li>
            <li>Contact: <strong>${warden.contact || 'N/A'}</strong></li>
            <li>Email (Gmail): <strong>${warden.email || 'N/A'}</strong></li>
          </ul>
        `;

      } catch (error) {
        console.error('Error fetching warden details:', error);
        displayDiv.innerHTML = <p class="error">Error loading warden details: ${error.message}</p>;
      }
    }

    // ----------------------------------------------------------------------
    // 3. EVENT LISTENERS
    // ----------------------------------------------------------------------

    // Load data and setup event listeners when the page loads
    window.addEventListener('load', () => {
        fetchAndDisplayWardenDetails();
        updateSalary();
    });

    roleEl.addEventListener('change', updateSalary);
    shiftEl.addEventListener('change', updateSalary);
    
    document.getElementById('jobDetailsForm').addEventListener('submit', function(e){
      e.preventDefault();
      
      formMsg.style.display = 'block';
      formMsg.className = '';
      
      const role = roleEl.value, shift = shiftEl.value;
      
      if (!role || !shift) {
        formMsg.className = 'error';
        formMsg.textContent = 'Please select role and shift.';
        return;
      }
      
      // In a real application, you would POST this application data to a server endpoint here.
      formMsg.className = 'success';
      formMsg.textContent = 'Application submitted successfully! Thank you for applying.';
      // Optionally disable form after submission
      // document.getElementById('jobDetailsForm').querySelector('button').disabled = true;
    });

  </script>
</body>
</html>
