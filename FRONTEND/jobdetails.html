<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join Our Team – HMS Careers</title>

  <style>
    :root {
      --primary: #4f46e5;
      --accent: #06b6d4;
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --radius: 12px;
      --shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: linear-gradient(to right, var(--primary), var(--accent));
      color: white;
      padding: 60px 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 2.2rem; }

    .container {
      max-width: 980px;
      margin: 24px auto;
      background: var(--card);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    label { display:block; margin-top:12px; font-weight:600; }
    select, input {
      width:100%;
      padding:10px;
      margin-top:6px;
      border-radius:10px;
      border:1px solid #e5e7eb;
    }

    .salary-box {
      margin-top:16px;
      font-weight:700;
      font-size:1.1rem;
    }

    .btn {
      padding:10px 14px;
      border-radius:10px;
      border:none;
      margin-top:18px;
      cursor:pointer;
    }
    .btn-primary { background:var(--primary); color:white; }

    .info-box {
      margin-top:20px;
      padding:16px;
      border-radius:10px;
      border:1px solid #e6eef6;
      background:#fcfeff;
      box-shadow:var(--shadow);
    }
    .info-box strong { color:#111; }

    .error { color:#ef4444; }
    .success { color:#10b981; }

    footer {
      text-align:center;
      margin-top:28px;
      color:var(--muted);
      font-size:0.9rem;
    }
  </style>
</head>

<body>

  <header>
    <h1>Apply as Warden — HMS Careers</h1>
  </header>

  <div class="container">

    <!-- ⭐ USER DETAILS BOX (NEWLY ADDED) -->
    <div class="info-box">
      <p><strong>Username:</strong> <span id="dispUsername">Loading...</span></p>
      <p><strong>Email:</strong> <span id="dispEmail">Loading...</span></p>
      <p><strong>Contact:</strong> <span id="dispContact">Loading...</span></p>
    </div>

    <form id="jobDetailsForm">
      <label>Job Role As WARDEN</label>
      <select id="jobRole" required>
        <option value="">Select Role</option>
        <option value="frontdesk">Educational Department</option>
        <option value="housekeeping">Maintenance Department</option>
        <option value="cook">Cook / Kitchen Department</option>
      </select>

      <label>Preferred Shift</label>
      <select id="shift" required>
        <option value="">Select Shift</option>
        <option value="morning">Morning</option>
        <option value="night">Night</option>
      </select>

      <div class="salary-box">
        Estimated Salary: <span id="salaryDisplay">₹0</span>
      </div>

      <button id="submitBtn" class="btn btn-primary" type="submit">Confirm & Submit</button>
      <button type="button" class="btn" onclick="location.href='index.html'">Cancel</button>

      <p id="formMsg"></p>
    </form>

  </div>

  <footer>&copy; 2025 HMS Hostel Careers</footer>

<script>
  const salaryData = {
    frontdesk: { morning: 15000, night: 18000 },
    housekeeping: { morning: 12000, night: 15000 },
    cook: { morning: 18000, night: 22000 }
  };

  const roleEl = document.getElementById("jobRole");
  const shiftEl = document.getElementById("shift");
  const salaryDisplay = document.getElementById("salaryDisplay");

  function updateSalary() {
    const r = roleEl.value;
    const s = shiftEl.value;

    if (r && s && salaryData[r] && salaryData[r][s]) {
      salaryDisplay.textContent = "₹" + salaryData[r][s];
    } else {
      salaryDisplay.textContent = "₹0";
    }
  }

  roleEl.addEventListener("change", updateSalary);
  shiftEl.addEventListener("change", updateSalary);

  async function loadRegisterUser() {
  const params = new URLSearchParams(window.location.search);
  const username = params.get("username");

  if (!username) return;

  const res = await fetch("https://hostel-management-system-2-2x8y.onrender.com/warden/" + username);
  const data = await res.json();

  document.getElementById("regUsername").textContent = data.username;
  document.getElementById("regContact").textContent = data.contact;
  document.getElementById("regEmail").textContent = data.email;
    } catch (err) {
      console.error("Error loading warden details:", err);
    }
  }

  loadWardenDetails();

  document.getElementById("jobDetailsForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const fm = document.getElementById("formMsg");
    fm.className = "";
    const role = roleEl.value;
    const shift = shiftEl.value;

    if (!role || !shift) {
      fm.className = "error";
      fm.textContent = "Please select role and shift.";
      return;
    }

    fm.className = "success";
    fm.textContent = "Application submitted successfully!";

    setTimeout(() => {
      location.href = "warden-login.html";
    }, 800);
  });
</script>

</body>
</html>
