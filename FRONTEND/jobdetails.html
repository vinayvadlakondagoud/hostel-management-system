<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Student Academic Details</title>
  <style>
    :root{
      --bg1:#5b21b6;
      --bg2:#8b5cf6;
      --card:#0b1220;
      --panel:#26343d;
      --muted:#98a7b2;
      --accent:#6366f1;
      --white:#f8fafc;
      --radius:12px;
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    }
    html,body{height:100%; margin:0;}
    body{
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:48px 20px;
    }
    .container {
      width:420px;
      max-width:95%;
    }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));
      border-radius:18px;
      padding:26px;
      box-shadow: 0 18px 40px rgba(3,7,18,0.5);
      color:var(--white);
    }
    h1{
      text-align:center;
      font-size:24px;
      margin:0 0 18px;
      font-weight:800;
    }
    /* Info panel (top) */
    .info-panel{
      background: rgba(255,255,255,0.04);
      padding:16px;
      border-radius:12px;
      color:var(--white);
      margin-bottom:18px;
      line-height:1.6;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }
    .info-row{ display:flex; gap:8px; align-items:flex-start; margin:6px 0; }
    .info-label{ width:110px; font-weight:700; color:#e6eef9; display:inline-block; }
    .info-value{ color:var(--muted); display:inline-block; }

    /* Form inputs */
    select, input[type="text"]{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:none;
      margin-bottom:12px;
      outline:none;
      background: #ffffff;
      color:#0b1220;
      font-size:14px;
      box-sizing:border-box;
    }
    .save-btn{
      display:block;
      width:100%;
      padding:12px;
      border-radius:10px;
      border:none;
      font-weight:700;
      background: linear-gradient(90deg, var(--accent), #8b5cf6);
      color:white;
      cursor:pointer;
      margin-top:6px;
    }
    .muted-small{ font-size:13px; color:var(--muted); margin-top:8px; text-align:left; }
    .center { text-align:center; }
    @media (max-width:420px){
      body{ padding:24px 12px; }
      .info-label{ width:95px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" role="main" aria-labelledby="title">
      <h1 id="title">Student Academic Details</h1>

      <!-- INFO PANEL: only username, email, contact -->
      <div class="info-panel" id="userPanel" aria-live="polite">
        <div class="info-row"><span class="info-label">Name:</span><span class="info-value" id="displayName">Loading...</span></div>
        <div class="info-row"><span class="info-label">Email:</span><span class="info-value" id="displayEmail">Loading...</span></div>
        <div class="info-row"><span class="info-label">Contact:</span><span class="info-value" id="displayContact">Loading...</span></div>
      </div>

      <!-- Rest of the academic form (layout like your screenshot) -->
      <select id="course">
        <option value="">Select Course</option>
        <option value="BSc">BSc</option>
        <option value="BCom">BCom</option>
        <option value="BA">BA</option>
        <option value="MCA">MCA</option>
      </select>

      <select id="year">
        <option value="">Select Year</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>
      </select>

      <input id="semester" type="text" placeholder="Semester (Auto-filled)" />
      <input id="prevCollege" type="text" placeholder="Previous College Name" />
      <input id="prevResult" type="text" placeholder="Previous College Result (Grade)" />

      <button class="save-btn" id="saveBtn">Save Details</button>
      <p class="muted-small center" id="msg"></p>
    </div>
  </div>

  <script>
  (function(){
    // If your backend runs on another host, set API_BASE to that origin (e.g. 'https://your-api.onrender.com')
    const API_BASE = '';

    function getQueryParam(name) {
      const params = new URLSearchParams(location.search);
      return params.get(name);
    }

    // Prefer query param, fallback to localStorage
    const username = getQueryParam('username') || localStorage.getItem('registered_username') || null;

    const displayName = document.getElementById('displayName');
    const displayEmail = document.getElementById('displayEmail');
    const displayContact = document.getElementById('displayContact');
    const msg = document.getElementById('msg');

    function setMsg(text, color) {
      msg.style.color = color || '#e6eef9';
      msg.innerText = text || '';
    }

    if (!username) {
      // Show dashes if nothing available
      displayName.innerText = '-';
      displayEmail.innerText = '-';
      displayContact.innerText = '-';
      setMsg('No username found. Open this page from registration or append ?username=yourname', '#f97316');
      console.warn('jobdetails: no username provided in query or localStorage');
      return;
    }

    async function loadBasicInfo() {
      try {
        setMsg('Loading user info...');
        const url = (API_BASE ? API_BASE : '') + '/register/' + encodeURIComponent(username);
        const res = await fetch(url, { method: 'GET' });
        if (!res.ok) {
          // fallback to username only
          displayName.innerText = username;
          displayEmail.innerText = '-';
          displayContact.innerText = '-';
          setMsg('Could not fetch details from server. Showing username only.', '#f59e0b');
          console.warn('jobdetails fetch returned', res.status);
          return;
        }
        const data = await res.json();
        displayName.innerText = (data && (data.fullname || data.username)) ? (data.fullname || data.username) : username;
        displayEmail.innerText = data && data.email ? data.email : '-';
        displayContact.innerText = data && data.contact ? data.contact : '-';
        setMsg('');
      } catch (err) {
        console.error('Error loading user details', err);
        displayName.innerText = username;
        displayEmail.innerText = '-';
        displayContact.innerText = '-';
        setMsg('Error contacting server. Check console.', '#ef4444');
      }
    }

    loadBasicInfo();

    // Save details button: minimal client-side behavior (POST to /save-details)
    document.getElementById('saveBtn').addEventListener('click', async function(){
      const course = document.getElementById('course').value;
      const year = document.getElementById('year').value;
      const semester = document.getElementById('semester').value;
      const prevCollege = document.getElementById('prevCollege').value;
      const prevResult = document.getElementById('prevResult').value;

      if (!username) {
        setMsg('Missing username. Cannot save.', '#ef4444');
        return;
      }

      setMsg('Saving details...');
      try {
        const res = await fetch((API_BASE ? API_BASE : '') + '/save-details', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: username,
            email: displayEmail.innerText !== '-' ? displayEmail.innerText : '',
            contact: displayContact.innerText !== '-' ? displayContact.innerText : '',
            course, year, semester, prevCollege, prevResult
          })
        });
        const js = await res.json().catch(()=>({}));
        if (!res.ok) {
          setMsg(js.message || 'Save failed', '#ef4444');
          return;
        }
        setMsg('Academic details saved successfully', '#10b981');
      } catch (e) {
        console.error('Save error', e);
        setMsg('Server error while saving', '#ef4444');
      }
    });

  })();
  </script>
</body>
</html>
