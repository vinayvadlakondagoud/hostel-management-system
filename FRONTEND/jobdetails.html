<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join Our Team – HMS Careers</title>
  <style>
    :root {
      --primary: #4f46e5;
      --accent: #06b6d4;
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --radius: 12px;
      --shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: linear-gradient(to right, var(--primary), var(--accent));
      color: white;
      padding: 60px 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 2.2rem; }
    .container {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 20px;
    }
    .card {
      background: var(--card);
      padding: 30px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text);
    }
    select, input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    select:focus, input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    .salary-box {
      background-color: #f0f4ff;
      border: 1px solid var(--primary);
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-top: 20px;
    }
    .salary-box p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .salary-box h3 {
      margin: 5px 0 0 0;
      font-size: 2rem;
      color: var(--primary);
    }
    .btn-submit {
      display: inline-block;
      width: 100%;
      background-color: var(--accent);
      color: white;
      padding: 15px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 15px;
    }
    .btn-submit:hover {
      background-color: #0e96af;
    }
    #formMsg {
      padding: 10px;
      margin-top: 15px;
      border-radius: 8px;
      font-weight: 600;
      text-align: center;
      display: none; /* Hidden by default */
    }
    #formMsg.success {
      background-color: #d1fae5;
      color: #065f46;
      display: block;
    }
    #formMsg.error {
      background-color: #fee2e2;
      color: #991b1b;
      display: block;
    }
    .user-details-box {
        margin-bottom: 30px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #f7f9fc;
    }
    .user-details-box h2 {
        color: var(--primary);
        margin-top: 0;
    }
    .user-details-box ul {
        list-style: none;
        padding: 0;
        margin-top: 15px;
    }
    .user-details-box li {
        margin-bottom: 8px;
        padding: 5px 0;
        border-bottom: 1px dotted #eee;
    }
    .user-details-box li:last-child {
        border-bottom: none;
    }
    
  </style>
</head>
<body>
  <header>
    <h1>HMS Warden Careers</h1>
    <p>Complete your job application details.</p>
  </header>

  <main class="container">
    <div class="card">
        
        <div id="userDetailsDisplay" class="section user-details-box">
            <h2 id="welcomeHeader">Welcome!</h2>
            <p id="detailsMessage">Fetching your registered details...</p>
            <ul id="detailsList">
                </ul>
        </div>
        <h2>Warden Job Details</h2>

      <form id="jobDetailsForm">

        <div class="form-group">
          <label for="jobRole">Select Job Role</label>
          <select id="jobRole" name="jobRole" required>
            <option value="">-- Choose a role --</option>
            <option value="junior">Junior Warden</option>
            <option value="senior">Senior Warden</option>
            <option value="chief">Chief Warden</option>
          </select>
        </div>

        <div class="form-group">
          <label for="shift">Select Shift</label>
          <select id="shift" name="shift" required>
            <option value="">-- Choose a shift --</option>
            <option value="day">Day Shift</option>
            <option value="evening">Evening Shift</option>
            <option value="night">Night Shift</option>
          </select>
        </div>

        <div class="salary-box">
          <p>Estimated Monthly Salary:</p>
          <h3 id="salaryDisplay">₹0</h3>
        </div>

        <button type="submit" class="btn-submit">Submit Application</button>
        <div id="formMsg"></div>
      </form>
    </div>
  </main>

  <script>
    // Salary data mapping (existing code)
    const salaryData = {
      junior: { day: 10000, evening: 12000, night: 14000 },
      senior: { day: 15000, evening: 18000, night: 20000 },
      chief: { day: 22000, evening: 25000, night: 27000 }
    };

    const roleEl = document.getElementById('jobRole');
    const shiftEl = document.getElementById('shift');
    const salaryDisplay = document.getElementById('salaryDisplay');

    function updateSalary(){
      const r = roleEl.value;
      const s = shiftEl.value;
      if (r && s && salaryData[r] && salaryData[r][s]) salaryDisplay.textContent = '₹' + salaryData[r][s].toLocaleString('en-IN');
      else salaryDisplay.textContent = '₹0';
    }
    roleEl.addEventListener('change', updateSalary);
    shiftEl.addEventListener('change', updateSalary);

    // Helper: get query param (existing code)
    function getQueryParam(name){
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }
    
    // --- START: NEW LOGIC TO FETCH AND DISPLAY WARDEN DETAILS ---

    async function fetchWardenDetails() {
        const username = getQueryParam('username');
        const welcomeHeaderEl = document.getElementById('welcomeHeader');
        const detailsMessageEl = document.getElementById('detailsMessage');
        const detailsListEl = document.getElementById('detailsList');

        if (!username) {
            welcomeHeaderEl.textContent = 'Welcome!';
            detailsMessageEl.textContent = 'Complete the form below to apply for a job.';
            // Optionally hide the list if no username
            document.getElementById('userDetailsDisplay').style.display = 'none'; 
            return;
        }

        // FIX: Changed 'http' to 'https' to resolve Mixed Content error.
const BASE_URL = 'https://hostel-management-system-2-2x8y.onrender.com';
        const fetchUrl = `${BASE_URL}/warden/${encodeURIComponent(username)}`;

        try {
            detailsMessageEl.textContent = `Hello, ${username}. Fetching your details...`;
            const res = await fetch(fetchUrl);
            const data = await res.json();

            if (!res.ok) {
                detailsMessageEl.textContent = `Could not fetch your registered details.`;
                console.error('Server error:', data.message);
                return;
            }

            // Success! Display the details.
            welcomeHeaderEl.textContent = `Welcome, ${data.name || data.fullname}!`;
            detailsMessageEl.textContent = `Successfully retrieved your registered account details.`;

            const details = [
                { label: 'Username', value: data.username },
                { label: 'Full Name', value: data.name || data.fullname },
                { label: 'Email', value: data.email },
                { label: 'Contact No.', value: data.contact }
            ];

            detailsListEl.innerHTML = details.map(item =>
                `<li><strong>${item.label}:</strong> ${item.value}</li>`
            ).join('');

        } catch (error) {
            console.error('Error fetching warden details:', error);
            detailsMessageEl.textContent = 'A network error occurred while fetching your details. Please check the console for errors.';
        }
    }

    // Call the function when the page loads
    fetchWardenDetails();
    
    // --- END: NEW LOGIC ---

    // Form submit (existing code)
    document.getElementById('jobDetailsForm').addEventListener('submit', function(e){
      e.preventDefault();
      const fm = document.getElementById('formMsg');
      fm.className = '';
      const role = roleEl.value, shift = shiftEl.value;
      if (!role || !shift) {
        fm.className = 'error';
        fm.textContent = 'Please select role and shift.';
        return;
      }
      // here you can POST application to server if desired.
      fm.className = 'success';
      fm.textContent = 'Application submitted successfully! Your details will be reviewed.';
      // Simple client-side message, no real submission is happening here.
    });
  </script>
</body>
</html>
