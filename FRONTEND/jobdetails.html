
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join Our Team – HMS Careers</title>
  <style>
    :root {
      --primary: #4f46e5;
      --accent: #06b6d4;
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --radius: 12px;
      --shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: linear-gradient(to right, var(--primary), var(--accent));
      color: white;
      padding: 60px 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 2.2rem; }
    .container {
      max-width: 980px;
      margin: 24px auto;
      background: var(--card);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    label { display:block; margin-top:12px; font-weight:600; }
    select, input { width:100%; padding:10px; margin-top:6px; border-radius:10px; border:1px solid #e5e7eb; }
    .salary-box { margin-top:16px; font-weight:700; font-size:1.1rem; }
    .btn { padding:10px 14px; border-radius:10px; border:none; margin-top:18px; cursor:pointer; }
    .btn-primary { background:var(--primary); color:white; }
    .info-box {
      margin-top:18px;
      padding:14px;
      border-radius:10px;
      border:1px solid #e6eef6;
      background: #fcfeff;
      display:flex;
      gap:12px;
      align-items:center;
    }
    .info-col { flex:1; }
    .muted { color:var(--muted); font-size:0.95rem; }
    .error { color: #ef4444; }
    .success { color: #10b981; }
    footer { text-align:center; margin-top:28px; color:var(--muted); font-size:0.9rem; }
    @media (max-width:720px){ .info-box{flex-direction:column; align-items:flex-start} }
  </style>
</head>
<body>
  <header>
    <h1>Apply as Warden — HMS Careers</h1>
    <p style="margin-top:8px;">We will pre-fill your contact info (username, email, contact) from your account.</p>
  </header>

  <div class="container">
    <form id="jobDetailsForm">
      <label for="jobRole">Job Role As WARDEN</label>
      <select id="jobRole" required>
        <option value="">Select Role</option>
        <option value="frontdesk">Educational Department</option>
        <option value="housekeeping">Maintenance Department</option>
        <option value="cook">Cook / Kitchen Department</option>
      </select>

      <label for="shift">Preferred Shift</label>
      <select id="shift" required>
        <option value="">Select Shift</option>
        <option value="morning">Morning</option>
        <option value="night">Night</option>
      </select>

      <div class="salary-box">Estimated Salary: <span id="salaryDisplay">₹0</span></div>

      <!-- Info section: username, email, contact -->
      <div id="infoContainer" class="info-box" aria-live="polite" style="display:none;">
        <div class="info-col">
          <div><strong>Username:</strong> <span id="infoUsername">—</span></div>
          <div style="margin-top:6px;"><strong>Email:</strong> <span id="infoEmail">—</span></div>
          <div style="margin-top:6px;"><strong>Contact:</strong> <span id="infoContact">—</span></div>
        </div>
        <div style="min-width:160px; text-align:right;">
          <div id="infoStatus" class="muted">Fetched from your account</div>
        </div>
      </div>

      <p id="infoMessage" class="muted" style="margin-top:12px;">If your info isn't pre-filled, make sure you are registered and try again.</p>

      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button id="submitBtn" class="btn btn-primary" type="submit">Confirm & Submit</button>
        <button type="button" class="btn" onclick="location.href='index.html'">Cancel</button>
      </div>

      <p id="formMsg" style="margin-top:10px;"></p>
    </form>
  </div>

  <footer>&copy; 2025 HMS Hostel Careers</footer>

  <script>
    // Salary data
    const salaryData = {
      frontdesk: { morning: 15000, evening: 16000, night: 18000 },
      housekeeping: { morning: 12000, evening: 13000, night: 15000 },
      cook: { morning: 18000, evening: 20000, night: 22000 },
      staff: { morning: 14000, evening: 15000, night: 17000 }
    };

    const roleEl = document.getElementById('jobRole');
    const shiftEl = document.getElementById('shift');
    const salaryDisplay = document.getElementById('salaryDisplay');

    function updateSalary(){
      const r = roleEl.value;
      const s = shiftEl.value;
      if (r && s && salaryData[r] && salaryData[r][s]) salaryDisplay.textContent = '₹' + salaryData[r][s];
      else salaryDisplay.textContent = '₹0';
    }
    roleEl.addEventListener('change', updateSalary);
    shiftEl.addEventListener('change', updateSalary);

    // Helper: get query param
    function getQueryParam(name){
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    // Display info in the info box
    function showInfo({username, email, contact}, sourceLabel){
      if (!username && !email && !contact) return;
      document.getElementById('infoUsername').textContent = username || '—';
      document.getElementById('infoEmail').textContent = email || '—';
      document.getElementById('infoContact').textContent = contact || '—';
      document.getElementById('infoStatus').textContent = sourceLabel || 'Account';
      document.getElementById('infoContainer').style.display = 'flex';
      document.getElementById('infoMessage').style.display = 'none';
    }

    // Try fetch from /warden/:username then fallback to /register/:username
    async function fetchAccountInfo(username){
      const formMsg = document.getElementById('formMsg');
      formMsg.textContent = '';
      if (!username) {
        formMsg.className = 'muted';
        formMsg.textContent = 'No username found in URL or localStorage.';
        return;
      }

      // Try warden endpoint first
      const base = (location.hostname === 'localhost' || location.hostname === '') ? location.origin : location.origin;
      // Using relative path so it works with deployed domain
      try {
        // 1) try warden table endpoint
        let res = await fetch('/warden/' + encodeURIComponent(username), { method: 'GET' });
        if (res.ok) {
          const data = await res.json();
          // expected object: { username, email, contact, fullname? }
          showInfo({ username: data.username, email: data.email, contact: data.contact }, 'Warden table');
          return;
        } else {
          // if 404 or other, continue to fallback
          console.warn('warden fetch not ok', res.status);
        }
      } catch (e) {
        console.warn('warden fetch failed', e);
      }

      // 2) fallback to /register/:username
      try {
        let res2 = await fetch('/register/' + encodeURIComponent(username), { method: 'GET' });
        if (res2.ok) {
          const d2 = await res2.json();
          showInfo({ username: d2.username, email: d2.email, contact: d2.contact }, 'Register table (fallback)');
          return;
        } else {
          console.warn('/register fetch not ok', res2.status);
        }
      } catch (e) {
        console.warn('/register fetch failed', e);
      }

      // nothing found
      const fm = document.getElementById('formMsg');
      fm.className = 'error';
      fm.textContent = 'Could not fetch account info for "' + username + '".';
    }

    // Initialize: try get username from query param or localStorage
    (function init(){
      const qUser = getQueryParam('username');
      const saved = localStorage.getItem('registered_username');
      const username = qUser || saved || '';
      if (username) {
        // show a temporary message
        const fm = document.getElementById('formMsg');
        fm.className = '';
        fm.textContent = 'Fetching account info for ' + username + ' ...';
        fetchAccountInfo(username).then(()=> {
          const fm2 = document.getElementById('formMsg');
          if (fm2.textContent.startsWith('Fetching')) fm2.textContent = '';
        });
      } else {
        // no username: keep info hidden
        document.getElementById('infoMessage').style.display = 'block';
      }
    })();

    // Form submit
    document.getElementById('jobDetailsForm').addEventListener('submit', function(e){
      e.preventDefault();
      const fm = document.getElementById('formMsg');
      fm.className = '';
      const role = roleEl.value, shift = shiftEl.value;
      if (!role || !shift) {
        fm.className = 'error';
        fm.textContent = 'Please select role and shift.';
        return;
      }
      // here you can POST application to server if desired.
      fm.className = 'success';
      fm.textContent = 'Application submitted successfully!';
      // Redirect to login page after success (optional)
      setTimeout(()=> location.href = 'warden-login.html', 800);
    });

  </script>
</body>
</html>
