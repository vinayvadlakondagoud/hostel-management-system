<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Student Academic Details</title>
  <style>
    :root{
      --bg1: #5b21b6;
      --bg2: #7c3aed;
      --card-bg:#0f1724;
      --panel:#23303b;
      --muted:#a8b3bf;
      --accent:#6366f1;
      --white:#ffffff;
      --radius:12px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    }
    html,body{height:100%; margin:0;}
    body{
      background: linear-gradient(135deg,var(--bg1),var(--bg2));
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:40px 20px;
    }
    .card{
      width:420px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.08));
      border-radius:20px;
      padding:28px;
      box-shadow: 0 12px 30px rgba(3,7,18,0.45);
      color:var(--white);
      position:relative;
    }
    h1{ text-align:center; font-size:24px; margin:0 0 18px; font-weight:800; }
    .info-panel{
      background: rgba(255,255,255,0.04);
      padding:16px;
      border-radius:10px;
      color:var(--white);
      margin-bottom:18px;
      line-height:1.6;
    }
    .info-panel strong{ color: #e6eef9; display:inline-block; width:110px; font-weight:700; }
    .field{ margin:6px 0; color:var(--muted); }
    select, input[type="text"]{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:none;
      margin-bottom:12px;
      outline:none;
      background: rgba(255,255,255,0.9);
      color:#0b1220;
      font-size:14px;
    }
    .save-btn{
      display:block;
      width:100%;
      padding:12px;
      border-radius:10px;
      border:none;
      font-weight:700;
      background: linear-gradient(90deg,var(--accent), #8b5cf6);
      color:white;
      cursor:pointer;
      margin-top:6px;
    }
    .muted-small{ font-size:13px; color:var(--muted); margin-top:8px; text-align:left; }
    .notice{ font-size:13px; color:#fbbf24; margin-top:8px; }
    .center { text-align:center; }
  </style>
</head>
<body>
  <div class="card" role="main" aria-labelledby="title">
    <h1 id="title">Student Academic Details</h1>

    <div class="info-panel" id="userPanel" aria-live="polite">
      <div class="field"><strong>Name:</strong> <span id="displayName">Loading...</span></div>
      <div class="field"><strong>Email:</strong> <span id="displayEmail">Loading...</span></div>
      <div class="field"><strong>Contact:</strong> <span id="displayContact">Loading...</span></div>
      <div class="field"><strong>Fees Status:</strong> <span id="displayFees">Loading...</span></div>
    </div>

    <!-- sample form below (same layout as screenshot). User details above -->
    <select id="course">
      <option value="">Select Course</option>
      <option value="BSc">BSc</option>
      <option value="BCom">BCom</option>
      <option value="BA">BA</option>
      <option value="MCA">MCA</option>
    </select>

    <select id="year">
      <option value="">Select Year</option>
      <option value="1">1st Year</option>
      <option value="2">2nd Year</option>
      <option value="3">3rd Year</option>
      <option value="4">4th Year</option>
    </select>

    <input id="semester" type="text" placeholder="Semester (Auto-filled)" />
    <input id="prevCollege" type="text" placeholder="Previous College Name" />
    <input id="prevResult" type="text" placeholder="Previous College Result (Grade)" />

    <button class="save-btn" id="saveBtn">Save Details</button>
    <p class="muted-small center" id="msg"></p>
  </div>

<script>
  (function(){
    // If your API is on another host change API_BASE accordingly.
    const API_BASE = 'https://hostel-management-system-2-2x8y.onrender.com';

    function getQueryParam(name) {
      const params = new URLSearchParams(location.search);
      return params.get(name);
    }

    function setMessage(text, color) {
      const el = document.getElementById('msg');
      el.style.color = color || '#e6eef9';
      el.innerText = text || '';
    }

    const displayName = document.getElementById('displayName');
    const displayEmail = document.getElementById('displayEmail');
    const displayContact = document.getElementById('displayContact');
    const displayFees = document.getElementById('displayFees');

    // Try query param first, then localStorage fallback
    let username = getQueryParam('username') || localStorage.getItem('registered_username') || null;

    if (!username) {
      // If no username available, show a hint and stop
      displayName.innerText = '—';
      displayEmail.innerText = '—';
      displayContact.innerText = '—';
      displayFees.innerText = 'Unknown';
      setMessage('No username provided. Please open this page from the registration flow or attach ?username=YOURUSERNAME', '#f97316');
      console.warn('jobdetails: no username provided in query or localStorage');
      return;
    }

    // fetch user details
    async function loadUser() {
      try {
        setMessage('Fetching user details...');
        const url = API_BASE + '/register/' + encodeURIComponent(username);
        const res = await fetch(url, { method: 'GET' });
        if (!res.ok) {
          throw new Error('Failed to fetch user: ' + (res.status || 'unknown'));
        }
        const data = await res.json();
        // server returns { username, gender, email, contact } (or undefined fields)
        displayName.innerText = data && (data.fullname || data.username) ? (data.fullname || data.username) : (data.username || username);
        displayEmail.innerText = data && data.email ? data.email : '—';
        displayContact.innerText = data && data.contact ? data.contact : '—';

        // fetch fees status separately (if you use /payment-status endpoint)
        try {
          const feesRes = await fetch(API_BASE + '/payment-status/' + encodeURIComponent(username));
          if (feesRes.ok) {
            const feesJson = await feesRes.json();
            displayFees.innerText = feesJson && feesJson.status ? feesJson.status : 'Unknown';
          } else {
            displayFees.innerText = 'Unknown';
          }
        } catch(e) {
          displayFees.innerText = 'Unknown';
        }

        setMessage('', '');
      } catch (err) {
        console.error('Error loading user details', err);
        displayName.innerText = username;
        displayEmail.innerText = '—';
        displayContact.innerText = '—';
        displayFees.innerText = 'Unknown';
        setMessage('Could not load user details. Check console / API base URL.', '#ef4444');
      }
    }

    loadUser();

    // Save details button logic: sends to /save-details (server has POST /save-details)
    document.getElementById('saveBtn').addEventListener('click', async function(){
      const course = document.getElementById('course').value;
      const year = document.getElementById('year').value;
      const semester = document.getElementById('semester').value;
      const prevCollege = document.getElementById('prevCollege').value;
      const prevResult = document.getElementById('prevResult').value;

      if (!username || !displayEmail.innerText || displayEmail.innerText === '—') {
        setMessage('Missing username/email. Cannot save.', '#ef4444');
        return;
      }

      setMessage('Saving details...');
      try {
        const res = await fetch(API_BASE + '/save-details', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            username: username,
            email: displayEmail.innerText,
            contact: displayContact.innerText !== '—' ? displayContact.innerText : '',
            course, year, semester, prevCollege, prevResult
          })
        });
        const j = await res.json().catch(()=>({}));
        if (!res.ok) {
          setMessage(j.message || 'Save failed', '#ef4444');
          return;
        }
        setMessage('Academic details saved successfully', '#10b981');
      } catch(e) {
        console.error('Save error', e);
        setMessage('Server error while saving', '#ef4444');
      }
    });

  })();
</script>
</body>
</html>
