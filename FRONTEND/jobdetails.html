<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join Our Team – HMS Careers</title>
  <style>
    :root {
      --primary: #4f46e5;
      --accent: #06b6d4;
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --radius: 12px;
      --shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: linear-gradient(to right, var(--primary), var(--accent));
      color: white;
      padding: 60px 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 2.2rem; }
    .container {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 20px;
    }
    .job-details-card {
      background: var(--card);
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    h2 {
      color: var(--primary);
      margin-top: 0;
      font-size: 1.8rem;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text);
    }
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    select:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    select:disabled, option:disabled {
        background-color: #f3f4f6;
        color: var(--muted);
        cursor: not-allowed;
    }
    button {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    button:hover:not(:disabled) {
      background-color: #4338ca;
    }
    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    .message {
      padding: 12px;
      margin-top: 20px;
      border-radius: 8px;
      font-weight: 600;
      text-align: center;
    }
    .success {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
    }
    .error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #ef4444;
    }
    .loading-spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid var(--primary);
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        margin: 0 auto 10px;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <h1>Warden Job Assignment</h1>
    <p>Please select the role and shift you wish to apply for.</p>
  </header>

  <div class="container">
    <div class="job-details-card">
      <h2>Apply for a Warden Position</h2>
      <div id="loading" class="loading-spinner"></div>
      <form id="jobDetailsForm">
        <div class="form-group">
          <label for="role">Job Role</label>
          <select id="role" name="role" required disabled>
            <option value="">Loading Roles...</option>
            </select>
        </div>
        
        <div class="form-group">
          <label for="shift">Shift</label>
          <select id="shift" name="shift" required disabled>
            <option value="">Select Shift</option>
            </select>
        </div>

        <button type="submit" id="submitBtn" disabled>Apply Now</button>
      </form>
      <div id="formMsg" class="message" style="display: none;"></div>
    </div>
  </div>

<script>
    const roleEl = document.getElementById('role');
    const shiftEl = document.getElementById('shift');
    const submitBtn = document.getElementById('submitBtn');
    const loadingEl = document.getElementById('loading');
    let currentJobStatus = {};
    const baseUrl = 'https://hostel-management-system-2-2x8y.onrender.com';

    // Job capacity based on requirements (1, 2, 3) - kept in sync with server.js
    const MAX_CAPACITY = {
        'Education Staff': { 'Day Shift': 1, 'Night Shift': 1 },
        'Maintenance Staff': { 'Day Shift': 1, 'Night Shift': 1 },
        'Kitchen Staff': { 'Day Shift': 1, 'Night Shift': 0 },
    };

    // Valid roles and shifts
    const ROLES_AND_SHIFTS = {
        'Education Staff': ['Day Shift', 'Night Shift'],
        'Maintenance Staff': ['Day Shift', 'Night Shift'],
        'Kitchen Staff': ['Day Shift'],
    };

    // Helper to get count from status object
    function getSlotCount(role, shift) {
        return (currentJobStatus[role] && currentJobStatus[role][shift]) || 0;
    }

    // Helper to check if a specific slot is full (Req 4, 5 enforcement logic)
    function isSlotFull(role, shift) {
        const max = (MAX_CAPACITY[role] && MAX_CAPACITY[role][shift]) || 0;
        return getSlotCount(role, shift) >= max;
    }

    // Helper to extract username from URL query parameters
    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      // Also check localStorage as a fallback from the registration page
      return urlParams.get(name) || localStorage.getItem('registered_username');
    }

    // Fetches job status and updates the Role dropdown
    async function fetchAndRenderJobOptions() {
        loadingEl.style.display = 'block';
        submitBtn.disabled = true;
        roleEl.disabled = true;
        
        try {
            const response = await fetch(`${baseUrl}/job-status`);
            if (!response.ok) throw new Error('Failed to fetch job status');
            currentJobStatus = await response.json();
        } catch (error) {
            console.error('Error fetching job status:', error);
            document.getElementById('formMsg').style.display = 'block';
            document.getElementById('formMsg').className = 'error';
            document.getElementById('formMsg').textContent = 'Could not load job availability. Please try again later.';
            loadingEl.style.display = 'none';
            return;
        }

        // --- Update Role Options ---
        roleEl.innerHTML = '<option value="">Select Role</option>';
        
        Object.keys(ROLES_AND_SHIFTS).forEach(role => {
            const option = document.createElement('option');
            option.value = role;
            option.textContent = role;
            option.disabled = false;
            
            let isRoleAvailable = false;
            ROLES_AND_SHIFTS[role].forEach(shift => {
                if (!isSlotFull(role, shift)) {
                    isRoleAvailable = true;
                }
            });
            
            // Req 6: Kitchen Staff special rule: if the one slot is taken, disable the entire role option.
            const isKitchenFullyFull = role === 'Kitchen Staff' && isSlotFull('Kitchen Staff', 'Day Shift');
            
            // Disable the role if it's the Kitchen Staff special case OR if all its shifts are full
            if (isKitchenFullyFull || !isRoleAvailable) {
                option.disabled = true;
                option.textContent += ` (Full)`;
            }

            roleEl.appendChild(option);
        });
        
        roleEl.disabled = false;
        loadingEl.style.display = 'none';
        submitBtn.disabled = !roleEl.value || !shiftEl.value; // Re-check submission state

        // Initial call to set up the shift dropdown
        updateShiftOptions(roleEl.value);
    }

    // Updates the Shift dropdown based on the selected Role
    function updateShiftOptions(selectedRole) {
        shiftEl.innerHTML = '<option value="">Select Shift</option>';
        
        if (!selectedRole || !ROLES_AND_SHIFTS[selectedRole]) {
            shiftEl.disabled = true;
            return;
        }
        
        shiftEl.disabled = false;

        ROLES_AND_SHIFTS[selectedRole].forEach(shift => {
            const option = document.createElement('option');
            option.value = shift;
            option.textContent = shift;
            
            // Req 4 & 5 logic: disable individual shift if slot is full
            if (isSlotFull(selectedRole, shift)) {
                option.disabled = true;
                option.textContent += ' (Full)';
            }

            shiftEl.appendChild(option);
        });
        
        submitBtn.disabled = !selectedRole || !shiftEl.value;
    }

    // Event listener for Role change
    roleEl.addEventListener('change', (e) => {
        updateShiftOptions(e.target.value); 
    });
    
    // Event listener for Shift change
    shiftEl.addEventListener('change', () => {
        submitBtn.disabled = !roleEl.value || !shiftEl.value;
    });

    // Form submission logic
    document.getElementById('jobDetailsForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const fm = document.getElementById('formMsg');
      fm.style.display = 'none';
      fm.className = '';
      submitBtn.disabled = true;

      const role = roleEl.value;
      const shift = shiftEl.value;
      const username = getQueryParam('username');

      if (!role || !shift) {
        fm.style.display = 'block';
        fm.className = 'error';
        fm.textContent = 'Please select role and shift.';
        submitBtn.disabled = false;
        return;
      }

      if (!username) {
        fm.style.display = 'block';
        fm.className = 'error';
        fm.textContent = 'Username missing. Please register or login again.';
        submitBtn.disabled = false;
        return;
      }

      try {
        const res = await fetch(`${baseUrl}/apply-job`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username,
            job_role: role,
            shift
          })
        });

        const data = await res.json();
        fm.style.display = 'block';

        if (!res.ok) {
          fm.className = 'error';
          fm.textContent = data.message || "Error submitting application";
          // Re-enable button but keep options disabled if full
          submitBtn.disabled = false; 
          
          // Re-render the options just in case another user took the slot right before this submission
          fetchAndRenderJobOptions(); 
          
          return;
        }

        // SUCCESS BLOCK MODIFICATION: Redirect to warden-login.html
        fm.className = 'success';
        fm.textContent = "Application submitted successfully! Redirecting to login...";
        
        // Clear the temporary username storage
        localStorage.removeItem('registered_username');
        
        // Redirect the user to the login page after a delay
        setTimeout(() => {
            window.location.href = 'warden-login.html';
        }, 1500);

      } catch(err) {
        console.error('Fetch error:', err);
        fm.style.display = 'block';
        fm.className = 'error';
        fm.textContent = 'A network error occurred. Please try again.';
        submitBtn.disabled = false;
      }
    });

    // Initial load: fetches status and populates/disables options
    fetchAndRenderJobOptions();
  </script>
</body>
</html>
