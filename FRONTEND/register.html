<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Hostel Management</title>
  <link href="register.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Minimal inline tweaks if register.css missing */
    body { font-family: Inter, system-ui, Arial; background:#f3f4f6; margin:0; padding:0; }
    .navbar { background:#0f172a; color:#fff; padding:1rem; }
    .container { max-width:980px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; }
    .logo { font-weight:700; }
    .main-container { display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 140px); padding:2rem; }
    .register-card { background:#fff; padding:2rem; border-radius:12px; box-shadow:0 6px 24px rgba(0,0,0,0.08); width:100%; max-width:480px; }
    .register-card h1 { margin:0 0 1rem 0; font-size:1.5rem; }
    input, select, button { width:100%; padding:0.75rem 0.9rem; margin:0.45rem 0; border:1px solid #e5e7eb; border-radius:8px; box-sizing:border-box; }
    .input-group { position:relative; }
    .toggle-eye { position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; opacity:0.7; }
    .msg { color:#dc2626; min-height:1.25rem; margin-top:0.5rem; }
    .footer { text-align:center; padding:1rem; color:#6b7280; }
    button.primary { background:#2563eb; color:white; border:none; cursor:pointer; }
    button.secondary { background:#ef4444; color:white; border:none; cursor:pointer; }
  </style>
</head>
<body>

  <!-- Header / Navbar -->
  <header class="navbar">
    <div class="container">
      <span class="logo">HOSTEL MANAGEMENT</span>
      <a href="index.html" class="home-btn" title="Home" style="color:inherit;">
        <i class="fas fa-home"></i>
      </a>
    </div>
  </header>

  <!-- Main -->
  <main class="main-container">
    <div class="register-card">
      <h1>Create Account</h1>
      
      <form id="registerForm" novalidate>

        <input type="text" name="username" placeholder="Full Name" required autocomplete="name">

        <!-- Password field with eye icon -->
        <div class="input-group">
          <input type="password" name="password" placeholder="Password"
            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#])[A-Za-z\d@$!%*?&#]{8,}$"
            title="Password must be at least 8 characters with uppercase, lowercase, number and special character"
            required autocomplete="new-password">
          <i class="fas fa-eye toggle-eye" id="togglePassword" title="Show/Hide password"></i>
        </div>

        <!-- Confirm Password field with eye icon -->
        <div class="input-group">
          <input type="password" name="confirmPassword" placeholder="Confirm Password" required autocomplete="new-password">
          <i class="fas fa-eye toggle-eye" id="toggleConfirmPassword" title="Show/Hide password"></i>
        </div>
        
        <select name="gender" required>
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>

        <input type="email" name="email" placeholder="Email" required autocomplete="email">

        <!-- Contact: only digits allowed, exact 10 digits -->
        <input type="tel" inputmode="numeric" pattern="^\d{10}$" name="contact" placeholder="Contact Number (10 digits)"
          title="Contact number must be exactly 10 digits and only numbers are allowed"
          maxlength="10" required>

        <button type="button" id="sendOtpButton" class="primary">Send OTP</button>

        <div id="otp-section" style="display: none;">
          <input type="text" name="otp" id="otpInput" placeholder="Enter OTP (6 digits)" 
            pattern="^\d{6}$" 
            title="OTP must be 6 digits"
            maxlength="6"
            required>
          <button type="button" id="verifyOtpButton" class="primary">Verify OTP & Register</button> 
        </div>

        <button type="submit" style="display: none;">Register</button>
      </form>

      <p id="msg" class="msg"></p>
      <p>Already have an account? 
        <a href="login.html" class="login-link">Login</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    &copy; 2024 Hostel Management System
  </footer>

  <script>
    // Password show/hide
    const togglePassword = document.getElementById("togglePassword");
    const passwordField = document.querySelector("input[name='password']");
    togglePassword.addEventListener("click", () => {
        const type = passwordField.type === "password" ? "text" : "password";
        passwordField.type = type;
        togglePassword.classList.toggle("fa-eye-slash");
    });

    const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");
    const confirmPasswordField = document.querySelector("input[name='confirmPassword']");
    toggleConfirmPassword.addEventListener("click", () => {
        const type = confirmPasswordField.type === "password" ? "text" : "password";
        confirmPasswordField.type = type;
        toggleConfirmPassword.classList.toggle("fa-eye-slash");
    });

    // Elements
    const form = document.getElementById("registerForm");
    const sendOtpButton = document.getElementById("sendOtpButton");
    const verifyOtpButton = document.getElementById("verifyOtpButton");
    const registerSubmitButton = document.querySelector('button[type="submit"]');
    const msgEl = document.getElementById("msg");
    const otpSection = document.getElementById("otp-section");

    // Hide default register submit (we use OTP verify to finalize)
    if (registerSubmitButton) registerSubmitButton.style.display = 'none';

    // Regexes (same as HTML pattern)
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#])[A-Za-z\d@$!%*?&#]{8,}$/;
    const contactRegex = /^\d{10}$/;

    // Prevent non-digit input in contact field & enforce maxlength
    const contactInput = document.querySelector("input[name='contact']");
    contactInput.addEventListener("input", (e) => {
      // remove any non-digit chars
      const cleaned = e.target.value.replace(/\D/g, '');
      if (cleaned !== e.target.value) {
        e.target.value = cleaned;
      }
    });

    // --- Send OTP Click Handler ---
    sendOtpButton.addEventListener("click", async function(e) {
        e.preventDefault();
        msgEl.style.color = '#dc2626'; // default red for errors

        // Basic required checks
        if (!form.username.value || !form.email.value || !form.password.value || !form.confirmPassword.value || !form.contact.value) {
            msgEl.innerText = "❌ Sab fields fill karo pehle (All required fields must be filled).";
            return;
        }

        // Username simple validation
        const username = form.username.value.trim();
        if (username.length < 3 || !/^[A-Za-z0-9_.-]+$/.test(username)) {
          msgEl.innerText = "❌ Username must be at least 3 characters and contain only letters, numbers, . _ -";
          form.username.focus();
          return;
        }

        // Password match check
        if (form.password.value !== form.confirmPassword.value) {
            msgEl.innerText = "❌ Passwords do not match!";
            confirmPasswordField.focus();
            return;
        }

        // Password complexity check (JS)
        if (!passwordRegex.test(form.password.value)) {
            msgEl.innerText = "❌ Password must be at least 8 characters and include uppercase, lowercase, number and special character.";
            passwordField.focus();
            return;
        }

        // Contact validation (only digits and length)
        if (!contactRegex.test(form.contact.value)) {
            msgEl.innerText = "❌ Contact must be exactly 10 digits (numbers only).";
            contactInput.focus();
            return;
        }

        // All client-side checks passed
        const verificationEmail = form.email.value;
        msgEl.style.color = '#0f5132';
        msgEl.innerText = "⏳ Sending OTP...";
        sendOtpButton.disabled = true;

        try {
          const res = await fetch("https://hostel-management-system-2-2x8y.onrender.com/send-otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
              email: verificationEmail,
              username: username,
              contact: form.contact.value
            })
          });

          const data = await res.json();

          if (res.ok) {
            msgEl.style.color = '#166534';
            msgEl.innerText = "✅ OTP sent to " + verificationEmail + ". Check your inbox!";
            otpSection.style.display = 'block';
            sendOtpButton.style.display = 'none';
          } else if (res.status === 409) {
            msgEl.style.color = '#dc2626';
            msgEl.innerText = "❌ " + (data.message || 'Username or Email already taken.');
            if ((data.message || '').toLowerCase().includes('username')) {
              form.username.style.border = '2px solid #ef4444';
              form.username.focus();
            }
            sendOtpButton.disabled = false;
          } else {
            msgEl.style.color = '#dc2626';
            msgEl.innerText = "❌ Error: " + (data.message || 'Failed to send OTP');
            sendOtpButton.disabled = false;
          }

        } catch (err) {
          console.error('Send OTP error:', err);
          msgEl.style.color = '#dc2626';
          msgEl.innerText = "❌ Server error or email service failed.";
          sendOtpButton.disabled = false;
        }
    });

    // --- Verify OTP & Register Click Handler ---
    verifyOtpButton.addEventListener("click", async function(e) {
        e.preventDefault();
        const otp = document.getElementById("otpInput").value.trim();

        if (!otp || otp.length !== 6 || !/^\d{6}$/.test(otp)) {
            msgEl.style.color = '#dc2626';
            msgEl.innerText = "❌ Please enter a valid 6-digit OTP.";
            return;
        }

        msgEl.style.color = '#0f5132';
        msgEl.innerText = "⏳ Verifying OTP and Registering...";
        verifyOtpButton.disabled = true;

        const formData = {
            username: form.username.value.trim(),
            email: form.email.value.trim(),
            password: form.password.value,
            gender: form.gender.value,
            contact: form.contact.value,
            otp: otp 
        };

        try {
            const res = await fetch("https://hostel-management-system-2-2x8y.onrender.com/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
            });

            const data = await res.json();
            if (res.ok) {
                msgEl.style.color = '#166534';
                msgEl.innerText = data.message || "✅ Registration successful! Redirecting...";
                // store minimal user data then redirect
                localStorage.setItem("userData", JSON.stringify({
                    username: formData.username,
                    email: formData.email,
                    contact: formData.contact
                }));
                setTimeout(() => window.location.href = "details.html", 1400);
            } else {
                msgEl.style.color = '#dc2626';
                msgEl.innerText = data.message || "❌ Registration failed. Try again.";
                verifyOtpButton.disabled = false;
            }

        } catch (err) {
            console.error('Registration error:', err);
            msgEl.style.color = '#dc2626';
            msgEl.innerText = "❌ Server error during registration!";
            verifyOtpButton.disabled = false;
        }
    });

    // Optional: prevent form submit via Enter from triggering unwanted behavior
    form.addEventListener('submit', (e) => {
      e.preventDefault();
    });
  </script>
</body>
</html>
