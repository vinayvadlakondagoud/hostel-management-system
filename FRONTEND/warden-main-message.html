<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Warden Messages - Maintenance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="max-w-6xl mx-auto py-6 px-4">
    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">Warden Messages - Maintenance</h1>
        <p class="text-xs text-slate-500">Chat with Students and Admin</p>
      </div>
      <a href="warden-maintenance.html" class="text-sm text-blue-600 hover:underline">← Back to Warden Dashboard</a>
    </header>

    <!-- Send Message -->
    <section class="bg-white shadow rounded-xl p-4 mb-6">
      <h2 class="text-lg font-semibold mb-3 text-slate-800">Send Message</h2>

      <div class="grid gap-3 md:grid-cols-3 mb-3">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Send To</label>
          <select id="wardenRecipientType"
                  class="w-full border rounded-lg px-3 py-2 text-sm">
            <option value="">Select recipient</option>
            <option value="user">User (Student)</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div id="wardenUserSelectWrapper" class="hidden md:col-span-2">
          <label class="block text-sm font-medium text-slate-600 mb-1">Select User</label>
          <select id="wardenUserSelect"
                  class="w-full border rounded-lg px-3 py-2 text-sm">
            <option value="">Loading...</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Message</label>
        <textarea id="wardenMessageInput"
                  rows="3"
                  class="w-full border rounded-lg px-3 py-2 text-sm"
                  placeholder="Type your message here..."></textarea>
      </div>

      <div class="mt-3 flex justify-end">
        <button id="wardenSendBtn"
                class="px-4 py-2 text-sm rounded-lg bg-blue-600 text-white">
          Send
        </button>
      </div>
      <p id="wardenMsgStatus" class="text-xs mt-2 text-slate-500"></p>
    </section>

    <!-- History -->
    <section class="bg-white shadow rounded-xl p-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-semibold text-slate-800">Conversation History</h2>
        <div class="flex items-center gap-2">
          <div class="space-x-1">
            <button id="tabWardenInbox" class="px-3 py-1 border rounded bg-white text-sm">Inbox</button>
            <button id="tabWardenSent"  class="px-3 py-1 border rounded text-sm">Sent</button>
          </div>
          <button id="refreshBtn" class="text-xs px-3 py-1 border rounded">
            Refresh
          </button>
        </div>
      </div>

      <div id="wardenMessagesList" class="space-y-3 max-h-[500px] overflow-y-auto text-sm"></div>
    </section>
  </div>

<script>
const API = "https://hostel-management-system-2-2x8y.onrender.com";
const WARDEN_ROLE = "maintenance";

const wardenUsername = localStorage.getItem("username");

if (!wardenUsername) {
  alert("Please login as Warden first.");
  window.location.href = "warden-login.html";
}

const wardenRecipientType = document.getElementById("wardenRecipientType");
const wardenUserSelectWrapper = document.getElementById("wardenUserSelectWrapper");
const wardenUserSelect = document.getElementById("wardenUserSelect");
const wardenMessageInput = document.getElementById("wardenMessageInput");
const wardenSendBtn = document.getElementById("wardenSendBtn");
const wardenMsgStatus = document.getElementById("wardenMsgStatus");
const wardenMessagesList = document.getElementById("wardenMessagesList");

const wardenRefreshBtn = document.getElementById("refreshBtn");

let currentTab = "inbox";   // ✅ same as admin
let allMessages = [];       // ✅ store messages

// ===== REFRESH =====
wardenRefreshBtn.addEventListener("click", async () => {
  wardenRefreshBtn.textContent = "Refreshing...";
  await loadWardenMessages();
  wardenRefreshBtn.textContent = "Refresh";
});

// ===== TABS =====
document.getElementById("tabWardenInbox").onclick = () => {
  currentTab = "inbox";
  renderWardenMessages(allMessages);
};

document.getElementById("tabWardenSent").onclick = () => {
  currentTab = "sent";
  renderWardenMessages(allMessages);
};

// ===== USER DROPDOWN =====
wardenRecipientType.addEventListener("change", () => {
  const v = wardenRecipientType.value;
  if (v === "user") {
    wardenUserSelectWrapper.classList.remove("hidden");
    loadUsersForWarden();
  } else {
    wardenUserSelectWrapper.classList.add("hidden");
  }
});

async function loadUsersForWarden() {
  try {
    const res = await fetch(API + "/users");
    const data = await res.json();
    wardenUserSelect.innerHTML = '<option value="">Select user</option>';
    data.forEach(u => {
      const opt = document.createElement("option");
      opt.value = u.username;
      opt.textContent = u.username;
      wardenUserSelect.appendChild(opt);
    });
  } catch (err) {
    console.error(err);
  }
}

// ===== SEND =====
wardenSendBtn.addEventListener("click", async () => {
  const content = wardenMessageInput.value.trim();

  let rec = null;

  if (wardenRecipientType.value === "admin") {
    rec = { role: "admin" };
  } else if (wardenRecipientType.value === "user") {
    if (!wardenUserSelect.value) return alert("Select user");
    rec = { role: "user", username: wardenUserSelect.value };
  } else {
    return alert("Select recipient");
  }

  await fetch(API + "/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      sender_role: "warden",
      sender_username: wardenUsername,
      sender_warden_role: WARDEN_ROLE,
      recipient_role: rec.role,
      recipient_username: rec.username || null,
      recipient_warden_role: null,
      content
    })
  });

  wardenMessageInput.value = "";
  loadWardenMessages();
});

// ===== LABEL =====
function labelFromRole(role, wardenRole, username) {
  if (role === "admin") return "Admin";
  if (role === "user") return username;
  if (role === "warden") return "Warden - " + wardenRole;
  return username;
}

// ===== RENDER (ADMIN STYLE) =====
function renderWardenMessages(list) {
  list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  
  const inboxList = [];
  const sentList = [];

  list.forEach(msg => {
    if (msg.sender_role === "warden" && msg.sender_username === wardenUsername) {
      sentList.push(msg);
    }

    if (msg.sender_role !== "warden") {
      inboxList.push(msg);
    }
  });

  const dataToRender = currentTab === "inbox" ? inboxList : sentList;

  wardenMessagesList.innerHTML = "";

  if (dataToRender.length === 0) {
    wardenMessagesList.innerHTML = `
      <p class="text-slate-500">
        ${currentTab === "inbox" ? "No inbox messages yet." : "No sent messages yet."}
      </p>`;
    return;
  }

  dataToRender.forEach(msg => {
    const div = document.createElement("div");
    div.className = "p-3 border rounded-lg bg-slate-50";

    div.innerHTML = `
      <div class="text-xs text-slate-500 mb-1">
        <strong>${labelFromRole(msg.sender_role, msg.sender_warden_role, msg.sender_username)}</strong>
        →
        <strong>${labelFromRole(msg.recipient_role, msg.recipient_warden_role, msg.recipient_username)}</strong>
      </div>
      <div class="text-sm">${msg.content}</div>
      <div class="text-[10px] text-slate-400 mt-1">
        ${new Date(msg.created_at).toLocaleString()}
      </div>
    `;

    wardenMessagesList.appendChild(div);
  });
}

// ===== LOAD =====
async function loadWardenMessages() {
  const res = await fetch(
    `${API}/messages?viewer_role=warden&warden_role=${WARDEN_ROLE}&viewer_username=${wardenUsername}`
  );
  const data = await res.json();

  allMessages = data;
  renderWardenMessages(data);
}

// ===== INIT =====
window.addEventListener("DOMContentLoaded", () => {
  currentTab = "inbox";
  loadWardenMessages();
});
</script>
</body>
</html>
