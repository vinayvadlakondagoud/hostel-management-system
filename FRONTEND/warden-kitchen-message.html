<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Warden (Kitchen) Messages</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{background:#f7fafc}</style>
</head>
<body class="p-6">
  <div class="max-w-4xl mx-auto">
    <header class="mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Warden (Kitchen) Messages</h1>
      <p class="text-sm text-slate-500">Inbox & Sent</p>
    </header>

    <div class="bg-white shadow rounded-xl p-4">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-3">
          <div class="rounded-full bg-gradient-to-r from-indigo-500 to-blue-400 p-0.5">
            <div class="bg-white rounded-full px-2 py-1 text-xs font-semibold">Messages</div>
          </div>
          <div>
            <h2 class="text-lg font-semibold text-slate-800">Inbox & Sent</h2>
            <p class="text-xs text-slate-500">Warden kitchen messages</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <div class="flex bg-slate-50 rounded-xl shadow-sm divide-x border border-slate-100 overflow-hidden">
            <button id="tabInbox" class="px-4 py-2 text-sm font-medium focus:outline-none">Inbox</button>
            <button id="tabSent" class="px-4 py-2 text-sm text-slate-500 focus:outline-none">Sent</button>
          </div>
          <button id="refreshBtn" class="text-xs px-3 py-1 rounded-lg border border-slate-300 hover:bg-slate-50">
            Refresh
          </button>
        </div>
      </div>

      <div id="inboxContainer" class="space-y-3 max-h-[480px] overflow-y-auto transition-all duration-300"></div>
      <div id="sentContainer" class="hidden space-y-3 max-h-[480px] overflow-y-auto transition-all duration-300"></div>
    </div>

    <section class="mt-6 bg-white p-4 rounded-lg shadow">
      <h3 class="text-sm font-semibold mb-2">Send message</h3>
      <div class="space-y-2">
        <input id="recipientUsername" placeholder="Recipient username (optional)" class="w-full p-2 border rounded" />
        <textarea id="messageContent" rows="4" placeholder="Type your message..." class="w-full p-2 border rounded"></textarea>
        <div class="flex justify-end">
          <button id="sendBtn" class="px-4 py-2 bg-blue-600 text-white rounded">Send</button>
        </div>
      </div>
    </section>
  </div>

<script>
const API = (typeof API !== "undefined") ? API : "https://hostel-management-system-1-3c10.onrender.com";
const VIEWER_ROLE = "warden";
const VIEWER_USERNAME = (typeof wardenUsername !== "undefined") ? wardenUsername : (localStorage.getItem("warden") || "warden_kitchen");
const WARDEN_ROLE = (typeof WARDEN_ROLE !== "undefined") ? WARDEN_ROLE : "kitchen";

const tabInbox = document.getElementById("tabInbox");
const tabSent  = document.getElementById("tabSent");
const inboxContainer = document.getElementById("inboxContainer");
const sentContainer  = document.getElementById("sentContainer");
const refreshBtn = document.getElementById("refreshBtn");

function activateTab(t) {
  if (t === "inbox") {
    tabInbox.classList.add("text-slate-900","bg-white","shadow-sm");
    tabInbox.classList.remove("text-slate-500");
    tabSent.classList.remove("text-slate-900","bg-white","shadow-sm");
    tabSent.classList.add("text-slate-500");
    inboxContainer.classList.remove("hidden");
    sentContainer.classList.add("hidden");
  } else {
    tabSent.classList.add("text-slate-900","bg-white","shadow-sm");
    tabSent.classList.remove("text-slate-500");
    tabInbox.classList.remove("text-slate-900","bg-white","shadow-sm");
    tabInbox.classList.add("text-slate-500");
    sentContainer.classList.remove("hidden");
    inboxContainer.classList.add("hidden");
  }
}
tabInbox.addEventListener("click", ()=>activateTab("inbox"));
tabSent.addEventListener("click", ()=>activateTab("sent"));
refreshBtn.addEventListener("click", loadTabbedMessages);

function createMessageCard(m) {
  const d = document.createElement("div");
  d.className = "border rounded-lg px-4 py-3 flex justify-between items-start gap-4 hover:shadow-md transition-shadow duration-200 bg-white";
  const sender = m.sender_role === "warden" ? (m.sender_warden_role ? `Warden - ${m.sender_warden_role}` : "Warden") : (m.sender_role === "admin" ? "Admin" : (m.sender_username || "User"));
  const recipient = m.recipient_role === "warden" ? (m.recipient_warden_role ? `Warden - ${m.recipient_warden_role}` : "Warden") : (m.recipient_role === "admin" ? "Admin" : (m.recipient_username || "User"));
  const ts = m.created_at ? new Date(m.created_at) : new Date();
  d.innerHTML = `
    <div class="flex-1">
      <div class="flex items-center justify-between gap-3">
        <div class="text-sm font-semibold text-slate-800">${sender} <span class="text-xs text-slate-400">→ ${recipient}</span></div>
        <div class="text-xs text-slate-400">${ts.toLocaleString()}</div>
      </div>
      <div class="mt-2 text-slate-700 text-sm">${(m.content||"").replace(/\\n/g,"<br>")}</div>
    </div>
  `;
  return d;
}

function skeletonList(n){
  let s = "";
  for (let i=0;i<n;i++){
    s += `<div class="animate-pulse border rounded-lg p-4 bg-white"><div class="h-3 w-1/3 bg-slate-200 rounded mb-2"></div><div class="h-3 w-3/4 bg-slate-200 rounded"></div></div>`;
  }
  return s;
}
function emptyState(text){
  return `<div class="text-center py-8 text-slate-400">
    <div class="mb-3 text-3xl">✉️</div>
    <div class="font-semibold mb-1">${text}</div>
    <div class="text-xs">Send or receive messages to get started.</div>
  </div>`;
}

async function loadTabbedMessages(){
  inboxContainer.innerHTML = skeletonList(3);
  sentContainer.innerHTML  = skeletonList(2);
  try {
    const url = `${API}/messages?viewer_role=${encodeURIComponent(VIEWER_ROLE)}&viewer_username=${encodeURIComponent(VIEWER_USERNAME)}&warden_role=${encodeURIComponent(WARDEN_ROLE)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("Network response not ok");
    const all = await res.json();
    const inbox = all.filter(m => m && ((m.recipient_role === "warden" && (m.recipient_warden_role === WARDEN_ROLE || !m.recipient_warden_role)) || (m.recipient_role === "admin" && m.recipient_username === VIEWER_USERNAME)));
    const sent = all.filter(m => m && m.sender_role === "warden" && (m.sender_warden_role === WARDEN_ROLE || !m.sender_warden_role));

    if (inbox.length === 0) inboxContainer.innerHTML = emptyState("No received messages yet.");
    else { inboxContainer.innerHTML = ""; inbox.forEach(m => inboxContainer.appendChild(createMessageCard(m))); }

    if (sent.length === 0) sentContainer.innerHTML = emptyState("No sent messages yet.");
    else { sentContainer.innerHTML = ""; sent.forEach(m => sentContainer.appendChild(createMessageCard(m))); }
  } catch (err) {
    console.error(err);
    inboxContainer.innerHTML = `<p class="text-red-500 text-sm">Failed to load messages.</p>`;
    sentContainer.innerHTML  = `<p class="text-red-500 text-sm">Failed to load messages.</p>`;
  }
}

document.getElementById("sendBtn").addEventListener("click", async ()=>{
  const recipientUsername = document.getElementById("recipientUsername").value.trim();
  const content = document.getElementById("messageContent").value.trim();
  if (!content) { alert("Enter message"); return; }
  const payload = {
    sender_role: "warden",
    sender_username: VIEWER_USERNAME,
    sender_warden_role: WARDEN_ROLE,
    recipient_role: "user",
    recipient_username: recipientUsername || "",
    content,
    created_at: new Date().toISOString()
  };
  try {
    const r = await fetch(`${API}/messages`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    if (!r.ok) throw new Error("Failed to send");
    document.getElementById("messageContent").value = "";
    loadTabbedMessages();
  } catch(e){
    alert("Send failed");
    console.error(e);
  }
});

/* init */
activateTab("inbox");
loadTabbedMessages();
</script>
</body>
</html>
