<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hostel Fee Payment</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{
      --bg1:#f6f8ff; --bg2:#ffffff; --muted:#6b7280; --accent:#4f46e5; --accent-2:#8f94fb; --success:#16a34a; --danger:#ef4444;
      --warning: #f59e0b;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; background:linear-gradient(180deg,var(--bg1),#fbfdff); color:#0b1220; -webkit-font-smoothing:antialiased;}
    .wrap{max-width:1220px;margin:48px auto;padding:0 20px}

    /* Shell card */
    .card-shell{
      display:grid;
      grid-template-columns: 1fr 460px;      /* give form more horizontal room */
      gap:36px;
      background:linear-gradient(180deg, #ffffff, rgba(255,255,255,0.98));
      padding:48px;
      border-radius:18px;
      box-shadow: 0 30px 80px rgba(12,18,60,0.08);
      border:1px solid rgba(15,23,42,0.03);
      align-items:center;                    /* vertical centering of both columns */
      position:relative;
    }

    /* Left: hero */
    .hero {
      padding:6px 6px 6px 18px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }
    .brand { display:flex; gap:16px; align-items:center; }
    .logo {
      width:72px;height:72px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 12px 40px rgba(79,70,229,0.12);
      font-size:20px;
    }
    .service { font-size:13px; color:var(--muted); }
    h1.title { margin:0; color:var(--accent); font-size:36px; letter-spacing:-0.3px; font-weight:900; }
    p.lead { margin:0; color:var(--muted); font-size:16px; max-width:64ch; line-height:1.6; }

    .note { margin-top:12px; display:flex; gap:12px; align-items:center; background:linear-gradient(180deg, rgba(79,70,229,0.03), rgba(143,148,251,0.01)); padding:12px 16px; border-radius:12px; border:1px solid rgba(79,70,229,0.04); width:max-content; }

    /* Right: form panel */
    .panel { display:flex; align-items:center; justify-content:center; padding:6px; }
    .form-card {
      width:100%;
      max-width:420px;
      background:var(--bg2);
      border-radius:12px;
      padding:22px;
      box-shadow:0 10px 30px rgba(12,18,60,0.06);
      border:1px solid rgba(15,23,42,0.03);
      position:relative;
    }
    .top-row { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:4px; }
    .back { background:transparent; border:1px solid rgba(79,70,229,0.06); color:var(--accent); padding:8px 10px; border-radius:10px; cursor:pointer; font-weight:700; }
    .status { font-weight:800; color:var(--danger); font-size:15px; }

    form { margin-top:6px; display:flex; flex-direction:column; gap:14px; }
    label { font-size:13px; color:var(--muted); display:block; margin-bottom:6px; }
    /* NO transform on focus now (prevents floating inputs) */
    input.field {
      padding:14px 16px;
      border-radius:12px;
      border:1px solid #e5e7eb;
      width:100%;
      font-size:16px;
      transition:border-color 0.15s ease-in-out;
      outline:none;
    }
    input.field:focus { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .row { display:flex; gap:12px; }
    .row .col { flex:1; }

    button.pay-btn {
      padding:14px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      color:#fff;
      font-weight:700;
      font-size:17px;
      border:none;
      cursor:pointer;
      transition:transform 0.1s ease-out, box-shadow 0.1s ease-out;
    }
    button.pay-btn:hover { transform:translateY(-1px); box-shadow:0 4px 15px rgba(79,70,229,0.2); }
    button.pay-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; box-shadow:none; }

    .banner {
        margin-top:14px; padding:16px; border-radius:12px; background:#f0fdf4; border:1px solid rgba(22,163,74,0.1);
        display:flex; flex-direction:column; gap:4px;
    }
    .banner-warning { background:#fffbeb; border:1px solid rgba(245,158,11,0.1); }
    .banner-danger { background:#fef2f2; border:1px solid rgba(239,68,68,0.1); }
    
    /* loader (simple) */
    .loader { 
        position:absolute; left:0; right:0; top:0; bottom:0; background:rgba(255,255,255,0.6); 
        display:flex; align-items:center; justify-content:center; z-index:20; border-radius:18px; 
    } 
    .spinner { 
        width:40px; height:40px; border-radius:50%; border:5px solid rgba(79,70,229,0.12); 
        border-top-color:var(--accent); animation:spin 1s linear infinite; 
    } 
    @keyframes spin{ to{transform:rotate(360deg);} }

    /* Responsive */
    @media(max-width:900px){
      .wrap{margin:28px auto}
      .card-shell{grid-template-columns:1fr;padding:30px;gap:24px}
      .hero{padding:0}
      .panel{padding:0}
      .loader{border-radius:12px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card-shell">
      <div class="hero">
        <div class="brand">
          <div class="logo">P</div>
          <p class="service">Hostel Fees</p>
        </div>
        <h1 class="title">Complete Payment</h1>
        <p class="lead">Please enter your payment details to submit a request for the current hostel fee (₹1,00,000).</p>
        
        <div class="note">
          <i class="fa-solid fa-bell" style="color:var(--accent); font-size:20px;"></i>
          <div>
            <div style="font-weight:700;color:var(--muted)">Current Status</div>
            <div id="currentStatus" class="status">Loading...</div>
          </div>
        </div>
      </div>

      <aside class="panel">
        <div class="form-card">
          <div class="top-row">
            <h2>Payment Details</h2>
            <button class="back" onclick="window.location.href='home.html'"><i class="fa-solid fa-arrow-left"></i> Back</button>
          </div>

          <form id="paymentForm">
            <label for="name">Card Holder Name</label>
            <input type="text" id="name" placeholder="John Doe" required class="field"/>

            <label for="cardNumber">Card Number</label>
            <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required class="field" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/(.{4})/g, '$1 ').trim();"/>
            
            <div class="row">
              <div class="col">
                <label for="expMonth">Expiration Month</label>
                <input type="text" id="expMonth" name="expMonth" placeholder="MM" maxlength="2" required class="field" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 2);"/>
              </div>
              <div class="col">
                <label for="expYear">Expiration Year (Last two digits)</label>
                <input type="text" id="expYear" name="expYear" placeholder="YY" maxlength="2" required class="field" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 2);"/>
              </div>
              <div class="col">
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" placeholder="CVV" maxlength="3" required class="field" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 3);"/>
              </div>
            </div>

            <div id="msgContainer" style="margin-top:4px;"></div>

            <button type="submit" id="payBtn" class="pay-btn">
              <i class="fa-solid fa-credit-card"></i> Pay ₹1,00,000
            </button>
            
            <div class="note" style="margin-top:10px; background:linear-gradient(180deg, rgba(79,70,229,0.03), rgba(143,148,251,0.01));">
              <i class="fa-solid fa-lock" style="color:var(--muted); font-size:20px;"></i>
              <div>
                <div style="font-weight:700;color:var(--muted)">Secure payment</div>
                <div style="color:var(--muted);font-size:13px">Card details are not stored locally. This demo creates a payment request for admin approval.</div>
              </div>
            </div>
          </form>
          
          <div class="loader" id="loader" style="display:none;"><div class="spinner"></div></div>
        </div>
      </aside>
    </div>
  </div>

<script>
  const BASE = "https://hostel-management-system-2-2x8y.onrender.com";
  const currentStatus = document.getElementById('currentStatus');
  const payBtn = document.getElementById('payBtn');
  const loader = document.getElementById('loader');
  const msgContainer = document.getElementById('msgContainer');
  let username = localStorage.getItem('username');

  // Helper to manage form state (loading/enabled)
  function setFormState(enabled, message = '') {
    payBtn.disabled = !enabled;
    loader.style.display = enabled ? 'none' : 'flex';
    msgContainer.innerHTML = message;
  }

  // Load status once (Polling removed)
  async function loadStatus() {
    if (!username) {
      currentStatus.innerHTML = '<span style="color:var(--danger);font-weight:800">❌ Login Required</span>';
      setFormState(false, '<div style="color:var(--danger);font-weight:700">❌ Please log in to view status.</div>');
      return;
    }

    try {
      const res = await fetch(`${BASE}/payment-status/${username}`);
      const data = await res.json();
      
      if (res.ok && data.status) {
        if (data.status === 'Approved') {
          currentStatus.innerHTML = '<span style="color:var(--success);font-weight:800">✅ Fees Paid</span>';
          setFormState(false, `<div class="banner"><div style="color:var(--success);font-weight:800">Paid</div><div style="color:var(--muted);font-size:13px">Your payment was approved. Thank you!</div></div>`);
        } else if (data.status === 'Pending') {
          currentStatus.innerHTML = '<span style="color:var(--warning);font-weight:800">⏳ Request Pending</span>';
          setFormState(false, '<div class="banner banner-warning"><div style="color:var(--warning);font-weight:800">Pending</div><div style="color:var(--muted);font-size:13px">Your request is waiting for admin approval.</div></div>');
        } else {
          // 'Rejected' or other status
          currentStatus.innerHTML = '<span style="color:var(--danger);font-weight:800">❌ Fees Pending</span>';
          setFormState(true, '<div style="color:var(--danger);font-weight:700">❌ Your last request was rejected or expired. Please submit a new one.</div>');
        }
      } else {
        // No status record found, assume pending payment
        currentStatus.innerHTML = '<span style="color:var(--danger);font-weight:800">❌ Fees Pending</span>';
        setFormState(true, '<div style="color:var(--muted);font-size:13px; font-weight:700;">Please fill out your card details to submit a payment request for admin approval.</div>');
      }
    } catch (err) {
      console.warn('status check failed', err);
      currentStatus.innerHTML = '<span style="color:var(--danger);font-weight:800">❌ Status Check Error</span>';
      setFormState(true, '<div style="color:var(--danger);font-weight:700">Server error. Please try again later.</div>');
    }
  }
  
  // Form Submission Handler
  document.getElementById('paymentForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    setFormState(false); // Disable form, show loader

    // --- NEW EXPIRY DATE VALIDATION ---
    const form = e.target;
    const expMonth = form.expMonth.value.padStart(2, '0');
    const expYear = form.expYear.value; // Last two digits
    
    const now = new Date();
    const currentFullYear = now.getFullYear();
    const currentMonth = now.getMonth() + 1; // 1-12
    const currentYearLastTwo = currentFullYear % 100;

    const inputYear = parseInt(expYear, 10);
    const inputMonth = parseInt(expMonth, 10);

    // 1. Month range check
    if (inputMonth < 1 || inputMonth > 12) {
        setFormState(true, '<div class="banner banner-danger" style="color:var(--danger);font-weight:700">❌ Expiry month must be between 01 and 12.</div>');
        return;
    }

    // 2. Future date check
    if (inputYear < currentYearLastTwo || (inputYear === currentYearLastTwo && inputMonth < currentMonth)) {
        setFormState(true, '<div class="banner banner-danger" style="color:var(--danger);font-weight:700">❌ Card is expired. Expiry date must be in the future.</div>');
        return;
    }
    // --- END NEW EXPIRY DATE VALIDATION ---

    const cardNumber = document.getElementById('cardNumber').value.replace(/\s/g, '');
    const last4 = cardNumber.slice(-4);
    const payload = { username, amount: 100000, card_last4: last4 };

    try {
      // Check for an existing pending request before submission (to prevent duplicates)
      const statusRes = await fetch(`${BASE}/payment-status/${username}`);
      const statusData = await statusRes.json();
      if (statusRes.ok && statusData.status === 'Pending') {
        setFormState(false, '<div class="banner banner-warning"><div style="color:var(--warning);font-weight:700">You already have a pending request.</div></div>');
        return;
      }
        
      const res = await fetch(`${BASE}/payment-request`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({ message: 'Unexpected response' }));

      if (res.status === 201) {
        setFormState(false, `<div class="banner"><div style="color:var(--success);font-weight:800">Submitted</div><div style="color:var(--muted);font-size:13px">Payment request submitted for admin approval. You will be notified once approved.</div></div>`);
        currentStatus.innerHTML = '<span style="color:var(--warning);font-weight:800">⏳ Request Pending</span>';
      } else {
        setFormState(true, `<div class="banner banner-danger" style="color:var(--danger);font-weight:700">${data.message || 'Could not submit request. Try again.'}</div>`);
      }
    } catch (err) {
      console.error('submit error', err);
      setFormState(true, '<div class="banner banner-danger" style="color:var(--danger);font-weight:700">Server unreachable. Please try again later.</div>');
    }
  });

  // FIX APPLIED: Initial load called ONLY ONCE after the DOM is ready. Polling is removed.
  document.addEventListener('DOMContentLoaded', () => {
    loadStatus();
  });
</script>
</body>
</html>
