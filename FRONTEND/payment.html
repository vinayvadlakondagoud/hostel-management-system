<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hostel Payment</title>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{
      --indigo:#4f46e5; --indigo-600:#4338ca; --muted:#6b7280; --success:#16a34a; --danger:#dc2626;
    }
    body{font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#eef2ff 0%, #f8fafc 100%);margin:0;padding:40px 8px;}
    .payment-wrapper{max-width:720px;margin:24px auto;background:linear-gradient(180deg,#fff, #fbfbff);border-radius:18px;box-shadow:0 20px 50px rgba(32,41,94,0.08);overflow:hidden;border:1px solid rgba(74,85,214,0.06)}
    .left-hero{background:linear-gradient(135deg, rgba(79,70,229,0.06), rgba(143,148,251,0.03));padding:48px 36px;display:flex;gap:20px;align-items:center}
    .brand{display:flex;flex-direction:column;gap:8px}
    .brand h1{margin:0;color:var(--indigo);font-size:28px}
    .brand p{margin:0;color:var(--muted);font-size:14px}
    .payment-body{padding:36px}
    .status-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .back-btn{background:#eef2ff;color:var(--indigo);border:none;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
    .card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 6px 18px rgba(21,23,61,0.05);}
    .card-fields{display:flex;flex-direction:column;gap:14px;margin-top:12px}
    input{padding:12px;border-radius:10px;border:1px solid #e6e9f2;font-size:15px}
    .pay-btn{background:linear-gradient(90deg,var(--indigo),#8f94fb);color:#fff;font-weight:700;padding:14px;border-radius:12px;border:none;font-size:16px;cursor:pointer;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:10px}
    .pay-btn:disabled{opacity:0.6;cursor:not-allowed}
    .meta-note{font-size:13px;color:var(--muted);margin-top:18px}
    .success-msg{color:var(--success);font-weight:700;margin-top:14px}
    .error-msg{color:var(--danger);font-weight:700;margin-top:14px}
    .alert-pill{display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;background:#f8fafc;border:1px solid #eef2ff}
    .big-amount{font-weight:800;font-size:18px}

    /* responsive */
    @media(min-width:900px){
      .payment-wrapper{display:grid;grid-template-columns:320px 1fr}
      .payment-body{padding:48px}
    }
  </style>
</head>
<body>
  <div class="payment-wrapper">
    <div class="left-hero">
      <div class="brand">
        <h1><i class="fa-solid fa-credit-card"></i> Hostel Fee Payment</h1>
        <p>Securely submit your hostel fee for admin approval.</p>
        <div style="margin-top:12px;">
          <div class="alert-pill"><i class="fa-solid fa-shield-halved" style="color:var(--indigo)"></i><span style="font-size:13px;color:var(--muted)">Payments are reviewed before final acceptance</span></div>
        </div>
      </div>
    </div>

    <div class="payment-body">
      <div class="status-row">
        <button class="back-btn" onclick="window.location.href='home.html'">← Back</button>
        <div id="currentStatus">Checking payment status...</div>
      </div>

      <div class="card">
        <form id="paymentForm">
          <div class="card-fields">
            <input type="text" id="cardName" placeholder="Cardholder Name" required />
            <input type="text" id="cardNumber" placeholder="Card Number" maxlength="19" required />
            <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required />
            <input type="text" id="cvv" placeholder="CVV" maxlength="4" required />
          </div>

          <div style="margin-top:18px;display:flex;gap:12px;align-items:center">
            <button type="submit" id="payBtn" class="pay-btn"><i class="fa-solid fa-paypal"></i><span>Pay ₹1,00,000</span></button>
          </div>
        </form>

        <div id="paymentStatus"></div>

        <div class="meta-note">
          <i class="fa-solid fa-lock"></i> Your payment is securely processed. We do not store card details locally. For production, integrate a real gateway.
        </div>
      </div>
    </div>
  </div>

  <script>
    const username = localStorage.getItem('username');
    if (!username) location.href = 'login.html';

    const paymentForm = document.getElementById('paymentForm');
    const paymentStatusDiv = document.getElementById('paymentStatus');
    const currentStatus = document.getElementById('currentStatus');
    const payBtn = document.getElementById('payBtn');

    function setFormState(enabled, message) {
      const controls = paymentForm.querySelectorAll('input, button');
      controls.forEach(c => c.disabled = !enabled);
      if (message) paymentStatusDiv.innerHTML = message;
      if (!enabled) payBtn.setAttribute('aria-disabled','true'); else payBtn.removeAttribute('aria-disabled');
    }

    async function showCurrentStatus() {
      currentStatus.innerText = 'Checking payment & requests...';
      try {
        // 1) check payment_status for final acceptance
        const p = await fetch(`https://hostel-management-system-2-2x8y.onrender.com/payment-status/${encodeURIComponent(username)}`);
        const pData = await p.json();

        // 2) check if a pending payment request exists for this user
        const r = await fetch('https://hostel-management-system-2-2x8y.onrender.com/payment-requests?status=Pending');
        const arr = await r.json();
        const havePending = Array.isArray(arr) && arr.some(x => x.username === username);

        if (pData.status === 'Paid') {
          currentStatus.innerHTML = '<span style="color: #16a34a; font-weight:700">✔️ Fees Paid</span>';
          setFormState(false, '<div class="success-msg">Fees already paid and accepted by admin.</div>');
        } else if (havePending) {
          currentStatus.innerHTML = '<span style="color:#f59e0b; font-weight:700">⏳ Request Pending (awaiting admin)</span>';
          setFormState(false, '<div class="error-msg">A payment request is pending approval. You will be notified once admin responds.</div>');
        } else {
          currentStatus.innerHTML = '<span style="color:#dc2626; font-weight:700">❌ Fees Pending</span>';
          setFormState(true, '');
        }
      } catch (err) {
        console.warn('Status fetch failed', err);
        currentStatus.innerHTML = '<span style="color:#dc2626; font-weight:700">❌ Fees Pending</span>';
        setFormState(true, '');
      }
    }

    showCurrentStatus();

    paymentForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      paymentStatusDiv.innerHTML = '';

      // re-check quickly to avoid race
      try {
        const s = await fetch(`https://hostel-management-system-2-2x8y.onrender.com/payment-status/${encodeURIComponent(username)}`);
        const sd = await s.json();
        if (sd.status === 'Paid') {
          paymentStatusDiv.innerHTML = '<div class="success-msg">Fees already paid and accepted by admin.</div>';
          setFormState(false);
          return;
        }
        // also check pending requests
        const r = await fetch('https://hostel-management-system-2-2x8y.onrender.com/payment-requests?status=Pending');
        const arr = await r.json();
        if (Array.isArray(arr) && arr.some(x => x.username === username)) {
          paymentStatusDiv.innerHTML = '<div class="error-msg">You already have a pending request. Please wait for admin decision.</div>';
          setFormState(false);
          return;
        }
      } catch (err) { console.warn('Pre-submit status check failed', err); }

      const cardName = document.getElementById('cardName').value.trim();
      const cardNumber = document.getElementById('cardNumber').value.trim().replace(/\s/g,'');
      const expiry = document.getElementById('expiry').value.trim();
      const cvv = document.getElementById('cvv').value.trim();

      if (!cardName || !cardNumber || !expiry || !cvv) {
        paymentStatusDiv.innerHTML = '<div class="error-msg">Please fill all fields.</div>';
        return;
      }
      if (!/^\d{16}$/.test(cardNumber)) { paymentStatusDiv.innerHTML = '<div class="error-msg">Invalid card number.</div>'; return; }
      if (!/^\d{2}\/\d{2}$/.test(expiry)) { paymentStatusDiv.innerHTML = '<div class="error-msg">Invalid expiry format.</div>'; return; }
      if (!/^\d{3,4}$/.test(cvv)) { paymentStatusDiv.innerHTML = '<div class="error-msg">Invalid CVV.</div>'; return; }

      // Disable form immediately to prevent duplicate clicks
      setFormState(false, '<div>Processing payment & creating request... Please wait.</div>');

      try {
        const last4 = cardNumber.slice(-4);
        const res = await fetch('https://hostel-management-system-2-2x8y.onrender.com/payment-request', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, amount: 100000, card_last4: last4 })
        });
        const data = await res.json();
        if (res.status === 201) {
          paymentStatusDiv.innerHTML = '<div class="success-msg">Payment request submitted for admin approval. You will be notified once approved.</div>';
          // keep the form disabled until admin approves or rejects; refresh status
          showCurrentStatus();
        } else {
          paymentStatusDiv.innerHTML = `<div class="error-msg">${data.message || 'Could not submit request. Try again.'}</div>`;
          // re-enable form in case of server error
          setTimeout(() => showCurrentStatus(), 900);
        }
      } catch (err) {
        console.error(err);
        paymentStatusDiv.innerHTML = '<div class="error-msg">Server error. Try again later.</div>';
        // allow retry in a bit
        setTimeout(() => showCurrentStatus(), 900);
      }
    });

    // periodically refresh status to catch admin actions (e.g., rejection -> allow paying again)
    setInterval(showCurrentStatus, 12_000);
  </script>
</body>
</html>
