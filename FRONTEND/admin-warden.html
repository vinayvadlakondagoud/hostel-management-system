<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Pending Wardens</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#fff;
      --muted:#64748b;
      --accent:#2563eb;
      --primary:#0ea5a4;
      --radius:12px;
      --shadow:0 8px 30px rgba(20,24,40,0.06);
      --max-width:1100px;
    }
    *{box-sizing:border-box}
    body{
      font-family:Inter, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      background:linear-gradient(180deg,#eef2ff 0%,var(--bg) 100%);
      color:#0f172a;
      padding:28px;
      min-height:100vh;
    }
    .container{max-width:var(--max-width);margin:0 auto}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
    .header h1{font-size:20px;color:var(--accent);margin:0}
    .header .hint{color:var(--muted);font-size:13px}
    .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
    .warden-grid{display:grid;grid-template-columns:1fr 220px;gap:12px;align-items:center}
    .btn{padding:10px 12px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
    .btn.approve{background:linear-gradient(90deg,#10b981,#06b6d4);color:#fff}
    .btn.reject{background:#ef4444;color:#fff}
    .small{color:var(--muted);font-size:13px}
    .meta{font-size:13px;color:#374151}
    .controls{display:flex;gap:8px;justify-content:flex-end}
    .empty{padding:20px;text-align:center;color:var(--muted)}
    .search-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
    .search-input{flex:1;padding:10px;border-radius:10px;border:1px solid #e6eef6}
    .filter{padding:10px;border-radius:10px;border:1px solid #e6eef6;background:#fff}
    @media(max-width:900px){
      .warden-grid{grid-template-columns:1fr}
      .controls{justify-content:flex-start}
    }
    .tiny{font-size:12px;color:var(--muted)}
    .pill { display:inline-block; padding:6px 10px; border-radius:999px; background:#f1f5f9; color:#334155; font-size:12px; }
    .timestamp { font-size:12px; color:var(--muted); margin-top:8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Pending Wardens</h1>
        <div class="hint tiny">Approve wardens so they can login. Reject will mark them rejected (they must re-register or be managed).</div>
      </div>

      <div style="display:flex;gap:10px;align-items:center">
        <div class="tiny">Admin Panel</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <div class="search-row">
        <input id="searchInput" class="search-input" placeholder="Search by username, name or email..." />
        <select id="filterSelect" class="filter">
          <option value="all">All Pending</option>
          <option value="applied">With Application</option>
          <option value="noapp">No Application</option>
          <option value="approved">Approved Wardens</option>
          <option value="rejected">Rejected Wardens</option>
        </select>
        <button id="refreshBtn" class="btn" style="background:#111;color:#fff">Refresh</button>
      </div>
      <div class="small">Tip: Click Approve to enable warden login. Click Reject to mark the record as rejected so they can be reviewed later.</div>
    </div>

    <div id="wardenList">
      <div class="card empty">Loading pending wardens...</div>
    </div>
  </div>

<script>
  // CHANGE THIS if your backend runs elsewhere
  const BASE_URL = 'https://hostel-management-system-2-2x8y.onrender.com';

  const container = document.getElementById('wardenList');
  const searchInput = document.getElementById('searchInput');
  const filterSelect = document.getElementById('filterSelect');
  const refreshBtn = document.getElementById('refreshBtn');

  let cachedWardens = []; // currently loaded set (pending/approved/rejected depending on view)
  let currentView = 'pending'; // 'pending' | 'approved' | 'rejected'

  refreshBtn.addEventListener('click', () => {
    // reload whichever view is active
    if (currentView === 'approved') loadApprovedWardens();
    else if (currentView === 'rejected') loadRejectedWardens();
    else loadPendingWardens();
  });

  searchInput.addEventListener('input', applyFilters);
  filterSelect.addEventListener('change', applyFilters);

  // escapeHtml (safe)
  function escapeHtml(s){
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // Render list of wardens
  function renderWardens(wardens) {
    container.innerHTML = '';
    if (!wardens || wardens.length === 0) {
      container.innerHTML = '<div class="card empty">No wardens found</div>';
      return;
    }

    wardens.forEach(w => {
      const card = document.createElement('div');
      card.className = 'card';
      const appliedTxt = (w.job_role || w.shift || w.applied_at) ? `<div class="pill">Applied: ${escapeHtml(w.job_role||'—')} ${w.shift ? '• ' + escapeHtml(w.shift) : ''}</div>` : '';
      const createdAt = w.applied_at ? new Date(w.applied_at).toLocaleString() : (w.created_at ? new Date(w.created_at).toLocaleString() : '—');
      const statusLabel = w.status ? escapeHtml(w.status) : 'pending';

      // Buttons: disable when already same state
      const approveDisabled = (statusLabel === 'approved') ? 'disabled' : '';
      const rejectDisabled = (statusLabel === 'rejected') ? 'disabled' : '';

      // Show approve/reject only for admin actions — but we keep showing both with disabling rules
      card.innerHTML = `
        <div class="warden-grid">
          <div>
            <h3 style="margin:0 0 6px 0">${escapeHtml(w.fullname || w.username)}</h3>
            <div class="meta"><strong>Username:</strong> ${escapeHtml(w.username)} &nbsp; • &nbsp; <strong>Email:</strong> ${escapeHtml(w.email || '—')}</div>
            <div class="meta" style="margin-top:8px"><strong>Contact:</strong> ${escapeHtml(w.contact || '—')}</div>
            <div style="margin-top:8px">${appliedTxt}</div>
            <div class="timestamp">Registered: ${createdAt}</div>
            <div style="margin-top:8px" class="tiny">Status: <strong>${statusLabel}</strong></div>
          </div>
          <div class="controls">
            <button class="btn approve" ${approveDisabled} onclick="approve('${encodeURIComponent(w.username)}', this)">Approve</button>
            <button class="btn reject" ${rejectDisabled} onclick="rejectWarden('${encodeURIComponent(w.username)}', this)">Reject</button>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // Loaders
  async function loadPendingWardens() {
    currentView = 'pending';
    container.innerHTML = '<div class="card empty">Loading pending wardens...</div>';
    try {
      const res = await fetch(`${BASE_URL}/admin/wardens/pending`);
      if (!res.ok) throw new Error('Fetch failed: ' + res.status);
      const wardens = await res.json();
      cachedWardens = Array.isArray(wardens) ? wardens : [];
      applyFilters(); // render filtered
    } catch (e) {
      container.innerHTML = `<div class="card empty">Could not load pending wardens. ${escapeHtml(e.message || '')}</div>`;
    }
  }

  async function loadApprovedWardens() {
    currentView = 'approved';
    container.innerHTML = '<div class="card empty">Loading approved wardens...</div>';
    try {
      const res = await fetch(`${BASE_URL}/admin/wardens/approved`);
      if (!res.ok) throw new Error('Fetch failed: ' + res.status);
      const wardens = await res.json();
      cachedWardens = Array.isArray(wardens) ? wardens : [];
      applyFilters();
    } catch (e) {
      container.innerHTML = `<div class="card empty">Could not load approved wardens. ${escapeHtml(e.message || '')}</div>`;
    }
  }

  async function loadRejectedWardens() {
    currentView = 'rejected';
    container.innerHTML = '<div class="card empty">Loading rejected wardens...</div>';
    try {
      const res = await fetch(`${BASE_URL}/admin/wardens/rejected`);
      if (!res.ok) throw new Error('Fetch failed: ' + res.status);
      const wardens = await res.json();
      cachedWardens = Array.isArray(wardens) ? wardens : [];
      applyFilters();
    } catch (e) {
      container.innerHTML = `<div class="card empty">Could not load rejected wardens. ${escapeHtml(e.message || '')}</div>`;
    }
  }

  // Approve
  async function approve(usernameEnc, btn) {
    const username = decodeURIComponent(usernameEnc);
    if (!confirm(`Approve warden "${username}"?`)) return;
    btn.disabled = true;
    try {
      const res = await fetch(`${BASE_URL}/admin/wardens/${encodeURIComponent(username)}/approve`, { method: 'PATCH' });
      const data = await res.json().catch(()=>({}));
      if (!res.ok) {
        alert(data.message || 'Approve failed');
        btn.disabled = false;
        return;
      }
      alert('Warden approved — they can now login.');
      // reload current view
      if (currentView === 'approved') loadApprovedWardens();
      else if (currentView === 'rejected') loadRejectedWardens();
      else loadPendingWardens();
    } catch (e) {
      alert('Network error: ' + (e.message || e));
      btn.disabled = false;
    }
  }

  // Reject
  async function rejectWarden(usernameEnc, btn) {
    const username = decodeURIComponent(usernameEnc);
    if (!confirm(`Reject warden "${username}"? They will be marked rejected.`)) return;
    btn.disabled = true;
    try {
      const res = await fetch(`${BASE_URL}/admin/wardens/${encodeURIComponent(username)}/reject`, { method: 'PATCH' });
      const data = await res.json().catch(()=>({}));
      if (!res.ok) {
        alert(data.message || 'Reject failed');
        btn.disabled = false;
        return;
      }
      alert('Warden marked rejected.');
      if (currentView === 'approved') loadApprovedWardens();
      else if (currentView === 'rejected') loadRejectedWardens();
      else loadPendingWardens();
    } catch (e) {
      alert('Network error: ' + (e.message || e));
      btn.disabled = false;
    }
  }

  // applyFilters: uses cachedWardens (already fetched) and current search/filter selection
  function applyFilters() {
    const f = filterSelect.value;
    // If user changed filter to a view that needs server call, invoke loader
    if (f === 'approved') { loadApprovedWardens(); return; }
    if (f === 'rejected') { loadRejectedWardens(); return; }
    if (f === 'all') { loadPendingWardens(); return; }

    // Otherwise operate on cachedWardens (these are pending results)
    let list = cachedWardens.slice();
    const q = (searchInput.value || '').trim().toLowerCase();

    if (f === 'applied') {
      list = list.filter(w => w.job_role || w.shift || w.applied_at);
    } else if (f === 'noapp') {
      list = list.filter(w => !(w.job_role || w.shift || w.applied_at));
    }

    if (q) {
      list = list.filter(w => {
        const s = `${w.username||''} ${w.fullname||''} ${w.email||''}`.toLowerCase();
        return s.includes(q);
      });
    }

    renderWardens(list);
  }

  // Initial load: pending wardens
  loadPendingWardens();

  // optional: keyboard Enter on search triggers filter immediately
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      applyFilters();
    }
  });
</script>
</body>
</html>
