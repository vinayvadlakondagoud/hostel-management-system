<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Wardens</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#fff;
      --muted:#64748b;
      --accent:#2563eb;
      --primary:#0ea5a4;
      --radius:12px;
      --shadow:0 8px 30px rgba(20,24,40,0.06);
      --max-width:1100px;
    }
    *{box-sizing:border-box}
    body{
      font-family:Inter, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      background:linear-gradient(180deg,#eef2ff 0%,var(--bg) 100%);
      color:#0f172a;
      padding:28px;
      min-height:100vh;
    }
    .container{max-width:var(--max-width);margin:0 auto}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
    .header h1{font-size:20px;color:var(--accent);margin:0}
    .header .hint{color:var(--muted);font-size:13px}
    .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
    .warden-grid{display:grid;grid-template-columns:1fr 220px;gap:12px;align-items:center}
    .btn{padding:10px 12px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
    .btn.approve{background:linear-gradient(90deg,#10b981,#06b6d4);color:#fff}
    .btn.reject{background:#ef4444;color:#fff}
    .small{color:var(--muted);font-size:13px}
    .meta{font-size:13px;color:#374151}
    .controls{display:flex;gap:8px;justify-content:flex-end}
    .empty{padding:20px;text-align:center;color:var(--muted)}
    .search-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
    .search-input{flex:1;padding:10px;border-radius:10px;border:1px solid #e6eef6}
    .filter{padding:10px;border-radius:10px;border:1px solid #e6eef6;background:#fff}
    @media(max-width:900px){
      .warden-grid{grid-template-columns:1fr}
      .controls{justify-content:flex-start}
    }
    .tiny{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 id="pageTitle">Pending Wardens</h1>
        <div class="hint tiny">Approve wardens so they can login. Reject will remove their registration (they must re-register).</div>
      </div>

      <div style="display:flex;gap:10px;align-items:center">
        <div class="tiny">Admin Panel</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <div class="search-row">
        <input id="searchInput" class="search-input" placeholder="Search by username, name or email..." />
        <select id="filterSelect" class="filter" aria-label="Filter wardens">
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
        </select>
        <button id="refreshBtn" class="btn" style="background:#111;color:#fff">Refresh</button>
      </div>
      <div class="small">Tip: Click Approve to enable warden login. Click Reject to remove the record so they can re-register later.</div>
    </div>

    <div id="wardenList">
      <div class="card empty">Loading wardens...</div>
    </div>
  </div>

<script>
  // CHANGE THIS to your backend origin if different
  const BASE_URL = 'https://hostel-management-system-2-2x8y.onrender.com';

  const container = document.getElementById('wardenList');
  const searchInput = document.getElementById('searchInput');
  const filterSelect = document.getElementById('filterSelect');
  const refreshBtn = document.getElementById('refreshBtn');
  const pageTitle = document.getElementById('pageTitle');

  let cachedWardens = [];

  refreshBtn.addEventListener('click', loadWardensBasedOnFilter);
  searchInput.addEventListener('input', applyFilters);
  filterSelect.addEventListener('change', () => {
    updateTitle();
    loadWardensBasedOnFilter();
  });

  function updateTitle() {
    const f = (filterSelect.value || 'pending').toLowerCase();
    pageTitle.textContent = (f === 'approved') ? 'Approved Wardens' : 'Pending Wardens';
  }

  function escapeHtml(s){
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  async function loadWardensBasedOnFilter(){
    const f = (filterSelect.value || 'pending').toLowerCase();
    if (f === 'approved') {
      await loadApprovedOrFallback();
    } else {
      await loadPendingWardens();
    }
  }

  async function loadPendingWardens() {
    container.innerHTML = '<div class="card empty">Loading pending wardens...</div>';
    try {
      const res = await fetch(`${BASE_URL}/admin/wardens/pending`);
      if (!res.ok) throw new Error('Failed to fetch: ' + res.status);
      const wardens = await res.json();
      cachedWardens = Array.isArray(wardens) ? wardens : [];
      applyFilters(); // render with any search
    } catch (e) {
      container.innerHTML = `<div class="card empty">Could not load pending wardens. ${escapeHtml(e.message)}</div>`;
    }
  }

  // Try /admin/wardens/approved first; if not available, fallback to /admin/wardens/all and filter approved
  async function loadApprovedOrFallback() {
    container.innerHTML = '<div class="card empty">Loading approved wardens...</div>';
    try {
      let res = await fetch(`${BASE_URL}/admin/wardens/approved`);
      if (res.ok) {
        const wardens = await res.json();
        cachedWardens = Array.isArray(wardens) ? wardens : [];
        applyFilters();
        return;
      }
      // If not ok, fall through to all
    } catch (err) {
      // ignore and fallback
    }

    try {
      const res2 = await fetch(`${BASE_URL}/admin/wardens/all`);
      if (!res2.ok) throw new Error('Failed to fetch all wardens: ' + res2.status);
      const all = await res2.json();
      // keep only approved ones (server returns approved field)
      const approved = (Array.isArray(all) ? all : []).filter(w => Number(w.approved) === 1);
      // If job application info isn't merged on server, we'll try to fetch latest job apps separately
      // but simplest is to rely on server merging (server.js snippet provided earlier).
      cachedWardens = approved;
      applyFilters();
    } catch (e) {
      container.innerHTML = `<div class="card empty">Could not load approved wardens. ${escapeHtml(e.message)}</div>`;
    }
  }

  function renderWardens(wardens) {
    container.innerHTML = '';
    if (!wardens || wardens.length === 0) {
      const f = (filterSelect.value || 'pending');
      container.innerHTML = `<div class="card empty">No ${escapeHtml(f)} wardens</div>`;
      return;
    }

    const currentFilter = (filterSelect.value || 'pending').toLowerCase();

    wardens.forEach(w => {
      const card = document.createElement('div');
      card.className = 'card';

      // applied values: show fallback '—' if absent
      const jobRole = w.job_role || '—';
      const shift = w.shift || '—';
      const appliedAt = w.applied_at ? (new Date(w.applied_at)).toLocaleString() : '—';

      // build controls conditionally: don't show Approve for already-approved list
      let controlsHtml = '';
      if (currentFilter === 'pending') {
        controlsHtml = `
          <button class="btn approve" onclick="approve('${encodeURIComponent(w.username)}', this)">Approve</button>
          <button class="btn reject" onclick="rejectWarden('${encodeURIComponent(w.username)}', this)">Reject</button>
        `;
      } else {
        // approved view: hide Approve button; keep Reject (optional)
        controlsHtml = `
          <button class="btn reject" onclick="rejectWarden('${encodeURIComponent(w.username)}', this)">Reject</button>
        `;
      }

      card.innerHTML = `
        <div class="warden-grid">
          <div>
            <h3 style="margin:0 0 6px 0">${escapeHtml(w.fullname || w.username)}</h3>
            <div class="meta"><strong>Username:</strong> ${escapeHtml(w.username)} &nbsp; • &nbsp; <strong>Email:</strong> ${escapeHtml(w.email || '—')}</div>
            <div class="meta" style="margin-top:8px"><strong>Contact:</strong> ${escapeHtml(w.contact || '—')}</div>
            <div class="meta" style="margin-top:8px"><strong>Applied Role:</strong> ${escapeHtml(jobRole)} &nbsp; • &nbsp; <strong>Shift:</strong> ${escapeHtml(shift)}</div>
            <div class="small" style="margin-top:8px">Applied at: ${escapeHtml(appliedAt)}</div>
          </div>
          <div class="controls">
            ${controlsHtml}
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // Approve action
  async function approve(usernameEnc, btn){
    const username = decodeURIComponent(usernameEnc);
    if (!confirm(`Approve warden \"${username}\"?`)) return;
    btn.disabled = true;
    try {
      const res = await fetch(`${BASE_URL}/admin/wardens/${encodeURIComponent(username)}/approve`, { method: 'PATCH' });
      const data = await res.json().catch(()=>({}));
      if (!res.ok) {
        alert(data.message || 'Approve failed');
        btn.disabled = false;
        return;
      }
      alert('Warden approved — they can now login.');
      await loadWardensBasedOnFilter();
    } catch (e) {
      alert('Network error: ' + e.message);
      btn.disabled = false;
    }
  }

  // Reject action (deletes warden & their job apps per server logic)
  async function rejectWarden(usernameEnc, btn){
    const username = decodeURIComponent(usernameEnc);
    if (!confirm(`Reject and remove warden \"${username}\"? They will need to re-register.`)) return;
    btn.disabled = true;
    try {
      const res = await fetch(`${BASE_URL}/admin/wardens/${encodeURIComponent(username)}/reject`, { method: 'PATCH' });
      const data = await res.json().catch(()=>({}));
      if (!res.ok) {
        alert(data.message || 'Reject failed');
        btn.disabled = false;
        return;
      }
      alert('Warden rejected and removed. They must register again.');
      await loadWardensBasedOnFilter();
    } catch (e) {
      alert('Network error: ' + e.message);
      btn.disabled = false;
    }
  }

  function applyFilters(){
    const q = (searchInput.value || '').trim().toLowerCase();
    let list = cachedWardens.slice();

    if (q) {
      list = list.filter(w => {
        const s = `${w.username||''} ${w.fullname||''} ${w.email||''}`.toLowerCase();
        return s.indexOf(q) !== -1;
      });
    }

    renderWardens(list);
  }

  // initial load + set title
  updateTitle();
  loadWardensBasedOnFilter();
</script>
</body>
</html>
