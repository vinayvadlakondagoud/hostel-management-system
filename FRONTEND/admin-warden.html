<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Warden Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #007bff;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.5em;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        main {
            padding: 20px;
            max-width: 1200px;
            margin: 20px auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        h2 {
            color: #007bff;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
            color: #333;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        /* Status Messages */
        #msg {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-weight: bold;
        }

        #msg.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        #msg.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        #msg.info {
            background-color: #cfe2ff;
            color: #052c65;
            border: 1px solid #b6d4fe;
        }

        /* Delete Button Style */
        .delete-btn {
            background-color: #dc3545; /* Red color */
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }
        
        /* Action Buttons */
        .action-btn {
            padding: 6px 10px;
            margin-right: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }

        .approve-btn {
            background-color: #28a745;
        }

        .reject-btn {
            background-color: #ffc107;
        }

        .approve-btn:hover { background-color: #218838; }
        .reject-btn:hover { background-color: #e0a800; }
        
    </style>
</head>
<body>
    <header>
        <h1>Admin Dashboard</h1>
        <nav>
            <a href="admin.html">Dashboard</a>
            <a href="admin-login.html">Logout</a>
        </nav>
    </header>

    <main>
        <h1>Warden Management Dashboard</h1>

        <div id="msg"></div> <section>
            <h2>✅ Approved Warden Applications</h2>
            <div id="approvedApplicationsList">
                </div>
        </section>

        <hr>

        <section>
            <h2>❌ Rejected Warden Applications</h2>
            <div id="rejectedApplicationsList">
                </div>
        </section>
        
        <hr>

        <section>
            <h2>⏳ Pending Warden Applications</h2>
            <div id="pendingApplicationsList">
                </div>
        </section>
        
    </main>

    <script>
        // Placeholder for the base URL of your API
        const API_BASE_URL = 'https://hostel-management-system-2-2x8y.onrender.com';

        // Function to handle the deletion of an approved warden
        async function deleteApprovedWarden(username) {
            if (!confirm(`Are you sure you want to delete the approved warden: ${username}? This will remove their user account and job application records.`)) {
                return;
            }

            const msgElement = document.getElementById('msg');
            msgElement.textContent = `Deleting ${username}...`;
            msgElement.className = 'info';

            try {
                const res = await fetch(`${API_BASE_URL}/delete-approved-warden/${username}`, {
                    method: 'DELETE',
                });

                const data = await res.json();

                if (!res.ok) {
                    msgElement.className = 'error';
                    msgElement.textContent = data.message || `Error deleting warden ${username}.`;
                    return;
                }

                msgElement.className = 'success';
                msgElement.textContent = `Successfully deleted warden: ${username}.`;
                // Refresh all lists after successful deletion
                fetchApplications();

            } catch (error) {
                msgElement.className = 'error';
                msgElement.textContent = 'Network error while deleting warden.';
            }
        }

        // Function to handle approving or rejecting a pending application
        async function updateApplicationStatus(username, newStatus) {
            const msgElement = document.getElementById('msg');
            msgElement.textContent = `Updating status for ${username} to ${newStatus}...`;
            msgElement.className = 'info';

            try {
                const res = await fetch(`${API_BASE_URL}/update-warden-status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, status: newStatus })
                });

                const data = await res.json();

                if (!res.ok) {
                    msgElement.className = 'error';
                    msgElement.textContent = data.message || `Failed to update status for ${username}.`;
                    return;
                }

                msgElement.className = 'success';
                msgElement.textContent = `Status updated to ${newStatus.toUpperCase()} for ${username}.`;
                fetchApplications(); // Refresh lists

            } catch (error) {
                msgElement.className = 'error';
                msgElement.textContent = 'Network error during status update.';
            }
        }


        // Function to render the list of applications
        function renderApplications(applications, containerId, status) {
            const container = document.getElementById(containerId);
            container.innerHTML = ''; // Clear existing content

            // Filter applications by the required status (case-insensitive)
            const filteredApps = applications.filter(app => (app.status || 'pending').toLowerCase() === status.toLowerCase());

            if (filteredApps.length === 0) {
                container.innerHTML = `<p>No **${status.toUpperCase()}** applications found.</p>`;
                return;
            }

            const table = document.createElement('table');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Full Name</th>
                        <th>Status</th>
                        ${status === 'approved' || status === 'pending' ? '<th>Action</th>' : ''}
                    </tr>
                </thead>
                <tbody>
                </tbody>
            `;
            const tbody = table.querySelector('tbody');

            filteredApps.forEach(app => {
                const row = tbody.insertRow();
                row.insertCell().textContent = app.username;
                row.insertCell().textContent = app.email;
                row.insertCell().textContent = app.fullname;
                row.insertCell().textContent = (app.status || 'pending').toUpperCase();
                
                const actionCell = row.insertCell();

                if (status === 'approved') {
                    // Add Delete button for approved applications
                    const deleteButton = document.createElement('button');
                    deleteButton.textContent = 'Delete Record';
                    deleteButton.className = 'delete-btn';
                    deleteButton.onclick = () => deleteApprovedWarden(app.username);
                    actionCell.appendChild(deleteButton);
                } else if (status === 'pending') {
                    // Add Approve and Reject buttons for pending applications
                    const approveButton = document.createElement('button');
                    approveButton.textContent = 'Approve';
                    approveButton.className = 'action-btn approve-btn';
                    approveButton.onclick = () => updateApplicationStatus(app.username, 'approved');
                    
                    const rejectButton = document.createElement('button');
                    rejectButton.textContent = 'Reject';
                    rejectButton.className = 'action-btn reject-btn';
                    rejectButton.onclick = () => updateApplicationStatus(app.username, 'rejected');

                    actionCell.appendChild(approveButton);
                    actionCell.appendChild(rejectButton);
                }
            });

            container.appendChild(table);
        }

        // Main function to fetch all applications
        async function fetchApplications() {
            const msgElement = document.getElementById('msg');
            msgElement.textContent = 'Loading applications...';
            msgElement.className = 'info';

            try {
                const res = await fetch(`${API_BASE_URL}/admin-warden-applications`);
                const applications = await res.json();

                if (!res.ok) {
                    msgElement.className = 'error';
                    msgElement.textContent = applications.message || 'Failed to load applications.';
                    return;
                }

                // Render the separate lists for Approved, Rejected, and Pending
                renderApplications(applications, 'approvedApplicationsList', 'approved');
                renderApplications(applications, 'rejectedApplicationsList', 'rejected');
                renderApplications(applications, 'pendingApplicationsList', 'pending');
                
                // Clear message if successful
                msgElement.textContent = '';
                msgElement.className = '';

            } catch (error) {
                msgElement.className = 'error';
                msgElement.textContent = 'Network error while fetching applications.';
            }
        }

        // Load applications when the page loads
        document.addEventListener('DOMContentLoaded', fetchApplications);
    </script>
</body>
</html>
