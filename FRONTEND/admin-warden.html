<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Warden Management</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#fff;
      --muted:#64748b;
      --accent:#2563eb;
      --primary:#0ea5a4;
      --radius:12px;
      --shadow:0 8px 30px rgba(20,24,40,0.06);
      --max-width:1100px;
    }
    *{box-sizing:border-box}
    body{
      font-family:Inter, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      background:linear-gradient(180deg,#eef2ff 0%,var(--bg) 100%);
      color:#0f172a;
      padding:28px;
      min-height:100vh;
    }
    .container{max-width:var(--max-width);margin:0 auto}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
    .header h1{font-size:20px;color:var(--accent);margin:0}
    .header .hint{color:var(--muted);font-size:13px}
    .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
    .warden-grid{display:grid;grid-template-columns:1fr 220px;gap:12px;align-items:center}
    .btn{padding:10px 12px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
    .btn.approve{background:linear-gradient(90deg,#10b981,#06b6d4);color:#fff}
    .btn.reject{background:#ef4444;color:#fff}
    .small{color:var(--muted);font-size:13px}
    .meta{font-size:13px;color:#374151}
    .controls{display:flex;gap:8px;justify-content:flex-end}
    .empty{padding:20px;text-align:center;color:var(--muted)}
    .search-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
    .search-input{flex:1;padding:10px;border-radius:10px;border:1px solid #e6eef6}
    .filter{padding:10px;border-radius:10px;border:1px solid #e6eef6;background:#fff}
    @media(max-width:900px){
      .warden-grid{grid-template-columns:1fr}
      .controls{justify-content:flex-start}
    }
    .tiny{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Warden Management</h1>
        <div class="hint tiny">Use the filter below to view Pending, Approved, or Rejected wardens.</div>
      </div>

      <div style="display:flex;gap:10px;align-items:center">
        <div class="tiny">Admin Panel</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <div class="search-row">
        <input id="searchInput" class="search-input" placeholder="Search by username, name or email..." />
        <select id="filterSelect" class="filter">
          <option value="pending">Pending Wardens</option>
          <option value="applied">Pending (with application)</option>
          <option value="noapp">Pending (no application)</option>
          <option value="approved">Approved Wardens</option>
          <option value="rejected">Rejected Wardens</option>
        </select>
        <button id="refreshBtn" class="btn" style="background:#111;color:#fff">Refresh</button>
      </div>
      <div id="tipMessage" class="small">Tip: Click Approve to enable warden login. Click Reject to remove the record.</div>
    </div>

    <div id="wardenList">
      <div class="card empty">Loading pending wardens...</div>
    </div>
  </div>

<script>
  // CHANGE THIS if your backend runs elsewhere
  const BASE_URL = 'https://hostel-management-system-2-2x8y.onrender.com';

  const container = document.getElementById('wardenList');
  const searchInput = document.getElementById('searchInput');
  const filterSelect = document.getElementById('filterSelect');
  const refreshBtn = document.getElementById('refreshBtn');
  const tipMessage = document.getElementById('tipMessage');

  let cachedWardens = [];
  let currentView = 'pending';

  refreshBtn.addEventListener('click', loadWardens);
  searchInput.addEventListener('input', applyFilters);
  filterSelect.addEventListener('change', loadWardens);

  async function loadWardens() {
    currentView = filterSelect.value;
    container.innerHTML = `<div class="card empty">Loading ${currentView} wardens...</div>`;
    tipMessage.innerHTML = getTipMessage(currentView);
    searchInput.value = ''; // Clear search when changing view

    let url;
    
    // Determine the primary API URL based on the view type
    if (currentView === 'approved') {
      url = `${BASE_URL}/admin/wardens/approved`; 
    } else if (currentView === 'rejected') {
      url = `${BASE_URL}/admin/wardens/rejected`; 
    } else {
      url = `${BASE_URL}/admin/wardens/pending`;
    }
    
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Failed to fetch: ' + res.status);
      const wardens = await res.json();
      cachedWardens = Array.isArray(wardens) ? wardens : [];
      applyFilters(); 
    } catch (e) {
      container.innerHTML = `<div class="card empty">Could not load wardens. Please check the backend URL and endpoints. ${escapeHtml(e.message)}</div>`;
    }
  }

  function getTipMessage(view) {
      if (view === 'pending' || view === 'applied' || view === 'noapp') {
          return 'Tip: Click Approve to enable warden login. Click Reject to remove the record so they can re-register later.';
      } else if (view === 'approved') {
          return 'This list shows all wardens currently approved and active in the system.';
      } else if (view === 'rejected') {
          return 'This list shows all registration attempts that were rejected (removed) from the system.';
      }
      return '';
  }

  function renderWardens(wardens) {
    container.innerHTML = '';
    const displayView = (currentView === 'applied' || currentView === 'noapp') ? 'pending' : currentView;

    if (!wardens || wardens.length === 0) {
      container.innerHTML = `<div class="card empty">No ${displayView} wardens found.</div>`;
      return;
    }

    wardens.forEach(w => {
      const card = document.createElement('div');
      card.className = 'card';
      
      let controlsHTML = '';
      let metaHTML = `
        <div class="meta"><strong>Username:</strong> ${escapeHtml(w.username)} &nbsp; • &nbsp; <strong>Email:</strong> ${escapeHtml(w.email || '—')}</div>
        <div class="meta" style="margin-top:8px"><strong>Contact:</strong> ${escapeHtml(w.contact || '—')}</div>
      `;

      if (displayView === 'pending') {
        // Pending view needs Approve/Reject buttons and application details
        controlsHTML = `
          <button class="btn approve" onclick="approve('${encodeURIComponent(w.username)}', this)">Approve</button>
          <button class="btn reject" onclick="rejectWarden('${encodeURIComponent(w.username)}', this)">Reject</button>
        `;
        metaHTML += `<div class="meta" style="margin-top:8px"><strong>Applied Role:</strong> ${escapeHtml(w.job_role || '—')} &nbsp; • &nbsp; <strong>Shift:</strong> ${escapeHtml(w.shift || '—')}</div>`;
        metaHTML += `<div class="small" style="margin-top:8px">Applied at: ${w.applied_at ? (new Date(w.applied_at)).toLocaleString() : '—'}</div>`;
      } else if (displayView === 'approved') {
        // Approved view shows status
        controlsHTML = `<div class="btn" style="background:#0ea5a4;color:#fff;pointer-events:none;width:100px;text-align:center;">Approved</div>`;
        metaHTML += `<div class="small" style="margin-top:8px">Approved on: ${w.approved_at ? (new Date(w.approved_at)).toLocaleString() : '—'}</div>`;
      } else if (displayView === 'rejected') {
        // Rejected view shows status
        controlsHTML = `<div class="btn" style="background:#64748b;color:#fff;pointer-events:none;width:100px;text-align:center;">Rejected</div>`;
        metaHTML += `<div class="small" style="margin-top:8px">Rejected on: ${w.rejected_at ? (new Date(w.rejected_at)).toLocaleString() : '—'}</div>`;
      }

      card.innerHTML = `
        <div class="warden-grid">
          <div>
            <h3 style="margin:0 0 6px 0">${escapeHtml(w.fullname || w.username)}</h3>
            ${metaHTML}
          </div>
          <div class="controls">
            ${controlsHTML}
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // Helper function to safely escape HTML
  function escapeHtml(s){
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // Action: Approve Warden
  async function approve(usernameEnc, btn){
    const username = decodeURIComponent(usernameEnc);
    if (!confirm(`Approve warden \"${username}\"?`)) return;
    btn.disabled = true;
    try {
      const res = await fetch(`${BASE_URL}/admin/wardens/${encodeURIComponent(username)}/approve`, { method: 'PATCH' });
      const data = await res.json().catch(()=>({}));
      if (!res.ok) {
        alert(data.message || 'Approve failed');
        btn.disabled = false;
        return;
      }
      alert('Warden approved — they can now login.');
      await loadWardens();
    } catch (e) {
      alert('Network error: ' + e.message);
      btn.disabled = false;
    }
  }

  // Action: Reject Warden (removes the record)
  async function rejectWarden(usernameEnc, btn){
    const username = decodeURIComponent(usernameEnc);
    if (!confirm(`Reject and remove warden \"${username}\"? They will need to re-register.`)) return;
    btn.disabled = true;
    try {
      // Changed to DELETE method for permanent removal, but PATCH works too if the server expects it. 
      // Using PATCH here for compatibility with original script, but DELETE is conceptually better for removal.
      const res = await fetch(`${BASE_URL}/admin/wardens/${encodeURIComponent(username)}/reject`, { method: 'PATCH' });
      const data = await res.json().catch(()=>({}));
      if (!res.ok) {
        alert(data.message || 'Reject failed');
        btn.disabled = false;
        return;
      }
      alert('Warden rejected and removed. They must register again.');
      await loadWardens();
    } catch (e) {
      alert('Network error: ' + e.message);
      btn.disabled = false;
    }
  }

  function applyFilters(){
    const q = (searchInput.value || '').trim().toLowerCase();
    const f = filterSelect.value;
    let list = cachedWardens.slice();

    // Specific filtering for the 'pending' view
    if (currentView === 'pending' || currentView === 'applied' || currentView === 'noapp') {
      if (f === 'applied') list = list.filter(w => w.job_role || w.shift || w.applied_at);
      if (f === 'noapp') list = list.filter(w => !(w.job_role || w.shift || w.applied_at));
    }
    
    // Search filtering for all views
    if (q) {
      list = list.filter(w => {
        const s = `${w.username||''} ${w.fullname||''} ${w.email||''} ${w.contact||''}`.toLowerCase();
        return s.indexOf(q) !== -1;
      });
    }

    renderWardens(list);
  }

  // initial load
  loadWardens();
</script>
</body>
</html>
