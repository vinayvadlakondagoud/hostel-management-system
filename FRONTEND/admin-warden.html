<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Warden Approvals</title>
  <style>
    :root {
      --primary: #3b82f6;
      --accent: #10b981;
      --danger: #ef4444;
      --gray: #6b7280;
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #1f2937;
      --radius: 14px;
      --shadow: 0 8px 30px rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: linear-gradient(to right, var(--primary), var(--accent));
      color: white;
      padding: 60px 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    header h1 {
      margin: 0;
      font-size: 2.7rem;
      font-weight: bold;
    }
    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 25px;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
    }
    .card:hover {
      transform: scale(1.01);
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
    }
    .card h3 {
      margin: 0 0 10px;
      font-size: 1.4rem;
      color: var(--primary);
    }
    .card p {
      margin: 4px 0;
      font-size: 0.96rem;
    }
    .btn-group {
      margin-top: 14px;
    }
    .btn-group button {
      padding: 10px 18px;
      border-radius: var(--radius);
      border: none;
      margin-right: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-approve { background: var(--primary); color: white; }
    .btn-approve:hover { background: #2563eb; }
    .btn-reject { background: var(--danger); color: white; }
    .btn-reject:hover { background: #dc2626; }
    .btn-delete { background: var(--gray); color: white; }
    .btn-delete:hover { background: #374151; }
    footer {
      text-align: center;
      margin-top: 60px;
      padding: 30px 20px;
      font-size: 0.9rem;
      color: var(--gray);
    }
  </style>
</head>
<body>
  <header>
    <h1>Admin Panel – Approve Wardens</h1>
  </header>

  <main class="container" id="wardenList"></main>

  <footer>
    &copy; 2025 Hostel Management Admin Portal. All rights reserved.
  </footer>

  <script>
    const wardenList = [
      {
        id: 1,
        name: "Ramesh Kumar",
        username: "rameshK",
        email: "ramesh@hostel.edu",
        department: "Maintainance Department",
        shift: "Night",
        salary: "₹15000",
        status: "pending"
      },
      {
        id: 2,
        name: "Preeti Mishra",
        username: "preetiM",
        email: "preeti@hostel.edu",
        department: "Kitchen Department",
        shift: "Morning",
        salary: "₹18000",
        status: "pending"
      }
    ];

    const container = document.getElementById('wardenList');

    function renderWardens() {
      container.innerHTML = '';
      wardenList.forEach((warden, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3>${warden.name}</h3>
          <p><strong>Username:</strong> ${warden.username}</p>
          <p><strong>Email:</strong> ${warden.email}</p>
          <p><strong>Department:</strong> ${warden.department}</p>
          <p><strong>Shift:</strong> ${warden.shift}</p>
          <p><strong>Salary:</strong> ${warden.salary}</p>
          <p><strong>Status:</strong> <span id="status-${idx}">${warden.status}</span></p>
          <div class="btn-group">
            <button class="btn-approve" onclick="approveWarden(${idx})">Approve</button>
            <button class="btn-reject" onclick="rejectWarden(${idx})">Reject</button>
            <button class="btn-delete" onclick="deleteWarden(${idx})">Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function approveWarden(i) {
      wardenList[i].status = 'approved';
      alert(`${wardenList[i].name} approved. Warden-login enabled.`);
      renderWardens();
    }

    function rejectWarden(i) {
      wardenList[i].status = 'rejected';
      alert(`${wardenList[i].name} rejected. Login disabled.`);
      renderWardens();
    }

    function deleteWarden(i) {
      const name = wardenList[i].name;
      wardenList.splice(i, 1);
      alert(`${name}'s data deleted.`);
      renderWardens();
    }

    renderWardens();
  </script>
</body>
</html>
