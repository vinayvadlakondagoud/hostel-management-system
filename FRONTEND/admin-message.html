<!-- admin-message.html -->
<!doctype html>
<html>
<head><meta charset="utf-8"/></head>
<body>
  <h2>Admin — Messages</h2>

  <label>To:
    <select id="toType">
      <option value="warden:education">Warden — Education</option>
      <option value="warden:kitchen">Warden — Kitchen</option>
      <option value="warden:maintenance">Warden — Maintenance</option>
      <option value="user:">Specific User</option>
    </select>
  </label>

  <select id="userDropdown" style="display:none"></select>

  <input id="subject"/>
  <textarea id="message"></textarea>
  <button id="sendBtn">Send</button>

  <h3>Inbox (messages to admin)</h3>
  <div id="inbox"></div>

<script>
const API = 'https://hostel-management-system-2-2x8y.onrender.com';
const me = { role: 'admin', username: 'admin' };

const toType = document.getElementById('toType');
const userDropdown = document.getElementById('userDropdown');

toType.addEventListener('change', () => {
  userDropdown.style.display = toType.value.startsWith('user:') ? 'inline' : 'none';
});

async function populateUsers() {
  const r = await fetch(API + '/users'); // exists in your server.js
  const users = await r.json();
  userDropdown.innerHTML = users.map(u => `<option value="${u.username}">${u.username} — ${u.email}</option>`).join('');
}
populateUsers();

document.getElementById('sendBtn').addEventListener('click', async () => {
  const parts = toType.value.split(':');
  const recipient_role = parts[0];
  const recipient_subrole = parts[1] || null;
  const recipient_username = recipient_role === 'user' ? userDropdown.value : null;
  const body = {
    sender_role: me.role,
    sender_username: me.username,
    recipient_role, recipient_username, recipient_subrole,
    subject: document.getElementById('subject').value,
    message: document.getElementById('message').value
  };
  const res = await fetch(API + '/messages', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  alert((await res.json()).message || 'Sent');
  loadInbox();
});

async function loadInbox() {
  const r = await fetch(API + '/messages?recipient_role=admin');
  const ms = await r.json();
  document.getElementById('inbox').innerHTML = ms.map(m=>`<div><b>${m.subject||''}</b> <small>from ${m.sender_role}/${m.sender_username}</small><p>${m.message}</p></div>`).join('<hr/>');
}
loadInbox();
</script>
</body>
</html>
