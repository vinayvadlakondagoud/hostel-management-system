<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Messages - Hostel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom CSS for a professional look and effects */
    .card-effect {
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card-effect:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    .received-message {
      background-color: #f0f9ff; /* Light Blue */
      border-left: 4px solid #3b82f6; /* Blue-500 */
    }
    .sent-message {
      background-color: #fefce8; /* Light Yellow */
      border-right: 4px solid #fbbf24; /* Amber-400 */
      text-align: right; /* Align content to the right for sent messages */
    }
    .sent-message .text-left {
      text-align: right;
    }
    .sent-message .from-to {
      display: block;
    }
    .sent-message .from-to .text-xs {
        margin-right: 0.5rem; /* Adjust spacing for right alignment */
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">
  <div class="max-w-6xl mx-auto py-8 px-4">
    <header class="flex items-center justify-between mb-8 pb-4 border-b-2 border-blue-200">
      <h1 class="text-3xl font-extrabold text-slate-800 flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mr-3 text-blue-600" viewBox="0 0 20 20" fill="currentColor">
          <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
          <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
        </svg>
        Admin Message Center
      </h1>
      <a href="admin-home.html" class="text-sm font-semibold text-blue-600 hover:text-blue-800 transition duration-150">← Back to Admin Dashboard</a>
    </header>

    <section class="bg-white shadow-lg rounded-xl p-6 mb-8 card-effect">
      <h2 class="text-xl font-bold mb-4 text-slate-700 border-b pb-2">Compose New Message</h2>

      <div class="grid gap-4 md:grid-cols-3">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Send To</label>
          <select id="adminRecipientType"
                  class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition duration-150">
            </select>
        </div>
        <div id="adminRecipientContainer" class="hidden">
          <label class="block text-sm font-medium text-slate-600 mb-1">Recipient Name/ID</label>
          <select id="adminRecipient"
                  class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition duration-150">
            </select>
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-slate-600 mb-1">Message Content</label>
          <textarea id="adminMessageContent" rows="3"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition duration-150"
                    placeholder="Type your message here..."></textarea>
        </div>
      </div>
      <div class="flex justify-end mt-4">
        <button id="adminSendMessageBtn"
                class="bg-blue-600 text-white font-semibold py-2 px-6 rounded-lg shadow-md hover:bg-blue-700 transition duration-300 transform hover:scale-105">
          Send Message
        </button>
      </div>
      <p id="adminSendStatus" class="mt-3 text-sm font-medium text-center"></p>
    </section>

    <section class="mb-8">
      <h2 class="text-2xl font-bold text-slate-800 mb-4 border-b pb-2 border-slate-300">
        <span class="text-blue-600 mr-2">📥</span> Received Messages
      </h2>
      <div id="receivedAdminMessagesList" class="space-y-4">
        </div>
    </section>

    <section>
      <h2 class="text-2xl font-bold text-slate-800 mb-4 border-b pb-2 border-slate-300">
        <span class="text-amber-500 mr-2">📤</span> Sent Messages
      </h2>
      <div id="sentAdminMessagesList" class="space-y-4">
        </div>
    </section>
  </div>

  <script>
    const API = "https://hostel-management-system-2-2x8y.onrender.com"; // Replace with your actual API endpoint
    const adminUsername = localStorage.getItem('username') || 'admin';

    /**
     * Helper to create a user label from role and username.
     */
    function labelFromRole(role, warden_role, username) {
      if (role === 'admin') return 'Admin';
      if (role === 'warden') return `Warden (${warden_role.charAt(0).toUpperCase() + warden_role.slice(1)})`;
      return username || 'Student'; // Default for user
    }

    /**
     * Renders messages into the separate received/sent lists.
     * @param {Array} list - Array of message objects.
     */
    function renderAdminMessages(list) {
      const receivedList = document.getElementById("receivedAdminMessagesList");
      const sentList = document.getElementById("sentAdminMessagesList");

      receivedList.innerHTML = '';
      sentList.innerHTML = '';

      if (!list || list.length === 0) {
        receivedList.innerHTML = '<p class="text-slate-500 text-base py-4 text-center">No received messages yet.</p>';
        sentList.innerHTML = '<p class="text-slate-500 text-base py-4 text-center">No sent messages yet.</p>';
        return;
      }

      list.forEach(m => {
        // Check if the message was sent by the currently logged-in admin
        const isSent = m.sender_role === 'admin' && m.sender_username === adminUsername;

        const targetList = isSent ? sentList : receivedList;

        const div = document.createElement("div");
        div.className = `border rounded-lg px-4 py-3 flex justify-between items-start gap-3 shadow-sm card-effect ${isSent ? 'sent-message' : 'received-message'}`;

        const from = labelFromRole(m.sender_role, m.sender_warden_role, m.sender_username);
        const to   = labelFromRole(m.recipient_role, m.recipient_warden_role, m.recipient_username);
        const ts   = new Date(m.created_at);

        // Determine the display based on sent/received
        const fromToHtml = isSent 
          ? `<span class="text-xs text-slate-400">To ${to}</span> <span class="font-semibold text-slate-800">${from}</span>` 
          : `<span class="font-semibold text-slate-800">${from}</span> <span class="text-xs text-slate-400">→ ${to}</span>`;


        div.innerHTML = `
          <div>
            <div class="font-medium text-slate-800 mb-1 from-to ${isSent ? 'text-right' : 'text-left'}">${fromToHtml}</div>
            <div class="mt-1 text-slate-700 ${isSent ? 'text-right' : 'text-left'}">${(m.content || "").replace(/\\n/g, "<br>")}</div>
            <div class="text-xs text-slate-500 mt-2 ${isSent ? 'text-right' : 'text-left'}">${ts.toLocaleString()}</div>
          </div>
        `;
        targetList.appendChild(div);
      });

      // Add 'No messages' placeholder if a list is empty after filtering
      if(receivedList.childElementCount === 0) {
          receivedList.innerHTML = '<p class="text-slate-500 text-base py-4 text-center">No received messages yet.</p>';
      }
      if(sentList.childElementCount === 0) {
          sentList.innerHTML = '<p class="text-slate-500 text-base py-4 text-center">No sent messages yet.</p>';
      }
    }

    // --- Message Loading and Sending Logic ---
    async function loadAdminMessages() {
      try {
        const url = `${API}/messages?viewer_role=admin&viewer_username=${encodeURIComponent(adminUsername)}`;
        const res = await fetch(url);
        const data = await res.json().catch(() => []);
        renderAdminMessages(data);
      } catch (e) {
        console.error("Error loading messages:", e);
        document.getElementById("receivedAdminMessagesList").innerHTML = '<p class="text-red-500 text-sm py-4 text-center">Failed to load messages.</p>';
        document.getElementById("sentAdminMessagesList").innerHTML = '<p class="text-red-500 text-sm py-4 text-center"></p>';
      }
    }

    async function loadRecipients() {
        const typeSelect = document.getElementById('adminRecipientType');
        const userSelect = document.getElementById('adminRecipient');
        const container = document.getElementById('adminRecipientContainer');

        const options = [
            { value: '', text: 'Select Recipient Type', disabled: true, selected: true },
            { value: 'user', text: 'Specific Student' },
            { value: 'warden-kitchen', text: 'Warden (Kitchen)' },
            { value: 'warden-education', text: 'Warden (Education)' },
            { value: 'warden-maintenance', text: 'Warden (Maintenance)' },
        ];
        
        typeSelect.innerHTML = '';
        options.forEach(optData => {
            const option = document.createElement('option');
            option.value = optData.value;
            option.textContent = optData.text;
            if (optData.disabled) option.disabled = true;
            if (optData.selected) option.selected = true;
            typeSelect.appendChild(option);
        });

        // Event listener to show/hide and load specific user list
        typeSelect.addEventListener('change', async () => {
            if (typeSelect.value === 'user') {
                container.classList.remove('hidden');
                userSelect.innerHTML = '<option value="">Loading students...</option>';
                try {
                    // Fetch students (users)
                    const res = await fetch(API + "/users?viewer_role=admin");
                    const users = await res.json().catch(() => []);
                    
                    userSelect.innerHTML = '';
                    const studentOptions = [{ value: '', text: 'Select Student Username', disabled: true, selected: true }];
                    users.filter(u => u.role === 'user').forEach(u => 
                        studentOptions.push({ value: u.username, text: u.username })
                    );

                    studentOptions.forEach(optData => {
                        const option = document.createElement('option');
                        option.value = optData.value;
                        option.textContent = optData.text;
                        if (optData.disabled) option.disabled = true;
                        if (optData.selected) option.selected = true;
                        userSelect.appendChild(option);
                    });

                } catch (e) {
                    console.error("Error loading students:", e);
                    userSelect.innerHTML = '<option value="">Failed to load students</option>';
                }
            } else {
                container.classList.add('hidden');
            }
        });
    }

    async function sendMessage() {
        const recipientType = document.getElementById('adminRecipientType').value;
        const recipientUsername = document.getElementById('adminRecipient').value;
        const content = document.getElementById('adminMessageContent').value.trim();
        const sendStatus = document.getElementById('adminSendStatus');

        if (!recipientType || !content || (recipientType === 'user' && !recipientUsername)) {
            sendStatus.className = 'mt-3 text-sm font-medium text-red-600 text-center';
            sendStatus.textContent = 'Please select a recipient, name (if needed), and enter a message.';
            return;
        }

        sendStatus.className = 'mt-3 text-sm font-medium text-blue-600 text-center';
        sendStatus.textContent = 'Sending message...';
        document.getElementById('adminSendMessageBtn').disabled = true;

        let recipient_role = '';
        let recipient_warden_role = '';
        let recipient_username_final = '';

        if (recipientType === 'user') {
            recipient_role = 'user';
            recipient_username_final = recipientUsername;
        } else if (recipientType.startsWith('warden-')) {
            recipient_role = 'warden';
            recipient_warden_role = recipientType.split('-')[1]; 
        } else {
            sendStatus.className = 'mt-3 text-sm font-medium text-red-600 text-center';
            sendStatus.textContent = 'Invalid recipient type selected.';
            document.getElementById('adminSendMessageBtn').disabled = false;
            return;
        }


        try {
            const payload = {
                sender_role: 'admin',
                sender_username: adminUsername,
                recipient_role: recipient_role,
                recipient_warden_role: recipient_warden_role,
                recipient_username: recipient_username_final,
                content: content
            };

            const res = await fetch(API + "/messages", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                sendStatus.className = 'mt-3 text-sm font-medium text-green-600 text-center';
                sendStatus.textContent = 'Message sent successfully!';
                document.getElementById('adminMessageContent').value = ''; // Clear content
                // Reset select if needed, but keeping it simple for now
                await loadAdminMessages(); // Refresh message list
            } else {
                const error = await res.json().catch(() => ({ message: 'Server error' }));
                throw new Error(error.message);
            }
        } catch (e) {
            console.error("Message send error:", e);
            sendStatus.className = 'mt-3 text-sm font-medium text-red-600 text-center';
            sendStatus.textContent = `Failed to send message: ${e.message || 'Check console.'}`;
        } finally {
            document.getElementById('adminSendMessageBtn').disabled = false;
        }
    }

    // Attach event listeners and load data on DOMContentLoaded
    document.addEventListener("DOMContentLoaded", () => {
      loadAdminMessages();
      loadRecipients();
      document.getElementById('adminSendMessageBtn').addEventListener('click', sendMessage);
    });
  </script>
</body>
</html>
