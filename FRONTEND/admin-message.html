<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Messages - Hostel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="max-w-6xl mx-auto py-6 px-4">
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Admin Messages</h1>
      <a href="admin-home.html" class="text-sm text-blue-600 hover:underline">← Back to Admin Dashboard</a>
    </header>

    <!-- New Message -->
    <section class="bg-white shadow rounded-xl p-4 mb-6">
      <h2 class="text-lg font-semibold mb-3 text-slate-800">Send Message</h2>

      <div class="grid gap-3 md:grid-cols-3 mb-3">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Send To</label>
          <select id="adminRecipientType"
                  class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring focus:ring-blue-200">
            <option value="">Select recipient</option>
            <option value="user">User (Student)</option>
            <option value="warden-education">Warden - Education</option>
            <option value="warden-kitchen">Warden - Kitchen</option>
            <option value="warden-maintenance">Warden - Maintenance</option>
          </select>
        </div>

        <div id="userSelectWrapper" class="hidden md:col-span-2">
          <label class="block text-sm font-medium text-slate-600 mb-1">Select User</label>
          <select id="adminUserSelect"
                  class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring focus:ring-blue-200">
            <option value="">Loading...</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Message</label>
        <textarea id="adminMessageInput"
                  rows="3"
                  class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring focus:ring-blue-200"
                  placeholder="Type your message here..."></textarea>
      </div>

      <div class="mt-3 flex justify-end">
        <button id="adminSendBtn"
                class="px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white hover:bg-blue-700">
          Send
        </button>
      </div>
      <p id="adminMsgStatus" class="text-xs mt-2 text-slate-500"></p>
    </section>

    <!-- History -->
    <section class="bg-white shadow rounded-xl p-4">
      <div class="flex items-center justify-between mb-3">
  <h2 class="text-lg font-semibold text-slate-800">Conversation History</h2>
  <div class="flex items-center gap-2">
    <div class="space-x-1">
      <button id="tabAdminInbox" class="px-3 py-1 rounded-lg border border-slate-300 bg-white text-sm">Inbox</button>
      <button id="tabAdminSent"  class="px-3 py-1 rounded-lg border border-slate-300 text-sm">Sent</button>
    </div>
    <button id="refreshBtn" class="text-xs px-3 py-1 rounded-lg border border-slate-300 hover:bg-slate-50">
      Refresh
    </button>
  </div>
</div>
      <div id="adminMessagesList" class="space-y-3 max-h-[500px] overflow-y-auto text-sm"></div>
    </section>
  </div>

<script>
const API = "https://hostel-management-system-2-2x8y.onrender.com";
const ADMIN_USERNAME = "admin"; // fixed admin as per your requirement

const adminRecipientType = document.getElementById("adminRecipientType");
const userSelectWrapper = document.getElementById("userSelectWrapper");
const adminUserSelect = document.getElementById("adminUserSelect");
const adminMessageInput = document.getElementById("adminMessageInput");
const adminSendBtn = document.getElementById("adminSendBtn");
const adminMsgStatus = document.getElementById("adminMsgStatus");
const adminMessagesList = document.getElementById("adminMessagesList");
const adminRefreshBtn = document.getElementById("adminRefreshBtn");

adminRecipientType.addEventListener("change", () => {
  const val = adminRecipientType.value;
  if (val === "user") {
    userSelectWrapper.classList.remove("hidden");
    loadUsersForDropdown();
  } else {
    userSelectWrapper.classList.add("hidden");
  }
});

async function loadUsersForDropdown() {
  try {
    const res = await fetch(API + "/users");
    const data = await res.json().catch(() => []);
    adminUserSelect.innerHTML = '<option value="">Select user</option>';
    data.forEach(u => {
      const opt = document.createElement("option");
      opt.value = u.username;
      opt.textContent = u.username + (u.email ? ` (${u.email})` : "");
      adminUserSelect.appendChild(opt);
    });
  } catch (err) {
    console.error("loadUsersForDropdown error", err);
    adminUserSelect.innerHTML = '<option value="">Failed to load users</option>';
  }
}

function getAdminRecipientInfo() {
  const val = adminRecipientType.value;
  if (!val) return null;

  if (val === "user") {
    const user = adminUserSelect.value;
    if (!user) return null;
    return {
      recipient_role: "user",
      recipient_username: user,
      recipient_warden_role: null
    };
  }

  if (val === "warden-education") {
    return { recipient_role: "warden", recipient_username: null, recipient_warden_role: "education" };
  }
  if (val === "warden-kitchen") {
    return { recipient_role: "warden", recipient_username: null, recipient_warden_role: "kitchen" };
  }
  if (val === "warden-maintenance") {
    return { recipient_role: "warden", recipient_username: null, recipient_warden_role: "maintenance" };
  }
  return null;
}

async function adminSendMessage() {
  adminMsgStatus.textContent = "";
  const rec = getAdminRecipientInfo();
  const content = adminMessageInput.value.trim();

  if (!rec) {
    adminMsgStatus.style.color = "red";
    adminMsgStatus.textContent = "Please select a valid recipient.";
    return;
  }
  if (!content) {
    adminMsgStatus.style.color = "red";
    adminMsgStatus.textContent = "Message cannot be empty.";
    return;
  }

  adminSendBtn.disabled = true;
  adminSendBtn.textContent = "Sending...";

  try {
    const res = await fetch(API + "/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sender_role: "admin",
        sender_username: ADMIN_USERNAME,
        sender_warden_role: null,
        recipient_role: rec.recipient_role,
        recipient_username: rec.recipient_username,
        recipient_warden_role: rec.recipient_warden_role,
        content
      })
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || "Failed to send");

    adminMsgStatus.style.color = "green";
    adminMsgStatus.textContent = "Message sent.";
    adminMessageInput.value = "";
    await loadAdminMessages();
  } catch (err) {
    console.error("adminSendMessage error", err);
    adminMsgStatus.style.color = "red";
    adminMsgStatus.textContent = err.message || "Error sending message.";
  } finally {
    adminSendBtn.disabled = false;
    adminSendBtn.textContent = "Send";
  }
}

function labelFromRole(role, wardenRole, username) {
  role = (role || "").toLowerCase();
  const w = (wardenRole || "").toLowerCase();
  if (role === "admin") return "Admin";
  if (role === "user") return username || "User";
  if (role === "warden") {
    if (w === "education") return "Warden - Education";
    if (w === "kitchen") return "Warden - Kitchen";
    if (w === "maintenance") return "Warden - Maintenance";
    return "Warden";
  }
  return username || "Unknown";
}

function renderAdminMessages(list) {
  const inboxList = [];
  const sentList = [];
  if (!list || list.length === 0) {
    adminMessagesList.innerHTML = '<p class="text-slate-400 text-sm">No messages yet.</p>';
    return;
  }

  list.forEach(m => {
    const recIsAdmin = (m.recipient_role === 'admin');
    const sentIsAdmin = (m.sender_role === 'admin');
    if (sentIsAdmin) sentList.push(m);
    else if (recIsAdmin) inboxList.push(m);
    else inboxList.push(m); // show other relevant messages in inbox
  });

  function makeHtml(arr) {
    if (!arr || arr.length === 0) return '<p class="text-slate-400 text-sm">No messages here.</p>';
    return arr.map(m => {
      const from = labelFromRole(m.sender_role, m.sender_warden_role, m.sender_username);
      const to = labelFromRole(m.recipient_role, m.recipient_warden_role, m.recipient_username);
      const ts = new Date(m.created_at).toLocaleString();
      const body = (m.content || "").replace(/\n/g, "<br>");
      return `<div class="border rounded-lg px-3 py-2">
                <div class="font-semibold text-slate-800">${from} <span class="text-xs text-slate-400">→ ${to}</span></div>
                <div class="mt-1 text-slate-700">${body}</div>
                <div class="text-xs text-slate-500 mt-1">${ts}</div>
              </div>`;
    }).join("");
  }

  adminMessagesList.innerHTML = `
    <div id="adminInboxContainer" class="space-y-3">${makeHtml(inboxList)}</div>
    <div id="adminSentContainer" class="space-y-3 hidden">${makeHtml(sentList)}</div>
  `;

  // tab events (add these IDs to the header buttons)
  document.getElementById("tabAdminInbox").onclick = () => {
    document.getElementById("adminInboxContainer").classList.remove("hidden");
    document.getElementById("adminSentContainer").classList.add("hidden");
  };
  document.getElementById("tabAdminSent").onclick = () => {
    document.getElementById("adminSentContainer").classList.remove("hidden");
    document.getElementById("adminInboxContainer").classList.add("hidden");
  };
}

async function loadAdminMessages() {
  try {
    const res = await fetch(API + "/messages?viewer_role=admin");
    const data = await res.json().catch(() => []);
    renderAdminMessages(data);
  } catch (err) {
    console.error("loadAdminMessages error", err);
    adminMessagesList.innerHTML = '<p class="text-red-500 text-sm">Failed to load messages.</p>';
  }
}

adminSendBtn.addEventListener("click", adminSendMessage);
adminRefreshBtn.addEventListener("click", loadAdminMessages);

// initial
loadAdminMessages();
</script>
</body>
</html>
