<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Feedback Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .card {
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0px 3px 25px rgba(0,0,0,0.09);
      padding: 22px;
      transition: 0.25s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0px 6px 30px rgba(0,0,0,0.14);
    }
    .tag {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 100px;
    }
    .tag-green { background:#dcfce7; color:#166534; }
    .tag-yellow { background:#fef9c3; color:#854d0e; }
    .tag-red { background:#fee2e2; color:#991b1b; }
  </style>
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- ─────────────────────────── NAV BAR ─────────────────────────── -->
  <header class="bg-gradient-to-r from-blue-800 to-blue-600 text-white py-4 shadow-xl">
    <div class="container mx-auto flex justify-between items-center px-5">
      <div class="flex items-center gap-3">
        <div class="bg-white/20 w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold">
          ⚙️
        </div>
        <div>
          <h1 class="text-xl font-bold">Admin Feedback Dashboard</h1>
          <p class="text-sm opacity-80">Manage all user reviews here</p>
        </div>
      </div>

      
    </div>
  </header>

  <!-- ─────────────────────────── MAIN CONTENT ─────────────────────────── -->
  <div class="container mx-auto px-5 pt-10 pb-20">

    <!-- Top Controls -->
    <div class="flex flex-col md:flex-row justify-between mb-8 gap-4">

      <input 
        id="searchBox"
        type="text" 
        placeholder="Search feedback by name or comment…" 
        class="w-full md:w-1/2 px-4 py-3 rounded-lg border shadow-sm focus:outline-blue-600"
      >

      <div class="flex gap-3">
        <button id="exportBtn"
          class="px-5 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-semibold">
          Export JSON
        </button>

        <button id="clearAll"
          class="px-5 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 font-semibold">
          Delete All
        </button>
      </div>

    </div>

    <!-- Feedback List -->
    <div id="list" class="space-y-5"></div>

  </div>

  <!-- ─────────────────────────── SCRIPT ─────────────────────────── -->
  <script>
    const KEY = 'hms_feedbacks_v1';

    const load = () => JSON.parse(localStorage.getItem(KEY) || '[]');
    const save = (d) => localStorage.setItem(KEY, JSON.stringify(d));

    // Escape HTML safely
    const esc = (s) => String(s||'').replace(/</g,"&lt;").replace(/>/g,"&gt;");

    // Rating stars
    const stars = (n) => "★".repeat(n) + "☆".repeat(5-n);

    function renderList(filter="") {
      const wrap = document.getElementById("list");
      let arr = load();

      // Apply search filter
      if(filter.trim() !== ""){
        arr = arr.filter(f =>
          (f.name||"").toLowerCase().includes(filter.toLowerCase()) ||
          (f.comment||"").toLowerCase().includes(filter.toLowerCase())
        );
      }

      wrap.innerHTML = "";

      if(arr.length === 0){
        wrap.innerHTML = `<p class="text-gray-600 text-center text-lg">No feedback found</p>`;
        return;
      }

      arr.sort((a,b)=> b.id - a.id);

      arr.forEach(f => {
        const canShow = f.rating > 3;
        const tag = f.rating > 4 ? "tag-green" : f.rating === 4 ? "tag-yellow" : "tag-red";
        const tagLabel = f.rating > 4 ? "Excellent" : f.rating === 4 ? "Good" : "Low Rating";

        const box = document.createElement("div");
        box.className = "card";

        box.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h2 class="text-lg font-semibold">${esc(f.name)}</h2>
              <div class="text-sm text-gray-500">${new Date(f.created).toLocaleString()}</div>
            </div>

            <div class="text-yellow-500 text-xl">${stars(f.rating)}</div>
          </div>

          <p class="mt-4 text-gray-700">${esc(f.comment)}</p>

          <div class="flex items-center gap-3 mt-5">
            <span class="tag ${tag}">${tagLabel}</span>

            <label class="flex items-center gap-2">
              <input type="checkbox" data-id="${f.id}" class="toggleShow" 
                ${f.show ? "checked" : ""} 
                ${canShow ? "" : "disabled"} >
              <span class="text-sm">Show on Homepage</span>
            </label>

            <button data-id="${f.id}" class="deleteBtn ml-auto px-4 py-2 rounded-lg border">
              Delete
            </button>
          </div>
        `;

        wrap.appendChild(box);
      });

      bindEvents();
    }

    function bindEvents(){
      document.querySelectorAll(".deleteBtn").forEach(btn=>{
        btn.onclick = () => {
          if(confirm("Delete this feedback?")){
            let arr = load().filter(x => x.id != btn.dataset.id);
            save(arr);
            renderList();
          }
        }
      });

      document.querySelectorAll(".toggleShow").forEach(ch=>{
        ch.onchange = () => {
          let arr = load();
          let i = arr.findIndex(x=>x.id == ch.dataset.id);

          if(i === -1) return;

          if(arr[i].rating <= 3){
            alert("Only ratings above 3 can be published.");
            ch.checked = false;
            return;
          }

          arr[i].show = ch.checked;
          save(arr);
        }
      });
    }

    // Export JSON
    document.getElementById("exportBtn").onclick = () => {
      const a = load();
      const blob = new Blob([JSON.stringify(a,null,2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "feedbacks.json";
      link.click();
    };

    // Clear all
    document.getElementById("clearAll").onclick = () => {
      if(confirm("Delete ALL feedbacks?")){
        localStorage.removeItem(KEY);
        renderList();
      }
    };

    // Live search
    document.getElementById("searchBox").oninput = (e) => {
      renderList(e.target.value);
    };

    // Initial load
    renderList();
  </script>

</body>
</html>
