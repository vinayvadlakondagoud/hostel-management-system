<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Warden Visitor Logs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      /* Professional Color Palette */
      --primary: #1e40af; /* Deep Blue for main actions */
      --secondary: #047857; /* Deep Green accent */
      --bg: #f4f6f9; /* Light Grey/Blue background */
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }
    body{ 
      font-family:'Inter', system-ui, Arial; 
      background:var(--bg); 
      padding:28px 16px; 
      color:var(--text); 
      line-height:1.6;
    }
    .container{ 
      max-width:1100px; 
      margin:0 auto; 
    }
    .header{ 
      display:flex; 
      align-items:center; 
      justify-content:space-between; 
      gap:16px; 
      margin-bottom:24px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .brand { 
      display:flex; 
      gap:12px; 
      align-items:center; 
    }
    .logo{ 
      width:40px; 
      height:40px; 
      border-radius:8px; 
      background:linear-gradient(135deg, var(--primary), #3b82f6); 
      color:#fff; 
      display:grid; 
      place-items:center; 
      font-weight:800; 
      font-size: 18px;
    }
    .links a{ 
      margin-left:16px; 
      text-decoration:none; 
      color:var(--primary); 
      font-weight:600; 
      transition: color 0.2s;
    }
    .links a:hover {
      color: var(--secondary);
    }
    .card{ 
      background:var(--card); 
      padding:24px; 
      border-radius:12px; 
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.04);
      transition: transform 0.3s ease;
    }
    .card:hover {
       transform: translateY(-2px);
    }
    table{ 
      width:100%; 
      border-collapse:collapse; 
      margin-top:20px; 
      border-radius: 8px;
      overflow: hidden; /* For rounded corners on the table */
    }
    th, td{ 
      text-align:left; 
      padding:14px 16px; 
      border-bottom:1px solid var(--border); 
      font-size:14px; 
    }
    th{ 
      background:#f8fafc; 
      font-weight:700; 
      color:var(--text); 
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.05em;
    }
    td:last-child { border-bottom: none; }
    
    .status-success { color: var(--secondary); font-weight:700; }
    .status-failed  { color: #dc2626; font-weight:700; }
    .controls { display:flex; gap:12px; align-items:center; }
    .small { color:var(--muted); font-size:13px; }
    
    .btn { 
      padding:10px 18px; 
      border-radius:8px; 
      border:none; 
      cursor:pointer; 
      background:linear-gradient(90deg, var(--primary), #3b82f6); 
      color:white; 
      font-weight:600; 
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(30, 64, 175, 0.2);
    }
    .btn:hover {
      opacity: 0.9;
      box-shadow: 0 6px 15px rgba(30, 64, 175, 0.4);
      transform: translateY(-1px);
    }
    .filter { 
      padding:10px 12px; 
      border-radius:8px; 
      border:1px solid var(--border); 
      background:white; 
      font-size: 14px;
      color: var(--text);
    }
    .empty { padding:28px; text-align:center; color:var(--muted); }

    /* Back Button Styling */
    .back-nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--primary);
      font-weight: 600;
      border: 1px solid var(--primary);
      background: white;
      transition: all 0.2s ease;
      font-size: 14px;
    }
    .back-btn:hover {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 8px rgba(30, 64, 175, 0.2);
    }
    .back-btn svg {
      width: 18px;
      height: 18px;
      fill: var(--primary);
      transition: fill 0.2s ease;
    }
    .back-btn:hover svg {
      fill: white;
    }

    /* Loading Spinner Animation */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .spinner {
      border: 4px solid var(--border);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .back-nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 10px;
      }
      .controls {
        flex-direction: column;
        align-items: stretch;
        width: 100%;
      }
      .controls .btn, .controls .filter {
        width: 100%;
        margin-top: 8px;
      }
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <!-- Back Button & Branding -->
      <div class="back-nav">
        <!-- Back Button Added (Requirement) -->
        <a href="admin-home.html" class="back-btn" title="Go back to Admin Home">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12.707 19.707L5 12l7.707-7.707a1 1 0 011.414 1.414L7.828 12l6.293 6.293a1 1 0 01-1.414 1.414z"/></svg>
          Back to Admin Home
        </a>

        <!-- Existing Brand -->
        <div class="brand">
          <div class="logo">WV</div>
          <div>
            <div style="font-weight:800; font-size:20px; color:var(--primary);">Warden Visitor Logs</div>
            <div class="small">Detailed log of warden registration & login events.</div>
          </div>
        </div>
      </div>

      <!-- Existing Links -->
      <div class="links">
        <a href="warden-register.html">Warden Register</a>
        <a href="warden-login.html">Warden Login</a>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 16px;">
        <div>
          <div style="font-weight:700; font-size:18px; color:var(--text);">Recent Warden Visitor Events</div>
          <div class="small">Shows username, registered date, login time, status, and source.</div>
        </div>
        <div class="controls">
          <select id="filterStatus" class="filter">
            <option value="">All statuses</option>
            <option value="Success">Success</option>
            <option value="Failure">Failure</option>
          </select>
          <button id="refreshBtn" class="btn">
            <svg style="vertical-align: middle; margin-right: 4px;" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6"/><path d="M2.5 22v-6h6"/><path d="M20.9 11c-.7 4-4.5 7-8.9 7s-8.2-3-8.9-7"/><path d="M3.1 13c.7-4 4.5-7 8.9-7s8.2 3 8.9 7"/></svg>
            Refresh Data
          </button>
        </div>
      </div>

      <div id="tableWrap">
        <table id="logsTable" aria-live="polite">
          <thead>
            <tr>
              <th>Username</th>
              <th>Registered Date</th>
              <th>Login Time</th>
              <th>Status</th>
              <th>Source</th>
            </tr>
          </thead>
          <tbody id="logsBody">
            <!-- Initial loading state will be populated by JS -->
            <tr><td colspan="5" class="empty">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  // Hostname is not stored in a variable because we don't have control over the environment (server URL is fixed)
  const API = 'https://hostel-management-system-2-2x8y.onrender.com/warden-visitor-logs'; // server endpoint to return logs
  const logsBody = document.getElementById('logsBody');
  const refreshBtn = document.getElementById('refreshBtn');
  const filterStatus = document.getElementById('filterStatus');
  let currentLogs = []; // Cache the full log data

  // Helper function to escape HTML for security
  function escapeHtml(s){ 
    if(s==null) return ''; 
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); 
  }

  // Function to fetch logs from the API
  async function fetchLogs() {
    // Show enhanced loading state
    logsBody.innerHTML = `
      <tr>
        <td colspan="5" style="text-align:center;">
          <div class="spinner"></div>
          <div class="small" style="margin-top:10px;">Loading data from server... Please wait.</div>
        </td>
      </tr>
    `;
    
    // Disable refresh button during fetch
    refreshBtn.disabled = true;

    try {
      // Fetch recent 500 by default (as per original logic)
      const res = await fetch(API + '?limit=500');
      if (!res.ok) throw new Error('Failed to fetch logs: ' + res.statusText);
      const data = await res.json();
      
      currentLogs = (data.logs || []);
      // Render the fetched logs, applying the current filter
      renderLogs();
    } catch (err) {
      logsBody.innerHTML = '<tr><td colspan="5" class="empty">Error fetching data. Server error or network problem.</td></tr>';
      console.error('fetchLogs error', err);
    } finally {
      refreshBtn.disabled = false;
    }
  }

  // Function to render logs based on the cached data and current filter
  function renderLogs() {
    const statusFilter = filterStatus.value;
    
    if (!currentLogs || currentLogs.length === 0) {
      logsBody.innerHTML = '<tr><td colspan="5" class="empty">No records found.</td></tr>';
      return;
    }

    // Apply filtering
    const filtered = statusFilter ? currentLogs.filter(r => r.status === statusFilter) : currentLogs;
    
    if (filtered.length === 0) {
      logsBody.innerHTML = '<tr><td colspan="5" class="empty">No records match the selected filter.</td></tr>';
      return;
    }

    // Generate table rows
    logsBody.innerHTML = filtered.map(r => {
      const reg = r.registered_date ? new Date(r.registered_date).toLocaleString() : '-';
      const login = r.login_time ? new Date(r.login_time).toLocaleString() : '-';
      const statusClass = (r.status && r.status.toLowerCase() === 'success') ? 'status-success' : 'status-failed';
      const user = r.username || '(unknown)';
      const src = r.source || '';
      return `<tr>
        <td>${escapeHtml(user)}</td>
        <td>${escapeHtml(reg)}</td>
        <td>${escapeHtml(login)}</td>
        <td class="${statusClass}">${escapeHtml(r.status || '')}</td>
        <td>${escapeHtml(src)}</td>
      </tr>`;
    }).join('');
  }

  // Event listeners
  refreshBtn.addEventListener('click', fetchLogs);
  // Changing the filter now calls renderLogs instead of refetching
  filterStatus.addEventListener('change', renderLogs); 

  // Initial load when the page is ready
  fetchLogs();
</script>
</body>
</html>
