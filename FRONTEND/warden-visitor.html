<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Warden Visitor Logs</title>
  <style>
    :root{
      --bg:#f7fafc; --card:#fff; --muted:#64748b; --accent:#2563eb;
    }
    body{ font-family:Inter,system-ui,Arial; background:var(--bg); padding:28px; color:#0f172a; }
    .container{ max-width:1100px; margin:0 auto; }
    .header{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
    .brand { display:flex; gap:12px; align-items:center; }
    .logo{ width:46px; height:46px; border-radius:10px; background:linear-gradient(135deg,#0ea5a4,#2563eb); color:#fff; display:grid; place-items:center; font-weight:800; }
    .links a{ margin-left:12px; text-decoration:none; color:var(--accent); font-weight:600; }
    .card{ background:var(--card); padding:18px; border-radius:12px; box-shadow:0 8px 20px rgba(16,24,40,0.06); }
    table{ width:100%; border-collapse:collapse; margin-top:12px; }
    th, td{ text-align:left; padding:10px 12px; border-bottom:1px solid #eef2f7; font-size:14px; }
    th{ background:#fbfdff; font-weight:700; color:#0f172a; }
    .status-success { color: #065f46; font-weight:700; }
    .status-failed  { color: #b91c1c; font-weight:700; }
    .controls { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
    .small { color:var(--muted); font-size:13px; }
    .btn { padding:8px 12px; border-radius:8px; border:none; cursor:pointer; background:linear-gradient(90deg,#2563eb,#0ea5a4); color:white; font-weight:700; }
    .filter { padding:8px 10px; border-radius:8px; border:1px solid #e6eef6; background:white; }
    .empty { padding:28px; text-align:center; color:var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <div class="logo">WV</div>
        <div>
          <div style="font-weight:800;">Warden Visitor Logs</div>
          <div class="small">Only warden register & login links shown. Logs stored in DB.</div>
        </div>
      </div>

      <div class="links">
        <a href="warden-register.html">Warden Register</a>
        <a href="warden-login.html">Warden Login</a>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-weight:700; font-size:16px;">Recent Warden Visitor Events</div>
          <div class="small">Shows username, registered date, login time and status.</div>
        </div>
        <div class="controls">
          <select id="filterStatus" class="filter">
            <option value="">All statuses</option>
            <option value="Success">Success</option>
            <option value="Failure">Failure</option>
          </select>
          <button id="refreshBtn" class="btn">Refresh</button>
        </div>
      </div>

      <div id="tableWrap">
        <table id="logsTable" aria-live="polite">
          <thead>
            <tr>
              <th>Username</th>
              <th>Registered Date</th>
              <th>Login Time</th>
              <th>Status</th>
              <th>Source</th>
            </tr>
          </thead>
          <tbody id="logsBody">
            <tr><td colspan="5" class="empty">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  const API = '/warden-visitor-logs'; // server endpoint to return logs
  const logsBody = document.getElementById('logsBody');
  const refreshBtn = document.getElementById('refreshBtn');
  const filterStatus = document.getElementById('filterStatus');

  async function fetchLogs() {
    logsBody.innerHTML = '<tr><td colspan="5" class="empty">Loading...</td></tr>';
    try {
      // fetch recent 500 by default
      const res = await fetch(API + '?limit=500');
      if (!res.ok) throw new Error('Failed to fetch');
      const data = await res.json();
      renderLogs((data.logs || []));
    } catch (err) {
      logsBody.innerHTML = '<tr><td colspan="5" class="empty">Server error / network problem</td></tr>';
      console.error('fetchLogs error', err);
    }
  }

  function renderLogs(rows) {
    const statusFilter = filterStatus.value;
    if (!rows || rows.length === 0) {
      logsBody.innerHTML = '<tr><td colspan="5" class="empty">No records found</td></tr>';
      return;
    }

    const filtered = statusFilter ? rows.filter(r => r.status === statusFilter) : rows;
    if (filtered.length === 0) {
      logsBody.innerHTML = '<tr><td colspan="5" class="empty">No records match filter</td></tr>';
      return;
    }

    logsBody.innerHTML = filtered.map(r => {
      const reg = r.registered_date ? new Date(r.registered_date).toLocaleString() : '-';
      const login = r.login_time ? new Date(r.login_time).toLocaleString() : '-';
      const statusClass = (r.status && r.status.toLowerCase() === 'success') ? 'status-success' : 'status-failed';
      const user = r.username || '(unknown)';
      const src = r.source || '';
      return `<tr>
        <td>${escapeHtml(user)}</td>
        <td>${escapeHtml(reg)}</td>
        <td>${escapeHtml(login)}</td>
        <td class="${statusClass}">${escapeHtml(r.status || '')}</td>
        <td>${escapeHtml(src)}</td>
      </tr>`;
    }).join('');
  }

  function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  refreshBtn.addEventListener('click', fetchLogs);
  filterStatus.addEventListener('change', fetchLogs);

  // initial load
  fetchLogs();
</script>
</body>
</html>
