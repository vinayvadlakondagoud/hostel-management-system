<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Warden Visitor History - Admin</title>
  <link rel="stylesheet" href="visitor.css" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
  <style>
    /* small adjustments so it looks good even if visitor.css isn't changed */
    .pill { background:#eef2ff; padding:6px 10px; border-radius:999px; display:inline-block; font-weight:600; }
    .badge.registered { background:#f0f9ff; color:#0369a1; padding:6px 10px; border-radius:8px; }
    .badge.success { background:#ecfdf5; color:#065f46; padding:6px 10px; border-radius:8px; }
    .badge.failure { background:#fff1f2; color:#9f1239; padding:6px 10px; border-radius:8px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="admin-home.html" style="text-decoration:none; color:inherit;">
      <i class="ri-arrow-left-line" style="font-size:20px"></i>
      <h2>Warden Visitor History</h2>
    </a>
    <div>
      <button onclick="window.location.href='admin-home.html'">
        <i class="ri-logout-box-r-line"></i> Back
      </button>
    </div>
  </nav>

  <main class="content">
    <div class="header-controls" aria-label="Filters">
      <div style="flex:1">
        <div class="helper">Search wardens or pick a date to filter logs</div>
        <input type="text" id="usernameFilter" placeholder="Filter by Warden Username..." oninput="filterLogs()">
      </div>

      <div style="min-width:220px;">
        <div class="helper" style="opacity:0.9">Date</div>
        <input type="date" id="dateFilter" onchange="filterLogs()" />
      </div>

      <div style="display:flex; gap:10px; align-items:center;">
        <button class="btn" id="refreshButton" onclick="fetchWardenLogs()">
          <i class="ri-refresh-line"></i> Refresh
        </button>
        <button class="btn secondary" onclick="downloadCSV()">
          <i class="ri-download-line"></i> Export CSV
        </button>
      </div>
    </div>

    <div class="log-container" role="region" aria-label="Warden visitor logs">
      <table class="log-table" aria-describedby="noLogsMsg">
        <thead>
          <tr>
            <th onclick="sortTable(0)">Username <i class="ri-sort-asc"></i></th>
            <th onclick="sortTable(1)">Registered Date <i class="ri-sort-asc"></i></th>
            <th onclick="sortTable(2)">Event Time <i class="ri-sort-asc"></i></th>
            <th onclick="sortTable(3)">Event Type <i class="ri-sort-asc"></i></th>
            <th onclick="sortTable(4)">Status <i class="ri-sort-asc"></i></th>
          </tr>
        </thead>
        <tbody id="logTableBody">
        </tbody>
      </table>

      <p id="noLogsMsg" style="display:none;">No logs found for the selected filter criteria.</p>
    </div>
  </main>

<script>
  // API paths (adjust if your server base is different)
  const BASE = ''; // relative by default (same origin). If you run API on another origin, change to that origin.

  const logTableBody = document.getElementById('logTableBody');
  const noLogsMsg = document.getElementById('noLogsMsg');
  const usernameFilterInput = document.getElementById('usernameFilter');
  const dateFilterInput = document.getElementById('dateFilter');

  let wardenUserDetails = {}; // { username: registered_at_iso }
  let wardenLogs = [];        // raw logs from /warden-visitor-logs
  let combined = [];          // combined view

  function formatDateTime(t){
    if(!t) return 'N/A';
    const d = new Date(t);
    if(isNaN(d)) return 'Invalid Date';
    return d.toLocaleString();
  }
  function formatDateOnly(t){
    if(!t) return 'N/A';
    const d = new Date(t);
    if(isNaN(d)) return 'Invalid Date';
    return d.toLocaleDateString();
  }

  async function tryFetch(urls){
    for(const u of urls){
      try {
        const r = await fetch(u, { credentials:'include' });
        if(!r.ok) continue;
        const j = await r.json();
        return { url: u, json: j };
      } catch(e){
        console.warn('fetch failed', u, e);
      }
    }
    return null;
  }

  async function fetchWardenLogs(){
    logTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">Loading logs…</td></tr>';
    noLogsMsg.style.display = 'none';

    // try same-origin first, then known hosts
    const apiHosts = ['', 'https://hostel-management-system-1-3c10.onrender.com', 'https://hostel-management-system-2-2x8y.onrender.com'];

    // get warden user details (registered_at)
    const userUrls = apiHosts.map(h => (h ? `${h}/warden-user-details` : '/warden-user-details'));
    const ures = await tryFetch(userUrls);
    if(!ures){
      logTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:#ef4444;">Could not fetch warden user details (API unreachable).</td></tr>';
      return;
    }
    wardenUserDetails = ures.json.users || ures.json || {};

    // get warden visitor logs
    const logUrls = apiHosts.map(h => (h ? `${h}/warden-visitor-logs` : '/warden-visitor-logs'));
    const lres = await tryFetch(logUrls);
    if(!lres){
      logTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:#ef4444;">Could not fetch warden visitor logs (API unreachable).</td></tr>';
      return;
    }
    wardenLogs = lres.json.logs || lres.json || [];

    // merge: ensure registration events shown even if no login exists
    const presentKeys = new Set();
    combined = [];

    wardenLogs.forEach(l => {
      const timeISO = l.event_time ? new Date(l.event_time).toISOString() : new Date().toISOString();
      const key = `${l.username}::${timeISO}::${l.event_type}`;
      presentKeys.add(key);
      combined.push({
        username: l.username,
        registered_at: wardenUserDetails[l.username] || null,
        event_time: timeISO,
        event_type: l.event_type || 'login',
        status: l.status || 'Success'
      });
    });

    // include registration (if present in users list but no explicit registered event)
    Object.keys(wardenUserDetails).forEach(username=>{
      const regISO = wardenUserDetails[username];
      if(!regISO) return;
      const key = `${username}::${new Date(regISO).toISOString()}::registered`;
      if(!presentKeys.has(key)){
        combined.push({
          username,
          registered_at: regISO,
          event_time: regISO,
          event_type: 'registered',
          status: 'Registered'
        });
      }
    });

    combined.sort((a,b)=> new Date(b.event_time) - new Date(a.event_time));
    renderLogs(combined);
  }

  function renderLogs(logs){
    logTableBody.innerHTML = '';
    if(!logs || logs.length === 0){
      noLogsMsg.style.display = 'block';
      return;
    }
    noLogsMsg.style.display = 'none';
    logs.forEach(l=>{
      const row = logTableBody.insertRow();
      const cellUser = row.insertCell(); cellUser.innerHTML = `<span class="pill">${l.username}</span>`;
      const cellReg = row.insertCell(); cellReg.textContent = formatDateOnly(l.registered_at);
      const cellTime = row.insertCell(); cellTime.textContent = formatDateTime(l.event_time);
      const cellType = row.insertCell(); cellType.textContent = (l.event_type || '').toUpperCase();
      const cellStatus = row.insertCell();
      const badge = document.createElement('span');
      badge.className = 'badge ' + (l.status === 'Registered' ? 'registered' : (l.status === 'Failure' ? 'failure' : 'success'));
      badge.textContent = l.status;
      cellStatus.appendChild(badge);
    });
  }

  function filterLogs(){
    const usernameFilter = (usernameFilterInput.value || '').trim().toLowerCase();
    const dateFilter = dateFilterInput.value; // yyyy-mm-dd

    const filtered = combined.filter(l=>{
      const matchesUsername = !usernameFilter || (l.username||'').toLowerCase().includes(usernameFilter);
      let matchesDate = true;
      if(dateFilter){
        const d = new Date(l.event_time).toISOString().split('T')[0];
        matchesDate = d === dateFilter;
      }
      return matchesUsername && matchesDate;
    });
    renderLogs(filtered);
  }

  function downloadCSV(){
    if(!combined || combined.length===0) return alert('No data to export');
    const rows = [['username','registered_at','event_time','event_type','status']];
    combined.forEach(r => rows.push([r.username, r.registered_at, r.event_time, r.event_type, r.status]));
    const csv = rows.map(r => r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'warden-visitor-logs.csv'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 5000);
  }

  // basic client-side sort support (by index)
  let sortDir = {};
  function sortTable(col){
    const keys = ['username','registered_at','event_time','event_type','status'];
    const k = keys[col];
    const dir = sortDir[k] === 'asc' ? 'desc' : 'asc';
    sortDir[k] = dir;
    combined.sort((a,b)=>{
      if(k === 'registered_at' || k === 'event_time'){
        return (dir === 'asc' ? new Date(a[k]) - new Date(b[k]) : new Date(b[k]) - new Date(a[k]));
      }
      const A = (a[k]||'').toString().toLowerCase();
      const B = (b[k]||'').toString().toLowerCase();
      if(A < B) return dir === 'asc' ? -1 : 1;
      if(A > B) return dir === 'asc' ? 1 : -1;
      return 0;
    });
    renderLogs(combined);
  }

  // initial load
  fetchWardenLogs();
</script>
</body>
</html>
