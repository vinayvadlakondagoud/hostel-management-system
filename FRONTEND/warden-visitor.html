<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Visitor History - Warden View</title>
    <link rel="stylesheet" href="visitor.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="admin-home.html" style="text-decoration:none; color:inherit;">
            <i class="ri-arrow-left-line" style="font-size:20px"></i>
            <h2>Visitor History (Warden)</h2>
        </a>
        <div>
            <button onclick="window.location.href='admin-home.html'">
                <i class="ri-logout-box-r-line"></i> Back
            </button>
        </div>
    </nav>

    <main class="content">
        <div class="header-controls" aria-label="Filters">
            <div style="flex:1">
                <div class="helper">Search by username or pick a date to filter logs</div>
                <input type="text" id="usernameFilter" placeholder="Filter by Username..." oninput="filterLogs()">
            </div>

            <div style="min-width:220px;">
                <div class="helper" style="opacity:0.9">Date</div>
                <input type="date" id="dateFilter" onchange="filterLogs()" />
            </div>

            <div style="display:flex; gap:10px; align-items:center;">
                <button class="btn" id="refreshButton" onclick="fetchVisitorLogs()">
                    <i class="ri-refresh-line"></i> Refresh
                </button>
                <button class="btn secondary" onclick="downloadCSV()">
                    <i class="ri-download-line"></i> Export CSV
                </button>
            </div>
        </div>

        <div class="log-container" role="region" aria-label="Visitor logs">
            <table class="log-table" aria-describedby="noLogsMsg">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">Username <i class="ri-sort-asc"></i></th>
                        <th onclick="sortTable(1)">User Type <i class="ri-sort-asc"></i></th>
                        <th onclick="sortTable(2)">Registered Date <i class="ri-sort-asc"></i></th>
                        <th onclick="sortTable(3)">Login Time <i class="ri-sort-asc"></i></th>
                        <th onclick="sortTable(4)">Status <i class="ri-sort-asc"></i></th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                </tbody>
            </table>

            <p id="noLogsMsg" style="display:none;">No logs found for the selected filter criteria.</p>
        </div>
    </main>

    <script>
        // --- State ---
        const logTableBody = document.getElementById('logTableBody');
        const noLogsMsg = document.getElementById('noLogsMsg');
        const usernameFilterInput = document.getElementById('usernameFilter');
        const dateFilterInput = document.getElementById('dateFilter');

        let allLogs = [];        // raw logs from /visitor-logs
        let userDetails = {};    // { username: registered_at_iso }
        let combinedLogs = [];   // merged array (includes registration events)
        let wardensSet = new Set(); // usernames that are wardens (from /admin/wardens/all)

        // Formatting helpers (kept from your visitor.html)
        function formatDateTime(timestamp) {
            if (!timestamp) return 'N/A';
            const d = new Date(timestamp);
            if (isNaN(d)) return 'Invalid Date';
            const opts = { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true };
            return d.toLocaleString('en-US', opts);
        }
        function formatDateOnly(timestamp) {
            if (!timestamp) return 'N/A';
            const d = new Date(timestamp);
            if (isNaN(d)) return 'Invalid Date';
            const opts = { year:'numeric', month:'short', day:'numeric' };
            return d.toLocaleDateString('en-US', opts);
        }

        // helper to try urls in sequence
        async function tryFetchUrls(urls) {
            for (const url of urls) {
                try {
                    const res = await fetch(url, { credentials: 'include' });
                    if (!res.ok) {
                        console.warn(`Request to ${url} returned status ${res.status}`);
                        continue;
                    }
                    const json = await res.json();
                    return { url, json };
                } catch (err) {
                    console.warn(`Fetch to ${url} failed:`, err);
                }
            }
            return null;
        }

        // Main fetch function (visitor logs + user details + wardens)
        async function fetchVisitorLogs() {
            logTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">Loading logs…</td></tr>';
            noLogsMsg.style.display = 'none';

            try {
                const apiHosts = [
                    '', // try same-origin first
                    'https://hostel-management-system-1-3c10.onrender.com',
                    'https://hostel-management-system-2-2x8y.onrender.com'
                ];

                // 1) fetch user-details (from register table)
                const userDetailUrls = apiHosts.map(h => (h ? `${h}/user-details` : '/user-details'));
                const udResult = await tryFetchUrls(userDetailUrls);
                if (!udResult) throw new Error('Could not fetch user details from any known API host.');
                userDetails = udResult.json.users || {};

                // 2) fetch visitor-logs (login events)
                const logUrls = [
                    udResult.url.replace('/user-details','/visitor-logs'),
                    ...apiHosts.map(h => (h ? `${h}/visitor-logs` : '/visitor-logs'))
                ];
                const logsResult = await tryFetchUrls(logUrls);
                if (!logsResult) throw new Error('Could not fetch visitor logs from any known API host.');
                allLogs = logsResult.json.logs || [];

                // 3) fetch wardens list so we can mark userType = 'warden'
                const wardensUrls = apiHosts.map(h => (h ? `${h}/admin/wardens/all` : '/admin/wardens/all'));
                const wardensResult = await tryFetchUrls(wardensUrls);
                wardensSet = new Set();
                if (wardensResult && Array.isArray(wardensResult.json)) {
                    wardensResult.json.forEach(w => {
                        if (w && w.username) wardensSet.add(String(w.username));
                    });
                } else if (wardensResult && wardensResult.json.wardens) {
                    // fallback if endpoint returns { wardens: [...] }
                    (wardensResult.json.wardens || []).forEach(w => { if (w && w.username) wardensSet.add(String(w.username)); });
                } else {
                    // If the admin endpoint isn't available due to CORS or auth, we still continue — assume those not in register are students.
                    console.warn('Wardens endpoint returned unexpected shape; assuming no wardens from that response.');
                }

                // build combined logs with userType
                const presentKeys = new Set();
                combinedLogs = [];

                allLogs.forEach(l => {
                    const loginISO = l.login_time ? new Date(l.login_time).toISOString() : new Date().toISOString();
                    const key = `${l.username}::${loginISO}`;
                    presentKeys.add(key);
                    combinedLogs.push({
                        username: l.username,
                        userType: wardensSet.has(String(l.username)) ? 'warden' : 'student',
                        registered_at: userDetails[l.username] || null,
                        login_time: loginISO,
                        status: l.status || 'Success',
                        type: 'login'
                    });
                });

                // include registration-only events (from register table)
                Object.keys(userDetails).forEach(username => {
                    const regISO = userDetails[username];
                    if (!regISO) return;
                    const key = `${username}::${new Date(regISO).toISOString()}`;
                    if (!presentKeys.has(key)) {
                        combinedLogs.push({
                            username,
                            userType: wardensSet.has(String(username)) ? 'warden' : 'student',
                            registered_at: regISO,
                            login_time: regISO,
                            status: 'Registered',
                            type: 'registered'
                        });
                        presentKeys.add(key);
                    }
                });

                // sort newest first
                combinedLogs.sort((a,b) => new Date(b.login_time) - new Date(a.login_time));
                renderLogs(combinedLogs);

            } catch (err) {
                console.error('Fetch error:', err);
                logTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:#ef4444;">Network or server error fetching logs. Check backend URL and CORS.</td></tr>';
            }
        }

        // Render function (adds User Type column)
        function renderLogs(logs) {
            logTableBody.innerHTML = '';
            if (!logs || logs.length === 0) {
                noLogsMsg.style.display = 'block';
                return;
            }
            noLogsMsg.style.display = 'none';

            logs.forEach(log => {
                const row = logTableBody.insertRow();

                // Username cell (pill)
                const cellUser = row.insertCell();
                const pill = document.createElement('span');
                pill.className = 'pill';
                pill.textContent = log.username || 'Unknown';
                cellUser.appendChild(pill);

                // User Type
                const cellType = row.insertCell();
                const typeBadge = document.createElement('span');
                typeBadge.className = 'badge ' + (log.userType === 'warden' ? 'warden-badge' : 'student-badge');
                typeBadge.textContent = (log.userType || 'student').toUpperCase();
                cellType.appendChild(typeBadge);

                // Registered Date
                const cellReg = row.insertCell();
                cellReg.textContent = formatDateOnly(log.registered_at);

                // Login Time
                const cellLogin = row.insertCell();
                cellLogin.textContent = formatDateTime(log.login_time);

                // Status
                const cellStatus = row.insertCell();
                const badge = document.createElement('span');
                badge.className = 'badge ' + (log.status === 'Registered' ? 'registered' : (log.status === 'Failure' ? 'failure' : 'success'));
                badge.textContent = log.status;
                cellStatus.appendChild(badge);

                row.onmouseover = () => row.style.cursor = 'pointer';
                row.onmouseout = () => row.style.cursor = 'default';
            });
        }

        // Filtering logic
        function filterLogs() {
            const usernameFilter = (usernameFilterInput.value || '').trim().toLowerCase();
            const dateFilterValue = dateFilterInput.value; // yyyy-mm-dd

            const filtered = combinedLogs.filter(l => {
                const matchesUsername = !usernameFilter || (l.username || '').toLowerCase().includes(usernameFilter);

                let matchesDate = true;
                if (dateFilterValue) {
                    const logDate = new Date(l.login_time).toISOString().split('T')[0];
                    matchesDate = logDate === dateFilterValue;
                }
                return matchesUsername && matchesDate;
            });

            renderLogs(filtered);
        }

        // Sorting
        let sortDirection = {};
        function sortTable(columnIndex) {
            // 0 username, 1 userType, 2 registered_at, 3 login_time, 4 status
            const keyMap = ['username','userType','registered_at','login_time','status'];
            const key = keyMap[columnIndex];
            const dir = sortDirection[key] === 'asc' ? 'desc' : 'asc';
            sortDirection = {}; sortDirection[key] = dir;

            const sorted = combinedLogs.slice().sort((a,b) => {
                let A = a[key] || '';
                let B = b[key] || '';

                if (key === 'registered_at' || key === 'login_time') {
                    A = new Date(A || 0);
                    B = new Date(B || 0);
                    return dir === 'asc' ? A - B : B - A;
                }
                A = String(A).toUpperCase();
                B = String(B).toUpperCase();
                if (A < B) return dir === 'asc' ? -1 : 1;
                if (A > B) return dir === 'asc' ? 1 : -1;
                return 0;
            });

            renderLogs(sorted);
            document.querySelectorAll('th i').forEach(icon => icon.className = 'ri-sort-asc');
            const headerIcon = document.querySelector(`th:nth-child(${columnIndex+1}) i`);
            if (headerIcon) headerIcon.className = dir === 'asc' ? 'ri-sort-asc' : 'ri-sort-desc';
        }

        // Export CSV helper
        function downloadCSV() {
            if (!combinedLogs || combinedLogs.length === 0) return alert('No logs to export');
            const header = ['Username','User Type','Registered Date','Event Time','Status'];
            const rows = combinedLogs.map(r => [
                (r.username||''),
                (r.userType || 'student'),
                formatDateOnly(r.registered_at),
                formatDateTime(r.login_time),
                r.status
            ]);
            const csv = [header, ...rows].map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
            const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `warden-visitor-logs-${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        // initial load
        window.addEventListener('load', fetchVisitorLogs);
    </script>

    <style>
      /* small styles to distinguish badges — reuse your visitor.css where possible */
      .pill { display:inline-block; padding:6px 10px; border-radius:999px; background:#eef2ff; color:#0b3bff; font-weight:600; }
      .badge { display:inline-block; padding:6px 8px; border-radius:8px; font-weight:600; font-size:12px; }
      .warden-badge { background:#fde68a; color:#92400e; } /* amber */
      .student-badge { background:#bbf7d0; color:#065f46; } /* green */
      .registered { background:#e0f2fe; color:#075985; }
      .success { background:#ecfdf5; color:#065f46; }
      .failure { background:#fff1f2; color:#9f1239; }
    </style>
</body>
</html>
