<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Feedback — Hostel Management</title>
  <link href="index.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .star { cursor:pointer; font-size:28px; transition: transform .12s ease; }
    .star.off { color: #cbd5e1; transform: scale(.98); }
    .card { background: white; border-radius: 14px; box-shadow: 0 10px 30px rgba(2,6,23,.08); padding:24px; max-width:900px; margin:auto; }
    .fade-up { transform: translateY(10px); opacity: 0; animation: fadeUp .6s ease forwards; }
    @keyframes fadeUp { to { transform: translateY(0); opacity: 1; } }
    header nav .back-btn {
  background: linear-gradient(135deg, #ff416c, #ff4b2b);
  padding: 12px 22px;
  border-radius: 14px;
  font-size: 1rem;
  font-weight: 600;
  color: white;
  transition: 0.3s ease;
  text-decoration: none;
  box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
}

header nav .back-btn:hover {
  background: linear-gradient(135deg, #ff4b2b, #ff416c);
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 8px 25px rgba(255, 75, 43, 0.6);
}
  </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

  <!-- NAV -->
  <header class="bg-gradient-to-r from-sky-700 to-teal-600 text-white">
    <div class="container mx-auto px-6 py-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-xl font-bold">H</div>
        <div>
          <div class="text-lg font-bold tracking-wide">HOSTEL MANAGEMENT</div>
          <div class="text-sm opacity-90">Feedback</div>
        </div>
      </div>
      <nav>
      <a href="home.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
      </a>
    </nav>
    </div>
  </header>

  <main class="py-20">
    <div class="card fade-up">
      <h1 class="text-2xl font-bold mb-2">Tell us what you think</h1>
      <p class="text-gray-600 mb-6">Your feedback helps improve the hostel management system. Honest reviews welcome.</p>

      <form id="feedbackForm" class="space-y-4">
       <div>
  <label class="block text-sm font-semibold mb-1">Name</label>
  <input type="text" id="name" name="name" 
         readonly tabindex="-1"
         class="w-full p-3 text-base rounded-md border border-gray-300 bg-gray-100"
         style="pointer-events:none;">
</div>


        <div>
  <label class="block text-sm font-semibold mb-1">Email</label>
  <input type="email" id="email" name="email" 
         readonly tabindex="-1"
         class="w-full p-3 text-base rounded-md border border-gray-300 bg-gray-100"
         style="pointer-events:none;">
</div>


        <div>
          <label class="block text-sm font-semibold mb-2">Rating</label>
          <div id="stars" class="flex gap-2" aria-hidden="true">
            <span class="star off" data-value="1">★</span>
            <span class="star off" data-value="2">★</span>
            <span class="star off" data-value="3">★</span>
            <span class="star off" data-value="4">★</span>
            <span class="star off" data-value="5">★</span>
          </div>
          <input type="hidden" id="rating" value="0" />
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Describe <span class="text-red-500">*</span></label>
          <textarea id="describe" rows="6" required class="w-full mt-1 p-3 rounded-md border border-gray-200 focus:ring-2 focus:ring-sky-300" placeholder="Describe your experience (required)"></textarea>
        </div>

        <div class="flex items-center gap-3">
          <button type="submit" class="bg-sky-600 text-white px-5 py-3 rounded-md font-semibold shadow hover:shadow-lg transition">Send Feedback</button>
          <button type="button" id="clearBtn" class="px-4 py-3 rounded-md border">Clear</button>
          <div id="submitNote" class="text-sm text-gray-500 ml-auto"></div>
        </div>
      </form>
    </div>
  </main>

  <footer class="border-t py-6 text-center text-sm text-gray-600">© 2025 Hostel Management System</footer>

  <script>
    // localStorage key used by admin/feedback pages
    const STORAGE_KEY = 'hms_feedbacks_v1';

    // autofill name/email from register (register stores "userData" on successful registration/login)
    (function autoFillFromUser() {
  try {
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');

    // 1) try structured userData (register stores this)
    let user = null;
    try { user = JSON.parse(localStorage.getItem('userData') || 'null'); } catch(e){ user = null; }

    // 2) fallback: login may store separate keys
    const usernameKey = localStorage.getItem('username') || localStorage.getItem('user') || null;
    const userEmailKey = localStorage.getItem('userEmail') || localStorage.getItem('email') || localStorage.getItem('user_email') || null;

    // Use userData if it exists
    if (user && typeof user === 'object') {
      if (user.username && nameInput && !nameInput.value) nameInput.value = user.username;
      if (user.email && emailInput && !emailInput.value) emailInput.value = user.email;
      return;
    }

    // Otherwise use separate keys set by login flow
    if (usernameKey && nameInput && !nameInput.value) nameInput.value = usernameKey;
    if (userEmailKey && emailInput && !emailInput.value) emailInput.value = userEmailKey;

    // small convenience: if only username exists and it looks like email, set email too
    if (!emailInput.value && usernameKey && usernameKey.includes('@') && !userEmailKey) {
      emailInput.value = usernameKey;
    }
  } catch (err) {
    // silent fail — don't block form if localStorage unavailable
    console.warn('autofillFromUser error', err);
  }
})();

    function loadFeedbacks(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }catch(e){ return []; } }
    function saveFeedbacks(arr){ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }

    // Stars UI
    const stars = document.querySelectorAll('.star');
    const ratingInput = document.getElementById('rating');
    let currentRating = 0;
    function renderStars(n){
      stars.forEach(s => {
        const v = Number(s.dataset.value);
        s.classList.toggle('off', v > n);
        s.style.color = (v <= n) ? '#f59e0b' : '';
      });
    }
    stars.forEach(s => {
      s.addEventListener('click', () => {
        currentRating = Number(s.dataset.value);
        ratingInput.value = currentRating;
        renderStars(currentRating);
      });
      s.addEventListener('mouseenter', () => renderStars(Number(s.dataset.value)));
    });
    document.querySelector('form').addEventListener('mouseleave', () => renderStars(currentRating));

    function escapeHtml(s){ return String(s || '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

    // form submit with required "describe" validation
    const form = document.getElementById('feedbackForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const rating = Number(document.getElementById('rating').value || 0);
      const describe = document.getElementById('describe').value.trim();

      if (rating < 1){ alert('Please provide a rating (1 to 5).'); return; }
      if (!describe){ alert('Please describe your experience — this field is required.'); document.getElementById('describe').focus(); return; }

      const arr = loadFeedbacks();
      const feedback = {
        id: Date.now() + Math.floor(Math.random()*999),
        created: new Date().toISOString(),
        name, email, rating, comment: describe,
        show: false // only admin can toggle publish
      };
      arr.unshift(feedback);
      saveFeedbacks(arr);

      // UX
      form.reset();
      currentRating = 0; renderStars(0);
      document.getElementById('submitNote').textContent = 'Thanks — feedback saved!';
      setTimeout(()=> document.getElementById('submitNote').textContent = '', 3000);

      setTimeout(() => {
    window.history.back(); // goes to last visited page
}, 500);
    });

    document.getElementById('clearBtn').addEventListener('click', () => { form.reset(); currentRating = 0; renderStars(0); });
    renderStars(0);
  </script>
</body>
</html>
