<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Feedback — Hostel Management</title>
<link href="index.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* quick form-specific tweaks so it looks integrated with your index.css */
.star { cursor:pointer; font-size:28px; }
.star.off { opacity:.28; }
.card { background: white; border-radius: 12px; box-shadow: 0 8px 30px rgba(2,6,23,.08); padding:20px; }
</style>
</head>
<body class="bg-gray-100">
<header class="site-header container">
<div class="container" style="display:flex;align-items:center;gap:18px;justify-content:space-between;">
<a class="brand" href="index.html"><div class="brand-mark">H</div>
<div><div class="brand-title">HOSTEL MANAGEMENT</div>
<div class="brand-sub">Feedback</div></div>
</a>
<nav class="primary">
<a href="index.html">Home</a>
<a href="admin-feedback.html">Admin</a>
</nav>
</div>
</header>


<main class="container content-top-padding py-16">
<div class="grid md:grid-cols-2 gap-10">
<div class="card">
<h2 class="text-2xl font-bold mb-4">Tell us what you think</h2>
<p class="text-gray-600 mb-6">Your feedback helps us improve the hostel management system.</p>


<form id="feedbackForm" class="space-y-4">
<div>
<label class="block text-sm font-semibold">Name</label>
<input id="name" class="w-full mt-1 p-3 rounded-md border" placeholder="Optional" />
</div>
<div>
<label class="block text-sm font-semibold">Email</label>
<input id="email" class="w-full mt-1 p-3 rounded-md border" placeholder="Optional" />
</div>


<div>
<label class="block text-sm font-semibold">Rating</label>
<div id="stars" class="mt-2" aria-hidden="true">
<span class="star off" data-value="1">★</span>
<span class="star off" data-value="2">★</span>
<span class="star off" data-value="3">★</span>
<span class="star off" data-value="4">★</span>
</html>
